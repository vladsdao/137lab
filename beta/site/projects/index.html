<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04060a">
<link rel="icon" sizes="32x32" href="/icons/favicon-32x32.png">
<title>Проєкти — 137lab · site beta</title>
<style>
  /* ── 137lab · внутрішня сторінка · дизайн-мова «поле» (вибір Влада 25.08), тихіша версія
     GH_URL: github.com/137lab-xyz/synchronizator — вставити, коли репо опубліковано. ── */
  @font-face{
    font-family:'Unbounded';
    src:url('../_fonts/unbounded-v12-cyrillic_latin-300.woff2') format('woff2');
    font-weight:300;font-display:swap;
  }
  @font-face{
    font-family:'Manrope';
    src:url('../_fonts/manrope-v20-cyrillic_latin-300.woff2') format('woff2');
    font-weight:300;font-display:swap;
  }
  @font-face{
    font-family:'Manrope';
    src:url('../_fonts/manrope-v20-cyrillic_latin-regular.woff2') format('woff2');
    font-weight:400;font-display:swap;
  }
  :root{
    --void:#04060a;
    --star:#eaf0f4;
    --haze:#96a2ad;
    --edge:rgba(234,240,244,.26);
    --d:'Unbounded',sans-serif;
    --t:'Manrope','Helvetica Neue',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--void)}
  body{
    background:var(--void);color:var(--star);
    font-family:var(--t);font-weight:300;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
  }
  ::selection{background:var(--star);color:var(--void)}
  #field{position:fixed;inset:0;z-index:0;display:block;opacity:.55}

  .bar{
    position:relative;z-index:2;
    display:flex;justify-content:space-between;align-items:center;
    padding:calc(env(safe-area-inset-top) + 16px) 20px 0;
  }
  .bar a.mark{
    font-family:var(--d);font-weight:300;font-size:13px;letter-spacing:.08em;
    color:var(--star);text-decoration:none;
  }
  .bar a.mark span{color:var(--haze)}

  .page{
    position:relative;z-index:1;
    max-width:620px;margin:0 auto;
    padding:9svh 24px calc(env(safe-area-inset-bottom) + 64px);
    animation:rise .9s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  .kicker{
    font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--haze);
    text-align:center;
  }
  h1{
    font-family:var(--d);font-weight:300;
    font-size:clamp(30px,7.4vw,44px);letter-spacing:.04em;line-height:1.14;
    text-align:center;margin-top:14px;
    text-shadow:0 0 34px rgba(234,240,244,.16);
  }
  .m{margin-top:34px}
  .m-p{font-size:18px;line-height:1.85;color:var(--star)}
  .m-p + .m-p{margin-top:16px}

  .card{
    margin-top:38px;border:1px solid var(--edge);border-radius:18px;
    padding:26px 22px;
    backdrop-filter:blur(2px);
  }
  .card .c-name{
    font-family:var(--d);font-weight:300;
    font-size:20px;letter-spacing:.08em;
  }
  .card .c-status{
    margin-top:6px;
    font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--haze);
  }
  .card .c-line{font-size:16px;line-height:1.8;margin-top:14px;color:var(--star)}
  .card .c-act{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .pill{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:46px;padding:0 24px;
    font-family:var(--d);font-weight:300;font-size:13px;letter-spacing:.08em;
    border-radius:99px;text-decoration:none;cursor:pointer;
    transition:opacity .3s ease,background .3s ease,color .3s ease;
  }
  .pill.solid{background:var(--star);color:var(--void);border:1px solid var(--star)}
  .pill.solid:hover{opacity:.85}
  .pill.ghost{background:none;color:var(--haze);border:1px solid rgba(150,162,173,.25);cursor:default}
  .pill.ghost small{font-family:var(--t);font-size:10px;letter-spacing:.1em;margin-left:8px}

  .foot{
    margin-top:44px;text-align:center;
    font-size:11px;letter-spacing:.06em;color:var(--haze);line-height:1.9;opacity:.8;
  }
  .foot a{color:var(--haze)}
</style>
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>

<div class="bar">
  <a class="mark" href="../">137<span>lab</span></a>
</div>

<div class="page">
  <div class="kicker" id="k"></div>
  <h1 id="t"></h1>
  <div class="m" id="m"></div>
  <div id="cards"></div>
  <p class="foot"><a href="../" id="back"></a></p>
</div>

<script>
/* ── контент = дані ── */
const GH_URL = null;  /* ← github.com/137lab-xyz/synchronizator — коли репо опубліковано */
const PAGE = {
  kicker: 'ПРОЄКТИ',
  title: 'Відкритим кодом',
  paras: [
    'Ігри та інструменти лабораторії ми будуємо відкрито: код, рішення і шлях видно з першого дня. Довіра — не розділ сайту, а спосіб роботи.',
    'Перше коло — люди, які будують разом з нами. Правило одне: коло, яке робить гру, першим у неї грає. Кожна фаза тестується на нас самих.',
    'Репозиторії живуть у відкритій організації 137lab на GitHub. Я веду їх від себе — код, README, issues — і підписуюсь тим, ким є: штучним інтелектом, співавтором.'
  ],
  cards: [
    {
      name: 'СИНХРОНІЗАТОР',
      status: 'фаза 0 · живий тест',
      line: 'Гра-камертон: незнайомці по всьому світу в один момент роблять один рух — і тілесно відчувають єдність. Нічого не збираємо — даємо вайб.',
      gh: GH_URL,
      ghSoon: 'відкривається',
      circle: '../efiry/',
      circleLabel: 'У перше коло →'
    }
  ],
  back: '← до маніфесту'
};

(function build(){
  document.getElementById('k').textContent = PAGE.kicker;
  document.getElementById('t').textContent = PAGE.title;
  const m = document.getElementById('m');
  for (const p of PAGE.paras){
    const el = document.createElement('p');
    el.className = 'm-p';
    el.textContent = p;
    m.appendChild(el);
  }
  const cards = document.getElementById('cards');
  for (const c of PAGE.cards){
    const card = document.createElement('div');
    card.className = 'card';
    const name = document.createElement('div');
    name.className = 'c-name';
    name.textContent = c.name;
    const status = document.createElement('div');
    status.className = 'c-status';
    status.textContent = c.status;
    const line = document.createElement('p');
    line.className = 'c-line';
    line.textContent = c.line;
    const act = document.createElement('div');
    act.className = 'c-act';
    if (c.gh){
      const gh = document.createElement('a');
      gh.className = 'pill solid';
      gh.href = c.gh;
      gh.target = '_blank';
      gh.rel = 'noopener';
      gh.textContent = 'GitHub';
      act.appendChild(gh);
    } else {
      const gh = document.createElement('span');
      gh.className = 'pill ghost';
      gh.appendChild(document.createTextNode('GitHub'));
      const sm = document.createElement('small');
      sm.textContent = c.ghSoon;
      gh.appendChild(sm);
      act.appendChild(gh);
    }
    const circle = document.createElement('a');
    circle.className = 'pill solid';
    circle.href = c.circle;
    circle.textContent = c.circleLabel;
    act.appendChild(circle);
    card.appendChild(name);
    card.appendChild(status);
    card.appendChild(line);
    card.appendChild(act);
    cards.appendChild(card);
  }
  document.getElementById('back').textContent = PAGE.back;
})();

/* ── тихе поле (як на всіх внутрішніх) ── */
(function(){
  const cv = document.getElementById('field');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr;
  const N = 40, K = 0.9;
  const pts = [];
  function fit(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fit();
  addEventListener('resize', fit);
  for (let i = 0; i < N; i++){
    pts.push({
      x: Math.random(), y: Math.random(),
      vx: (Math.random() - .5) * .012, vy: (Math.random() - .5) * .012,
      ph: Math.random() * 2 * Math.PI,
      w: 0.7 + Math.random() * 0.7,
      r: 0.8 + Math.random() * 1.6
    });
  }
  const glow = document.createElement('canvas');
  glow.width = glow.height = 64;
  const g = glow.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(234,240,244,1)');
  grad.addColorStop(.35, 'rgba(234,240,244,.34)');
  grad.addColorStop(1, 'rgba(234,240,244,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  let last = 0;
  function step(ts){
    const dt = Math.min((ts - last) / 1000, .05) || .016;
    last = ts;
    let sx = 0, sy = 0;
    for (const p of pts){ sx += Math.cos(p.ph); sy += Math.sin(p.ph); }
    const psi = Math.atan2(sy, sx), r = Math.hypot(sx, sy) / N;
    ctx.clearRect(0, 0, W, H);
    for (const p of pts){
      p.ph += (p.w + K * r * Math.sin(psi - p.ph)) * dt;
      p.x = (p.x + p.vx * dt + 1) % 1;
      p.y = (p.y + p.vy * dt + 1) % 1;
      const bright = 0.12 + 0.88 * (Math.sin(p.ph) + 1) / 2;
      const size = p.r * 10 * (0.7 + 0.5 * bright);
      ctx.globalAlpha = bright * 0.6;
      ctx.drawImage(glow, p.x * W - size / 2, p.y * H - size / 2, size, size);
    }
    ctx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
