<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f0e4">
<title>137lab · проба B — папір</title>
<style>
  /* ── ПРОБА B · «ПАПІР / перша сторінка книги» ──
     Теплий крем + чорнило, сериф Piazzolla (свіжий, локальний woff2 — не з репо),
     буквиця, маргіналія на полях (десктоп), зміст із крапковими лідерами, флерон.
     Текст = маніфест v3, не змінювався. Експеримент за словом Влада 25.08. ── */
  @font-face{
    font-family:'Piazzolla';
    src:url('../_fonts/piazzolla-v42-cyrillic_latin-regular.woff2') format('woff2');
    font-weight:400;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:'Piazzolla';
    src:url('../_fonts/piazzolla-v42-cyrillic_latin-italic.woff2') format('woff2');
    font-weight:400;font-style:italic;font-display:swap;
  }
  @font-face{
    font-family:'Piazzolla';
    src:url('../_fonts/piazzolla-v42-cyrillic_latin-600.woff2') format('woff2');
    font-weight:600;font-style:normal;font-display:swap;
  }
  :root{
    --cream:#f6f0e4;
    --ink:#241e14;
    --faded:#93876f;
    --hair:#d9cfba;
    --serif:'Piazzolla','Iowan Old Style',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--cream)}
  body{
    background:
      linear-gradient(180deg, rgba(36,30,20,.035), rgba(36,30,20,0) 140px),
      var(--cream);
    color:var(--ink);
    font-family:var(--serif);font-weight:400;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
  }
  ::selection{background:var(--ink);color:var(--cream)}

  .lang{
    position:absolute;top:0;right:0;
    display:flex;gap:2px;
    padding:calc(env(safe-area-inset-top) + 16px) 18px 0;
  }
  .lang button{
    font-family:var(--serif);font-size:11px;letter-spacing:.14em;
    background:none;border:none;color:var(--faded);
    padding:4px 6px;cursor:pointer;
  }
  .lang button.on{color:var(--ink);border-bottom:1px solid var(--hair)}

  .page{
    max-width:620px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 64px) 26px calc(env(safe-area-inset-bottom) + 60px);
  }

  .halftitle{
    text-align:center;
    font-size:13px;letter-spacing:.5em;text-transform:uppercase;
    color:var(--ink);
  }
  .halftitle .lab{color:var(--faded)}
  .rule{
    width:52px;height:1px;background:var(--hair);
    margin:26px auto;
  }
  .kicker{
    text-align:center;
    font-size:11.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--faded);
  }

  .book{margin-top:44px}
  .verse{position:relative}
  .verse p{
    font-size:19px;line-height:1.78;
    text-indent:1.6em;
  }
  .verse:first-child p{text-indent:0}
  .verse + .verse{margin-top:8px}
  .verse.first p::first-letter{
    float:left;
    font-size:74px;line-height:.82;
    font-weight:600;
    padding:8px 12px 0 0;
  }
  .verse.last p{
    margin-top:26px;text-indent:0;text-align:center;
    font-style:italic;
  }
  .side{
    display:none;
    position:absolute;top:8px;left:calc(100% + 30px);
    width:120px;
    font-size:12.5px;font-style:italic;line-height:1.6;color:var(--faded);
  }
  @media (min-width:960px){ .side{display:block} }

  .fleuron{
    text-align:center;margin:40px 0 0;
    font-size:20px;color:var(--ink);
  }

  .toc{margin-top:44px}
  .toc .cap{
    font-size:11.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--faded);
    text-align:center;
  }
  .toc ul{list-style:none;margin-top:18px}
  .toc a,.toc .soon{
    display:flex;align-items:baseline;gap:10px;
    padding:9px 0;
    color:var(--ink);text-decoration:none;
    font-size:17px;
  }
  .toc .leader{
    flex:1;border-bottom:1px dotted var(--hair);
    transform:translateY(-4px);
  }
  .toc .arr{color:var(--faded)}
  .toc a:hover .arr{color:var(--ink)}
  .toc .soon{color:var(--faded)}
  .toc .soon i{font-style:italic;font-size:13px}

  .colophon{
    margin-top:52px;text-align:center;
    font-size:12px;font-style:italic;color:var(--faded);line-height:1.9;
  }
</style>
</head>
<body>

<nav class="lang" aria-label="Мова">
  <button data-lang="ua" class="on">УКР</button>
  <button data-lang="ru">РУС</button>
  <button data-lang="en">ENG</button>
</nav>

<div class="page">
  <div class="halftitle">137<span class="lab">lab</span></div>
  <div class="rule"></div>
  <div class="kicker" id="kicker"></div>

  <div class="book" id="book"></div>

  <div class="fleuron" aria-hidden="true">❦</div>

  <nav class="toc">
    <div class="cap" id="toccap"></div>
    <ul id="doors"></ul>
  </nav>

  <p class="colophon"><span id="footline"></span><br><span id="draftnote"></span></p>
</div>

<script>

      '137lab — лабораторія дослідження свідомості. Влад і Ліза досліджують океан свідомості так, як Кусто досліджував океан води: не з берега — зсередини. З занурень вони приносять інструменти і ключі — акваланг для тих, хто хоче дихати глибше. Я тримаю мапи, будую двері та кажу чесно, коли мапа розходиться з територією.',

      { name: 'Проєкти', href: '../../projects/' },
      { name: 'Ефіри', href: '../../efiry/' },
      { name: 'Блог', soon: 'записується' }
    ],
    foot: 'проба B · «папір» · текст — маніфест v3',
    draft: ''
  },

    ],
    side: 'α ≈ 1/137,036 — измерено; почему — неизвестно',

      { name: 'Проекты', href: '../../projects/' },

      'We do not sell treasure maps and we do not promise enlightenment. We guide — into the world of the metaphysical game of yourself, where you are the protagonist, not a character in someone else’s script.',
      'A new era is coming in: consciousness, symbiosis, energy, technology, creativity. We make games and doors for it — open source, in plain sight. The first one is Synchronizator: a game in which strangers across the world make one movement at one moment.',

    side: 'α ≈ 1/137.036 — measured; why — unknown',
    toccap: 'CONTENTS',
    doors: [

      { name: 'Streams', href: '../../efiry/' },

    foot: 'probe B · “paper” · text — manifesto v3',
    draft: 'draft translation — to be finalized after the direction is chosen'
  }
};
const LANGKEY = '137lab-probe-lang';

function render(lang){
  const t = I18N[lang];
  document.documentElement.lang = lang === 'ua' ? 'uk' : lang;
  document.getElementById('kicker').textContent = t.kicker;
  const book = document.getElementById('book');
  book.replaceChildren();
  t.paras.forEach((text, i) => {
    const v = document.createElement('div');
    v.className = 'verse'
      + (i === 0 ? ' first' : '')
      + (i === t.paras.length - 1 ? ' last' : '');
    const p = document.createElement('p');
    p.textContent = text;
    v.appendChild(p);
    if (i === 2){                       /* маргіналія біля абзаца про 1/137 */
      const s = document.createElement('span');
      s.className = 'side';
      s.textContent = t.side;
      v.appendChild(s);
    }
    book.appendChild(v);
  });
  document.getElementById('toccap').textContent = t.toccap;
  const doors = document.getElementById('doors');
  doors.replaceChildren();
  for (const d of t.doors){
    const li = document.createElement('li');
    if (d.soon){
      const s = document.createElement('span');
      s.className = 'soon';
      s.appendChild(document.createTextNode(d.name));
      const lead = document.createElement('span');
      lead.className = 'leader';
      s.appendChild(lead);
      const i2 = document.createElement('i');
      i2.textContent = d.soon;
      s.appendChild(i2);
      li.appendChild(s);
    } else {
      const a = document.createElement('a');
      a.href = d.href;
      a.appendChild(document.createTextNode(d.name));
      const lead = document.createElement('span');
      lead.className = 'leader';
      a.appendChild(lead);
      const arr = document.createElement('span');
      arr.className = 'arr';
      arr.textContent = '→';
      a.appendChild(arr);
      li.appendChild(a);
    }
    doors.appendChild(li);
  }
  document.getElementById('footline').textContent = t.foot;
  document.getElementById('draftnote').textContent = t.draft;
  document.querySelectorAll('.lang button').forEach(b =>
    b.classList.toggle('on', b.dataset.lang === lang));
}
document.querySelectorAll('.lang button').forEach(b =>
  b.addEventListener('click', () => { localStorage.setItem(LANGKEY, b.dataset.lang); render(b.dataset.lang); }));
render(localStorage.getItem(LANGKEY) || 'ua');
</script>
</body>
</html>
