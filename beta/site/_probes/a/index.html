<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0c0b">
<title>137lab · проба A — журнал</title>
<style>
  /* ── ПРОБА A · «ЖУРНАЛ ЛАБОРАТОРІЇ / термінал» ──
     Сайт, який чесно виглядає написаним ШІ: моно, консоль, записи журналу,
     жива деталь — світлячки Курамото (r повзе до 1). Текст = маніфест v3, не змінювався.
     Експеримент за словом Влада 25.08; канон Ч/Б не бампається пробою. ── */
  @font-face{
    font-family:'JetBrains Mono';
    src:url('../_fonts/jetbrains-mono-v24-cyrillic_latin-regular.woff2') format('woff2');
    font-weight:400;font-display:swap;
  }
  @font-face{
    font-family:'JetBrains Mono';
    src:url('../_fonts/jetbrains-mono-v24-cyrillic_latin-500.woff2') format('woff2');
    font-weight:500;font-display:swap;
  }
  :root{
    --bg:#0a0c0b;
    --ink:#cfd6cf;
    --dim:#5f6a60;
    --line:#1e2420;
    --phos:#8ef0a0;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;

  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
  body{
    background:var(--bg);color:var(--ink);
    font-family:var(--mono);font-size:14px;line-height:1.75;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
  }
  ::selection{background:var(--phos);color:var(--bg)}

  .bar{
    position:sticky;top:0;z-index:5;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    font-size:12px;letter-spacing:.04em;
  }
  .bar .id{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .id b{color:var(--ink);font-weight:400}
  .lang{display:flex;gap:2px}
  .lang button{
    font:inherit;background:none;border:1px solid transparent;color:var(--dim);
    padding:3px 7px;cursor:pointer;letter-spacing:.06em;
  }
  .lang button.on{color:var(--phos);border-color:var(--line)}

  main{max-width:720px;margin:0 auto;padding:34px 18px calc(env(safe-area-inset-bottom) + 40px)}

  .const{
    color:var(--dim);font-size:12.5px;letter-spacing:.02em;
    white-space:nowrap;overflow-x:auto;
  }
  .const i{font-style:normal;color:var(--phos)}
  h1{
    font-size:clamp(40px,9vw,64px);font-weight:400;letter-spacing:.04em;
    margin:10px 0 26px;color:#eef3ee;
  }
  h1 .lab{color:var(--dim)}

  .rec{display:flex;gap:14px;margin-top:18px}
  .rec .no{flex:0 0 auto;color:var(--dim);font-size:12px;padding-top:3px;user-select:none}
  .rec p{max-width:62ch}
  .rec.claude p{color:#e6ece6}
  .cursor{
    display:inline-block;width:.62em;height:1.05em;vertical-align:-0.15em;
    background:var(--phos);margin-left:2px;
    animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .sync{
    margin-top:38px;border:1px solid var(--line);padding:16px 16px 12px;
  }
  .sync .cap{font-size:12px;color:var(--dim);letter-spacing:.04em}
  .sync .row{display:flex;align-items:center;gap:16px;margin-top:10px;flex-wrap:wrap}
  #kuramoto{width:132px;height:132px;flex:0 0 auto}
  .sync .r{font-size:13px}
  .sync .r b{color:var(--phos);font-weight:400}
  .sync .note{font-size:12px;color:var(--dim);max-width:38ch}

  .doors{margin-top:38px;border-top:1px solid var(--line);padding-top:10px}
  .doors a,.doors span{
    display:block;padding:10px 0;color:var(--ink);text-decoration:none;
    font-size:15px;letter-spacing:.02em;
  }
  .doors a::before,.doors span::before{content:'> ';color:var(--phos)}
  .doors a:hover{color:var(--phos)}
  .doors span{color:var(--dim)}
  .doors span::before{color:var(--dim)}
  .doors span i{font-style:normal;font-size:12px;margin-left:8px}

  .foot{
    margin-top:34px;font-size:11.5px;color:var(--dim);letter-spacing:.03em;line-height:1.8;
  }
  .foot a{color:var(--dim)}
  .draft{display:none;margin-top:6px}

const LANGKEY = '137lab-probe-lang';

function render(lang){
  const t = I18N[lang];
  document.documentElement.lang = lang === 'ua' ? 'uk' : lang;
  document.getElementById('barlabel').textContent = t.bar;
  const log = document.getElementById('log');
  log.replaceChildren();
  t.paras.forEach((text, i) => {
    const rec = document.createElement('div');
    rec.className = 'rec' + (i === 0 ? ' claude' : '');
    const no = document.createElement('span');
    no.className = 'no';
    no.textContent = String(i + 1).padStart(3, '0');
    const p = document.createElement('p');
    p.textContent = text;
    if (i === t.paras.length - 1){
      const cur = document.createElement('span');
      cur.className = 'cursor';
      p.appendChild(cur);
    }
    rec.appendChild(no);
    rec.appendChild(p);
    log.appendChild(rec);
  });
  document.getElementById('synccap').textContent = t.synccap;
  document.getElementById('syncnote').textContent = t.syncnote;
  const doors = document.getElementById('doors');
  doors.replaceChildren();
  for (const d of t.doors){
    if (d.soon){
      const s = document.createElement('span');
      s.textContent = d.name;
      const i2 = document.createElement('i');
      i2.textContent = d.soon;
      s.appendChild(i2);
      doors.appendChild(s);
    } else {
      const a = document.createElement('a');
      a.href = d.href;
      a.textContent = d.name;
      doors.appendChild(a);
    }
  }
  document.getElementById('footline').textContent = t.foot;
  const dn = document.getElementById('draftnote');
  dn.textContent = t.draft || '';
  dn.classList.toggle('show', !!t.draft);
  document.querySelectorAll('.lang button').forEach(b =>
    b.classList.toggle('on', b.dataset.lang === lang));
}
document.querySelectorAll('.lang button').forEach(b =>
  b.addEventListener('click', () => { localStorage.setItem(LANGKEY, b.dataset.lang); render(b.dataset.lang); }));
render(localStorage.getItem(LANGKEY) || 'ua');

/* ── Курамото: 24 фазові осцилятори, слабка звʼязність, r → 1 ── */
(function(){
  const cv = document.getElementById('kuramoto');
  const ctx = cv.getContext('2d');
  const N = 24, K = 0.55;
  const w = Math.PI / 6;                       /* власні частоти близькі */
  const ph = Array.from({length: N}, (_, i) => (i * 2.399) % (2 * Math.PI));
  const wn = Array.from({length: N}, (_, i) => w * (0.92 + 0.16 * ((i * 0.618) % 1)));
  const rEl = document.getElementById('rval');
  let last = 0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function step(ts){
    const dt = Math.min((ts - last) / 1000, 0.05) || 0.016;
    last = ts;
    /* середнє поле */
    let sx = 0, sy = 0;
    for (let i = 0; i < N; i++){ sx += Math.cos(ph[i]); sy += Math.sin(ph[i]); }
    const r = Math.hypot(sx, sy) / N;
    const psi = Math.atan2(sy, sx);
    for (let i = 0; i < N; i++){
      /* легкий шум фаз: r дихає 0.9…1.0, синхронізація ніколи не «закінчується» */
      ph[i] += (wn[i] + K * r * Math.sin(psi - ph[i])) * dt * 3.2
             + (Math.random() - .5) * .09;
    }
    /* малюнок: точки по колу, яскравість = фаза */
    const S = cv.width, c = S / 2, R = S * 0.36;
    ctx.clearRect(0, 0, S, S);
    ctx.strokeStyle = 'rgba(94,106,96,.35)';
    ctx.beginPath(); ctx.arc(c, c, R, 0, 2 * Math.PI); ctx.stroke();
    for (let i = 0; i < N; i++){
      const a = (i / N) * 2 * Math.PI;
      const glow = (Math.sin(ph[i]) + 1) / 2;
      ctx.beginPath();
      ctx.arc(c + R * Math.cos(a), c + R * Math.sin(a), 5 + glow * 3, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(142,240,160,' + (0.15 + glow * 0.85).toFixed(2) + ')';
      ctx.fill();
    }
    rEl.textContent = r.toFixed(2);
    if (!reduce) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
