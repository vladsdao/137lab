<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" sizes="32x32" href="/icons/favicon-32x32.png">
<title>Палка — 137lab</title>
<style>
  /* ── 137lab · /palka · v0.16 «белый лист» (слово Влада 09.09, ночь): Палка → Воронка (картинка-символ + договор о выдумке + подпись удержанием)
     → три странички «The Framework» · «Game Over» · «Gameplay»: цитата, тап раскрывает текст, в конце одно слово-отпечаток → Goal.
     Экраны переставляются порядком в SCREENS; кикеры считаются сами, если не заданы. Индикатор и звук сняты; стрелки ← → везде.
     Шаблон — «9 граней» (vlad-space/palka/9-graney.csv); текст — vlad-space/palka/PAGE.md, один к одному.
     Контент = данные (SCREENS). Шрифты локальные ../beta/site/_fonts/. noindex до слова Влада. ── */
  @font-face{font-family:'Unbounded';src:url('../beta/site/_fonts/unbounded-v12-cyrillic_latin-200.woff2') format('woff2');font-weight:200;font-display:swap}
  @font-face{font-family:'Unbounded';src:url('../beta/site/_fonts/unbounded-v12-cyrillic_latin-300.woff2') format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:'Manrope';src:url('../beta/site/_fonts/manrope-v20-cyrillic_latin-300.woff2') format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:'Manrope';src:url('../beta/site/_fonts/manrope-v20-cyrillic_latin-regular.woff2') format('woff2');font-weight:400;font-display:swap}
  :root{
    --paper:#ffffff;
    --ink:#0a0a0a;
    --pad:#333333;
    --muted:#6e6e6e;
    --rule:#c9c9c9;
    --d:'Unbounded',sans-serif;
    --t:'Manrope','Helvetica Neue',sans-serif;
    --vvh:100svh;
    --navh:calc(84px + env(safe-area-inset-bottom));
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper)}
  body{color:var(--ink);font-family:var(--t);font-weight:300;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  ::selection{background:var(--ink);color:var(--paper)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  a{color:inherit}
  img{-webkit-user-drag:none;user-select:none}

  #stage{position:fixed;inset:0;height:var(--vvh);overflow:hidden;background:var(--paper);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .scr{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s linear .7s;overflow:hidden;background:var(--paper)}
  .scr.on{opacity:1;visibility:visible;transition:opacity .7s ease}
  .scr.flow{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .col{max-width:640px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top)) 24px var(--navh);min-height:100%}
  .k{font-size:12px;letter-spacing:.14em;color:var(--muted);margin-bottom:26px}
  .p{font-size:18px;line-height:1.65;margin-bottom:22px;color:var(--ink);opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
  .p.lit{opacity:1;transform:none}
  .rise{opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
  .rise.lit{opacity:1;transform:none}
  .cue{font-size:12px;letter-spacing:.14em;color:var(--muted);line-height:1.5}

  /* ── стрелки вперёд-назад — на всех экранах; стрелка вниз — где есть что листать ── */
  #nav button{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));z-index:7;width:48px;height:48px;border-radius:50%;font-size:22px;line-height:1;color:var(--ink);background:var(--paper);border:1px solid var(--rule);display:grid;place-items:center;transition:opacity .5s,border-color .2s}
  #nav button:active{border-color:var(--ink)}
  #nav .prev{left:calc(16px + env(safe-area-inset-left))}
  #nav .next{right:calc(16px + env(safe-area-inset-right))}
  #nav .down{left:50%;transform:translateX(-50%);border-color:transparent;pointer-events:none;animation:bounce 1.6s ease-in-out infinite}
  #nav button[hidden]{display:none}
  @keyframes bounce{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}

  #dev{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));z-index:7;display:flex;gap:6px}
  #dev button{width:30px;height:30px;border:1px solid var(--rule);border-radius:50%;font-size:12px;color:var(--muted);background:var(--paper)}
  #dev button.cur{color:var(--paper);background:var(--ink);border-color:var(--ink)}

  /* ── Палка: афиша — имя сверху по центру, палка по центру, один тап ── */
  .cover{position:absolute;inset:0;touch-action:manipulation;cursor:pointer}
  .stick{position:absolute;display:block;pointer-events:none;transition:opacity 1.8s ease}
  .head{position:absolute;left:24px;right:24px;top:calc(44px + env(safe-area-inset-top));text-align:center;transition:opacity 1.1s ease}
  .head .title{font:200 clamp(44px,12vw,72px)/1 var(--d);color:var(--ink);letter-spacing:-.01em}
  .head .sub{margin-top:14px;font-size:15px;line-height:1.4;color:var(--pad)}
  .head .note{margin-top:8px;font-size:12px;color:var(--muted)}
  .cover .cue{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--paper);border-radius:8px;white-space:nowrap;max-width:calc(100% - 140px);transition:opacity .5s}
  .cover .cue::before{content:'';display:block;width:2px;height:16px;background:var(--ink);animation:blink 1.1s steps(1,end) infinite;flex:none}
  @keyframes blink{50%{opacity:0}}
  #scr-palka.passed .cover .cue{opacity:0}
  @media (orientation:portrait){
    .stick{width:94vh;height:auto;left:calc(50% + 2.67vh);top:50%;transform:translate(-50%,-50%) rotate(-90deg) translateX(-13vh)}
  }
  @media (orientation:landscape){
    .stick{width:100vw;height:auto;left:50%;top:56%;transform:translate(-50%,-50%)}
  }

  /* ── Воронка: картинка-символ, договор о выдумке, круглая кнопка-подпись — в один экран ── */
  #scr-voronka{transition:background-color .3s linear}
  .fcol{max-width:640px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column}
  .fig{position:relative;flex:0 0 auto;height:min(30svh,260px);margin:0 auto 26px;transition:opacity 1.2s ease}
  .funnel{display:block;height:100%;width:auto}
  .ftext{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .ftext .p{color:var(--ptx,var(--ink));font-size:17px;line-height:1.55;margin-bottom:14px}
  .ftext .fcue{font-size:12px;letter-spacing:.06em;color:var(--pmu,var(--muted));margin:18px 0 0;text-align:center}
  .spin{position:relative;width:200px;height:200px;margin:14px auto 0;flex:0 0 auto;opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
  .spin.lit{opacity:1;transform:none}
  .knob{position:absolute;inset:0;border-radius:50%;border:1px solid var(--kb,var(--ink));background:transparent;touch-action:none;cursor:pointer;z-index:1}
  .knob:active{border-width:2px}
  .unwind{position:absolute;inset:0;width:200px;height:200px;overflow:visible;pointer-events:none;z-index:2}
  .unwind text{font:400 15px var(--t);letter-spacing:.02em}
  #scr-voronka.dark .fig{opacity:.25}
  @media (max-height:700px){
    .fig{height:min(24svh,200px);margin-bottom:16px}
    .ftext .p{font-size:16px;margin-bottom:12px}
    .spin,.unwind{width:176px;height:176px}
  }
  @media (orientation:landscape){
    .fcol{flex-direction:row;align-items:center;gap:40px;max-width:980px}
    .fig{height:min(50svh,380px);margin:0}
    .ftext{flex:1}
  }

  /* ── Странички: цитата → тап → текст → одно слово ── */
  .page .col{padding-top:calc(48px + env(safe-area-inset-top));display:flex;flex-direction:column;min-height:100%}
  .page .k{margin-bottom:22px}
  .quote{margin:auto 0;cursor:pointer;transition:margin .6s ease}
  .qtext{font:300 clamp(21px,5.8vw,32px)/1.28 var(--d);letter-spacing:-.01em;color:var(--ink)}
  .qauthor{margin-top:16px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
  .qsrc{display:block;margin-top:6px;letter-spacing:.04em;color:var(--rule);font-size:11px}
  .swipe{position:relative;width:2px;height:40px;margin:34px 0 0 6px;background:var(--rule);border-radius:1px}
  .swipe i{position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink);animation:swipe 1.8s ease-in-out infinite}
  @keyframes swipe{0%{transform:translateY(34px);opacity:0}20%{opacity:1}70%{transform:translateY(-2px);opacity:1}100%{transform:translateY(-6px);opacity:0}}
  .page.open .quote{display:none}
  .unfold{display:none}
  .page.open .unfold{display:block}
  .unfold .p{font-size:16px;line-height:1.6;margin-bottom:18px}
  .unfold .pbig{font:300 clamp(20px,5.2vw,27px)/1.25 var(--d);letter-spacing:-.01em;margin:8px 0 22px}
  .unfold .pnote{font-size:14px;line-height:1.55;color:var(--pad);padding:14px 16px;border:1px solid var(--rule);border-radius:12px;margin:6px 0 22px}
  .unfold .pnote b{display:block;font-weight:400;font-size:12px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
  .unfold .pbut{font:400 16px/1.6 var(--t);margin-bottom:8px}
  .mark{margin-top:26px;padding-top:22px;border-top:1px solid var(--rule)}
  .mark label{display:block;font-size:13px;line-height:1.5;color:var(--muted);margin-bottom:12px}
  .mark .field input{height:48px;font-size:16px;border-color:var(--rule)}
  .mark .field input:focus{border-color:var(--ink)}
  .mark .field button{width:48px;height:48px;border-color:var(--rule)}
  .mark.sent .field{opacity:.35;transition:opacity .8s}
  .page:not(.open) .mark{display:none}

  /* ── Goal: длинный текст, скролл; стрелка вниз подсказывает ── */
  #scr-goal{--ink:#000;--paper:#fff;--muted:#8a8a8a;background:#fff}
  .q{font:300 clamp(26px,7vw,40px)/1.2 var(--d);margin:30px 0 30px;letter-spacing:-.01em;color:var(--ink)}
  #scr-goal dl{margin-bottom:22px}
  #scr-goal dt{font-size:12px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
  #scr-goal dd{font-size:18px;line-height:1.65;margin-bottom:22px;color:var(--ink)}
  .ask{margin-top:48px;padding-top:36px;border-top:1px solid var(--ink)}
  .ask label{display:block;font-size:12px;letter-spacing:.14em;color:var(--muted);margin-bottom:16px}
  .field{display:flex;gap:10px;align-items:stretch}
  .field input{flex:1;min-width:0;height:54px;padding:0 16px;font:300 18px/1 var(--t);color:var(--ink);background:var(--paper);border:1px solid var(--ink);border-radius:12px;outline:none;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;caret-color:var(--ink)}
  .field input::placeholder{color:#9a9a9a}
  .field input:focus{box-shadow:0 0 0 2px rgba(0,0,0,.12)}
  .field button{width:54px;height:54px;border:1px solid var(--ink);border-radius:12px;font-size:22px;line-height:1;color:var(--ink);background:var(--paper);flex:none}
  .field button:active{background:var(--ink);color:var(--paper)}
  .skip{display:block;margin-top:18px;padding:8px 0;font-size:13px;color:var(--muted)}
  .ask.sent .field,.ask.sent .skip{opacity:.35;transition:opacity .8s}

  /* ── конец собранного: белый лист, слова человека по центру ── */
  .pin{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);text-align:center;font-size:15px;line-height:1.7;color:var(--muted);opacity:0;transition:opacity 1.6s ease .6s}
  .pin.on{opacity:1}

  @media (prefers-reduced-motion: reduce){
    .cover .cue::before,#nav .down,.swipe i{animation:none}
    .p,.rise,.scr,.stick,.head,.fig,.spin,.quote{transition:none}
  }
</style>
</head>
<body>
<div id="stage"></div>
<nav id="nav" aria-label="экраны">
  <button class="prev" type="button" aria-label="назад" hidden>←</button>
  <button class="down" type="button" aria-label="листай вниз" hidden>↓</button>
  <button class="next" type="button" aria-label="вперёд">→</button>
</nav>
<nav id="dev" hidden aria-label="экраны по номерам"></nav>

<script>
/* ═══ Контент = данные. Порядок экранов = порядок в этом списке (слово Влада 09.09, ночь).
   Тексты Влада, подшлифованы по его слову («подшлифуй», «красиво, элегантно, легко»): опечатки, запятые, короткие абзацы; слова его.
   Что изменено по смыслу — помечено в PAGE.md и ждёт слова. ═══ */
const SCREENS = [
  {

    text: [
      { t: 'Но перед тем как мы начнём, давай договоримся о том, что всё сказанное дальше — выдумка. Фантазия автора, которая не стремится тебя чему-то научить, а скорее ищет возможность вдохновить.' }
    ],
    cue: 'Чтобы подписать договор о выдумке, удерживай палец на кнопке 4 секунды.',

  },
  {
    id: 'framework', kicker: 'The Framework', page: true, flow: true, key: 'fw',
    quote: 'Мудрый, услышав о Дао, усердно следует ему. Обычный человек, услышав о Дао, то следует ему, то нет. Глупый, услышав о Дао, смеётся над ним. Если бы он не смеялся, это не было бы истинным Дао.',

      { t: 'Возможно, кто-то найдёт здесь вдохновение, понимание или даже смысл. Но по большому счёту я хочу, чтобы через моё самовыражение эти люди смогли обрести себя.' },
      { t: 'Это не курс, а скорее со-настройка и выход на новый уровень восприятия.', big: true },
      { t: 'Вместо того чтобы учиться строить новые модели, нам предстоит отучиваться использовать устаревшие программы. Это деконструкция разума, в ходе которой мы будем работать над гибкостью и проводимостью его архитектуры.' },
      { t: 'Я буду делиться личным опытом и ключами, которые помогут вам высвободить заблокированные эмоции и принять тень. Вспомнить свой стиль нелинейной игры можно, лишь приняв себя.' },
      { t: 'Никаких сладких обещаний о суперсиле или чудесах не будет. Успех, удача и состояние — следствие индивидуальной работы с внутренними процессами, за которые каждый отвечает сам.', note: 'Важно' }
    ]
  },
  {
    id: 'gameover', kicker: 'Game Over', page: true, flow: true, key: 'go',
    quote: 'Молодое вино не наливают в старые бурдюки.',
    author: 'Иисус', tradition: 'Христианство', source: 'Евангелие от Матфея 9:17 · Марка 2:22 · Луки 5:37',
    blocks: [
      { t: 'Мы живём в сингулярности: перед нами точка входа в новое восприятие реальности. Пост-трудовая экономика, психоделический ренессанс, эволюционный сдвиг Сознания на планетарном уровне.' },

      { t: '95 % людей не приспособлены к тому настоящему, которое уже наступило.', big: true },

      { t: 'Нас учат, как делать работу, но не учат тому, что такое внимание, интерес или абстрактное мышление. У людей просто нет ключей к восприятию тонких процессов внутри психики, и эти сигналы фильтруются базовым мировоззрением как спам.' },

    ]

  {
    id: 'goal', name: 'Goal', flow: true,
    lead: 'Раскрыть творческий потенциал, выйти из кризиса(пиздеца), обрести уверенность, понять женщину, вспомнить себя или выйти на новый уровень — где-то так я вижу описание ауткама от прохождения этой игры.',
    deeper: 'Но давайте еще глубже.',
    question: '«Где твоя точка наивысшего интереса?»',
    blocks: [
      { k: 'Суть:', v: 'Образ/идея/человек или просто точка в ментальном пространстве, которая как магнит притягивает твоё внимание и оно пребывает там без усилий Воли.' },
      { k: 'Ощущается:', v: 'Как вдохновение, которое дает направление, уверенность, энергию и мотивирует превозмогать себя ради того чтобы воплотить это в своей реальности.' }

  { id: 'end' }
];
/* общие слова страничек: подсказка под цитатой и вопрос-отпечаток в конце */
const PAGE = {
  ask: 'Одним словом: что осталось после этой страницы? Слово, вопрос или состояние.',
  placeholder: 'одно слово',
  maxLen: 80
};

/* ═══ Память браузера ═══ */
const KEY = 'palka:v1:';
const store = {
  get(k){ try { return localStorage.getItem(KEY + k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(KEY + k, v); } catch (e) {} }
};
const DEV = new URLSearchParams(location.search).has('dev');
const REDUCED = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const svgEl = (tag) => document.createElementNS('http://www.w3.org/2000/svg', tag);
const kick = (d) => d.kicker || (String(SCREENS.indexOf(d) + 1).padStart(2, '0') + ' · ' + d.name);

/* ═══ Движок: экраны, ворота, стрелки ═══ */
const stage = $('#stage');
const secs = SCREENS.map(d => { const s = el('section', 'scr' + (d.flow ? ' flow' : '') + (d.page ? ' page' : '')); s.id = 'scr-' + d.id; s.setAttribute('aria-label', d.kicker || d.name || d.id); stage.appendChild(s); return s; });
const navPrev = $('#nav .prev'), navNext = $('#nav .next'), navDown = $('#nav .down');
let cur = -1;
let reached = Math.max(0, Math.min(parseInt(store.get('screen') || '0', 10) || 0, SCREENS.length - 1));

function paint(){
  navPrev.hidden = cur <= 0;
  navNext.hidden = cur >= SCREENS.length - 1;
  if (DEV) [...$('#dev').children].forEach((b, k) => b.classList.toggle('cur', k === cur));
}
/* стрелка вниз: только там, где текст длиннее экрана и ещё не листали */
function paintDown(){
  const s = secs[cur];
  const long = s && s.classList.contains('flow') && s.scrollHeight > s.clientHeight + 24;
  navDown.hidden = !(long && s.scrollTop < 24);
}
secs.forEach(s => s.addEventListener('scroll', paintDown, { passive: true }));
addEventListener('resize', paintDown);
function go(i){
  i = Math.max(0, Math.min(i, SCREENS.length - 1));
  if (!DEV && i > reached) i = reached;
  if (i === cur) return;
  const prev = cur; cur = i;
  if (prev >= 0) { const g = GATES[SCREENS[prev].id] || (SCREENS[prev].page && GATES.page); g && g.leave && g.leave(secs[prev]); secs[prev].classList.remove('on'); }
  history.replaceState(null, '', '#' + (i + 1));
  secs[i].scrollTop = 0;
  secs[i].classList.add('on');
  const g = GATES[SCREENS[i].id] || (SCREENS[i].page && GATES.page); g && g.enter && g.enter(secs[i], SCREENS[i], i);
  paint();
  navDown.hidden = true;
  setTimeout(paintDown, 900);
}
function unlock(i, delay){
  if (i !== cur) return;
  reached = Math.max(reached, i + 1);
  store.set('screen', String(reached));
  paint();
  setTimeout(() => go(i + 1), delay == null ? 800 : delay);
}
/* стрелки: вперёд — открывает следующий экран и считается пройденным шагом; назад — просто назад */
navNext.addEventListener('click', () => { reached = Math.max(reached, cur + 1); store.set('screen', String(reached)); go(cur + 1); });
navPrev.addEventListener('click', () => { go(cur - 1); });

/* ═══ Сборка разметки из данных — по id экрана, порядок любой ═══ */
function spinKnob(label){
  const spin = el('div', 'spin');
  const knob = el('button', 'knob'); knob.type = 'button'; knob.setAttribute('aria-label', label);
  const svg = svgEl('svg'); svg.setAttribute('class', 'unwind'); svg.setAttribute('viewBox', '0 0 200 200'); svg.setAttribute('aria-hidden', 'true');
  const path = svgEl('path'); path.id = 'spath'; path.setAttribute('fill', 'none');
  const text = svgEl('text'); const tp = svgEl('textPath');
  tp.setAttribute('href', '#spath'); tp.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#spath');
  tp.setAttribute('startOffset', '0'); tp.textContent = label;
  text.appendChild(tp); text.setAttribute('fill', '#0a0a0a');
  svg.appendChild(path); svg.appendChild(text);
  spin.appendChild(knob); spin.appendChild(svg);
  return spin;
}
function wordField(id, label, placeholder, maxLen, cls){
  const box = el('div', cls);
  const lab = el('label', null, label); lab.htmlFor = id;
  box.appendChild(lab);
  const field = el('div', 'field');
  const inp = el('input'); inp.id = id; inp.type = 'text'; inp.maxLength = maxLen; inp.placeholder = placeholder;
  inp.autocomplete = 'off'; inp.setAttribute('enterkeyhint', 'done'); inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('spellcheck', 'false');
  const send = el('button', null, '→'); send.type = 'button'; send.setAttribute('aria-label', 'дальше');
  field.appendChild(inp); field.appendChild(send); box.appendChild(field);
  return box;
}
const BUILD = {
  palka(s, d){
    const cover = el('div', 'cover');
    const stick = el('img', 'stick'); stick.src = d.cover.stick; stick.alt = d.cover.stickAlt; stick.decoding = 'async'; stick.draggable = false;
    cover.appendChild(stick);
    const head = el('div', 'head');
    head.appendChild(el('h1', 'title', d.cover.title));
    head.appendChild(el('p', 'sub', d.cover.sub));
    head.appendChild(el('p', 'note', d.cover.note));
    cover.appendChild(head);
    cover.appendChild(el('p', 'cue', d.cover.cue));
    s.appendChild(cover);
  },
  voronka(s, d){
    const fcol = el('div', 'fcol');
    const fig = el('div', 'fig');
    const funnel = el('img', 'funnel'); funnel.alt = d.figureAlt; funnel.decoding = 'async'; funnel.draggable = false; funnel.src = d.figure;
    fig.appendChild(funnel);
    fcol.appendChild(fig);
    const ftext = el('div', 'ftext');
    d.text.forEach(b => ftext.appendChild(el('p', 'p', b.t)));
    ftext.appendChild(el('p', 'p fcue', d.cue));
    fcol.appendChild(ftext);
    fcol.appendChild(spinKnob(d.gate.label));
    s.appendChild(fcol);
  },
  page(s, d){
    const c = el('div', 'col');
    c.appendChild(el('div', 'k', kick(d)));
    const q = el('blockquote', 'quote rise');
    q.appendChild(el('p', 'qtext', d.quote));
    const f = el('footer', 'qauthor', '— ' + d.author + ' · ' + d.tradition);
    if (d.source) f.appendChild(el('span', 'qsrc', d.source));
    q.appendChild(f);
    const sw = el('div', 'swipe'); sw.setAttribute('aria-label', 'смахни вверх'); sw.appendChild(el('i'));
    q.appendChild(sw);
    c.appendChild(q);
    const u = el('div', 'unfold');
    d.blocks.forEach(b => {
      if (b.note) { const n = el('div', 'p pnote'); n.appendChild(el('b', null, b.note)); n.appendChild(document.createTextNode(b.t)); u.appendChild(n); return; }
      u.appendChild(el('p', 'p' + (b.big ? ' pbig' : '') + (b.but ? ' pbut' : ''), b.t));
    });
    u.appendChild(wordField('w-' + d.id, PAGE.ask, PAGE.placeholder, PAGE.maxLen, 'mark'));
    c.appendChild(u);
    s.appendChild(c);
  },
  goal(s, d){
    const c = el('div', 'col');
    c.appendChild(el('div', 'k', kick(d)));
    c.appendChild(el('p', 'p', d.lead));
    c.appendChild(el('p', 'p', d.deeper));
    c.appendChild(el('h2', 'q rise', d.question));
    const dl = el('dl', 'rise');
    d.blocks.forEach(b => { dl.appendChild(el('dt', null, b.k)); dl.appendChild(el('dd', null, b.v)); });
    c.appendChild(dl);
    d.compass.forEach(t => c.appendChild(el('p', 'p', t)));
    const ask = wordField('point', d.gate.ask, d.gate.placeholder, d.gate.maxLen, 'ask rise');
    const skip = el('button', 'skip', d.gate.skip); skip.type = 'button';
    ask.appendChild(skip);
    c.appendChild(ask);
    s.appendChild(c);
  },
  end(s){ s.appendChild(el('p', 'pin')); }
};
function build(){
  SCREENS.forEach((d, i) => { const b = BUILD[d.id] || (d.page && BUILD.page); b && b(secs[i], d); });
  if (DEV) {
    const dev = $('#dev'); dev.hidden = false;
    SCREENS.forEach((s, k) => { const b = el('button', null, String(k + 1)); b.type = 'button'; b.addEventListener('click', () => go(k)); dev.appendChild(b); });
  }
}

/* ═══ Спираль из фразы: точки спирали и точки прямой вверх, равные по длине дуги ═══ */
const SPIRAL = (() => {
  const CX = 100, CY = 100, TURNS = 2.15, N = 160, B = 5.55;
  let spiral = null, line = null, len = 0;
  function build(){
    const fine = [];
    const thMax = TURNS * 2 * Math.PI;
    for (let i = 0; i <= 2400; i++) {
      const t = i / 2400, th = thMax * (1 - t), r = B * th;
      fine.push([CX + r * Math.cos(th - Math.PI / 2), CY + r * Math.sin(th - Math.PI / 2)]);
    }
    const cum = [0];
    for (let i = 1; i < fine.length; i++) cum.push(cum[i - 1] + Math.hypot(fine[i][0] - fine[i - 1][0], fine[i][1] - fine[i - 1][1]));
    len = cum[cum.length - 1];
    spiral = []; line = [];
    let j = 0;
    for (let k = 0; k < N; k++) {
      const target = len * k / (N - 1);
      while (j < cum.length - 2 && cum[j + 1] < target) j++;
      const seg = cum[j + 1] - cum[j] || 1, f = (target - cum[j]) / seg;
      spiral.push([fine[j][0] + (fine[j + 1][0] - fine[j][0]) * f, fine[j][1] + (fine[j + 1][1] - fine[j][1]) * f]);
      line.push([spiral[0][0], spiral[0][1] - target]);
    }
  }
  function d(p){
    if (!spiral) build();
    let out = '';
    for (let k = 0; k < N; k++) {
      const x = spiral[k][0] + (line[k][0] - spiral[k][0]) * p, y = spiral[k][1] + (line[k][1] - spiral[k][1]) * p;
      out += (k ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return out;
  }
  return { d, get length(){ if (!spiral) build(); return len; } };
})();

/* ═══ Подпись удержанием: спираль разматывается вверх, экран чернеет, текст белеет; завершается по часам ═══ */
function holdSpiral(s, col, idx, ms){
  const knob = $('.knob', s), path = $('#spath', s), text = $('.unwind text', s), tp = $('textPath', s);
  let p = 0, t0 = null, raf = 0, back = 0, fin = 0, done = false;
  path.setAttribute('d', SPIRAL.d(0));
  tp.setAttribute('textLength', (SPIRAL.length * .97).toFixed(1)); tp.setAttribute('lengthAdjust', 'spacing');
  function paintP(){
    path.setAttribute('d', SPIRAL.d(p));
    const q = Math.min(1, p * 3.2);
    const bg = Math.round(255 - 245 * q), tx = Math.round(10 + 80 * q), sp = Math.round(10 + 245 * q), mu = Math.round(110 + 40 * q);
    s.style.backgroundColor = 'rgb(' + bg + ',' + bg + ',' + bg + ')';
    s.classList.toggle('dark', q > .5);
    col.style.setProperty('--ptx', 'rgb(' + tx + ',' + tx + ',' + tx + ')');
    col.style.setProperty('--pmu', 'rgb(' + mu + ',' + mu + ',' + mu + ')');
    col.style.setProperty('--kb', 'rgba(' + sp + ',' + sp + ',' + sp + ',' + (.55 + .45 * q).toFixed(2) + ')');
    text.setAttribute('fill', 'rgb(' + sp + ',' + sp + ',' + sp + ')');
  }
  function complete(){
    if (done) return;
    done = true; t0 = null; cancelAnimationFrame(raf); clearTimeout(fin);
    p = 1; paintP();
    unlock(idx, 900);
  }
  function tick(){
    if (t0 === null) return;
    p = Math.min(1, (performance.now() - t0) / ms);
    paintP();
    if (p >= 1) { complete(); return; }
    raf = requestAnimationFrame(tick);
  }
  function start(e){
    if (done) return;
    e.preventDefault();
    cancelAnimationFrame(back);
    try { knob.setPointerCapture(e.pointerId); } catch (err) {}
    t0 = performance.now() - p * ms;
    raf = requestAnimationFrame(tick);
    clearTimeout(fin); fin = setTimeout(complete, ms * (1 - p) + 30);
  }
  function release(){
    if (done || t0 === null) return;
    cancelAnimationFrame(raf); clearTimeout(fin); t0 = null;
    const from = p, t1 = performance.now();
    const rewind = () => {
      const k = Math.min(1, (performance.now() - t1) / 450);
      p = from * (1 - k); paintP();
      if (k < 1) back = requestAnimationFrame(rewind);
    };
    back = requestAnimationFrame(rewind);
  }
  knob.addEventListener('pointerdown', start);
  ['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture'].forEach(ev => knob.addEventListener(ev, release));
  knob.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden) release(); });
}

/* ═══ Ворота — по id экрана; странички — общие ═══ */
function bindWord(box, key, onDone){
  const inp = $('input', box), send = $('.field button', box);
  let finished = false;
  const submit = () => {
    const v = inp.value.trim().replace(/\s+/g, ' ');
    if (!v) { inp.focus(); return; }
    if (finished) return; finished = true;
    store.set(key, v);
    inp.blur(); inp.disabled = true; send.disabled = true;
    box.classList.add('sent');
    onDone(v);
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  send.addEventListener('click', submit);
}
const GATES = {
  /* Палка: один тап — дальше */
  palka: (() => {
    let done = false, s;
    return {
      enter(sec, d, i){
        if (s) return;
        s = sec;
        $('.cover', s).addEventListener('click', () => { if (done) return; done = true; s.classList.add('passed'); unlock(i, 500); });
        s.addEventListener('contextmenu', e => e.preventDefault());
      }
    };
  })(),
  /* Воронка: договор → кнопка-подпись; удержание — подписано */
  voronka: (() => {
    let lit = false;
    return {
      enter(s, d, i){
        if (lit) return;
        lit = true;
        const ps = [...s.querySelectorAll('.p')], spin = $('.spin', s);
        const step = REDUCED() ? 0 : 500;
        ps.forEach((p, k) => setTimeout(() => p.classList.add('lit'), 350 + k * step));
        setTimeout(() => { spin.classList.add('lit'); paintDown(); }, 350 + ps.length * step + 200);
        holdSpiral(s, $('.fcol', s), i, d.gate.ms || 4000);
      }
    };
  })(),
  /* Страничка: цитата → тап → текст по абзацам → одно слово */
  page: {
    enter(s, d, i){
      if (s.dataset.lit) return;
      s.dataset.lit = '1';
      const q = $('.quote', s);
      setTimeout(() => q.classList.add('lit'), 250);
      const open = () => {
        if (s.classList.contains('open')) return;
        s.classList.add('open');
        const ps = [...s.querySelectorAll('.unfold .p')];
        const step = REDUCED() ? 0 : 220;
        ps.forEach((p, k) => setTimeout(() => p.classList.add('lit'), 150 + k * step));
        setTimeout(paintDown, 400);
      };
      /* смахнуть вверх — или тап по цитате */
      let y0 = null;
      s.addEventListener('pointerdown', e => { if (!s.classList.contains('open')) y0 = e.clientY; });
      s.addEventListener('pointerup', e => { if (y0 === null) return; const dy = e.clientY - y0; y0 = null; if (dy < -24 || (Math.abs(dy) < 10 && e.target.closest('.quote'))) open(); });
      s.addEventListener('wheel', e => { if (!s.classList.contains('open') && e.deltaY > 12) open(); }, { passive: true });
      s.addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === ' ') open(); });
      bindWord($('.mark', s), d.key, () => unlock(i, 700));
    }
  },
  /* Goal: текст → одно поле */
  goal: (() => {
    let lit = false;
    return {
      enter(s, d, i){
        if (lit) return;
        lit = true;
        const rises = [...s.querySelectorAll('.p,.rise')];
        const step = REDUCED() ? 0 : 260;
        rises.forEach((n, k) => setTimeout(() => n.classList.add('lit'), 250 + k * step));
        const ask = $('.ask', s), skip = $('.skip', s), inp = $('#point', s);
        bindWord(ask, 'point', () => { skip.disabled = true; unlock(i, 700); });
        skip.addEventListener('click', () => { store.set('point', ''); inp.disabled = true; skip.disabled = true; ask.classList.add('sent'); unlock(i, 700); });
      }
    };
  })(),
  /* конец собранного: белый лист, слова человека по центру */
  end: {
    enter(s){
      const pin = $('.pin', s);
      const words = ['fw', 'go', 'gp', 'point'].map(k => store.get(k)).filter(Boolean);
      pin.textContent = words.join(' · ');
      pin.classList.toggle('on', words.length > 0);
    }
  }
};

/* ═══ Старт ═══ */
build();
(function vv(){
  /* высота сцены сжимается только под клавиатуру (активное поле), не под масштаб или рамку */
  if (!window.visualViewport) return;
  const set = () => {
    const a = document.activeElement, typing = a && a.tagName === 'INPUT';
    document.documentElement.style.setProperty('--vvh', typing ? Math.round(visualViewport.height) + 'px' : '100svh');
  };
  visualViewport.addEventListener('resize', set);
  document.addEventListener('focusin', set); document.addEventListener('focusout', () => setTimeout(set, 60));
})();
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' && !navNext.hidden) navNext.click();
  if (e.key === 'ArrowLeft' && !navPrev.hidden) navPrev.click();
});
(function start(){
  const h = parseInt((location.hash || '').replace('#', ''), 10);
  const want = isNaN(h) ? reached : h - 1;
  go(DEV ? want : Math.min(want, reached));
  if (cur < 0) go(0);
})();
</script>
</body>
</html>
