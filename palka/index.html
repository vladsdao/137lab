<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" sizes="32x32" href="/icons/favicon-32x32.png">
<title>Палка — 137lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  /* ── 137lab · /palka · лендинг v0.1 «Издание» (выбор Влада 09.09, ночь: стиль B — Cormorant Garamond для цитат и имени, Manrope для текста)
     Страница описывает проект и подводит к игре в девять экранов (/palka/app/). Тексты — те же, что в игре (vlad-space/palka/PAGE.md), один к одному.
     Cormorant — с Google Fonts (перенести локально по слову); Manrope — локальный ../beta/site/_fonts/. Контент = данные (PAGE). noindex до слова. ── */
  @font-face{font-family:'Manrope';src:url('../beta/site/_fonts/manrope-v20-cyrillic_latin-300.woff2') format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:'Manrope';src:url('../beta/site/_fonts/manrope-v20-cyrillic_latin-regular.woff2') format('woff2');font-weight:400;font-display:swap}
  :root{
    --paper:#ffffff; --ink:#0a0a0a; --pad:#333333; --muted:#6e6e6e; --rule:#d6d6d6;
    --serif:'Cormorant Garamond','Times New Roman',Georgia,serif;
    --sans:'Manrope','Helvetica Neue',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--paper);scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:var(--ink);color:var(--paper)}
  a{color:inherit}
  img{max-width:100%;display:block}

  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}

  /* ── обложка ── */
  .hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) 0 32px}
  .hero .name{font:300 clamp(72px,16vw,168px)/.92 var(--serif);letter-spacing:-.02em;text-align:center}
  .hero .sub{margin-top:22px;text-align:center;font-size:clamp(15px,2.2vw,18px);color:var(--pad)}
  .hero .note{margin-top:8px;text-align:center;font:italic 400 clamp(16px,2.2vw,20px)/1.3 var(--serif);color:var(--muted)}
  .hero .stick{margin:clamp(28px,6vh,64px) auto 0;width:min(100%,900px)}
  .hero .stick img{width:100%;height:auto}
  .hero .down{margin-top:auto;padding-top:28px;text-align:center;font:italic 400 17px var(--serif);color:var(--muted)}
  .hero .down a{text-decoration:none}

  /* ── поля ── */
  .sec{border-top:1px solid var(--rule);padding:clamp(56px,9vh,104px) 0}
  .sec .g{display:grid;grid-template-columns:1fr;gap:28px}
  .kick{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
  .kick b{font-weight:400;color:var(--ink);margin-right:10px}
  .quote{font:italic 400 clamp(26px,5.2vw,44px)/1.15 var(--serif);letter-spacing:-.01em;color:var(--ink)}
  .attr{margin-top:16px;font:400 clamp(15px,1.8vw,17px)/1.5 var(--serif);color:var(--muted)}
  .attr span{display:block}
  .body{max-width:62ch}
  .body p{font-size:17px;line-height:1.65;margin-bottom:20px;color:var(--ink)}
  .body .big{font:300 clamp(24px,3.6vw,34px)/1.22 var(--serif);letter-spacing:-.01em;margin:6px 0 24px;color:var(--ink)}
  .body .but{font:italic 400 22px/1.4 var(--serif);margin-bottom:12px}
  .body .note{border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin:8px 0 24px}
  .body .note b{display:block;font-weight:400;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .body .note p{font-size:15px;line-height:1.6;margin:0;color:var(--pad)}
  dl{margin:0 0 20px}
  dt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  dd{font-size:17px;line-height:1.65;margin-bottom:20px}
  .q{font:italic 400 clamp(28px,5.6vw,46px)/1.12 var(--serif);letter-spacing:-.01em;margin:8px 0 28px}

  /* ── вход в игру ── */
  .enter{border-top:1px solid var(--rule);padding:clamp(72px,12vh,140px) 0;text-align:center}
  .enter .line{font:300 clamp(26px,4.4vw,40px)/1.2 var(--serif);letter-spacing:-.01em;max-width:22ch;margin:0 auto}
  .enter .why{max-width:52ch;margin:22px auto 0;font-size:16px;line-height:1.6;color:var(--pad)}
  .enter .cta{display:inline-block;margin-top:40px;padding:16px 28px;border:1px solid var(--ink);border-radius:999px;text-decoration:none;font:italic 400 22px/1 var(--serif);color:var(--ink);transition:background .25s,color .25s}
  .enter .cta:hover,.enter .cta:active{background:var(--ink);color:var(--paper)}
  .enter .nine{margin-top:22px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

  footer{border-top:1px solid var(--rule);padding:28px 0 calc(28px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;color:var(--muted)}
  footer a{text-decoration:none}

  .rise{opacity:0;transform:translateY(18px);transition:opacity 1s ease,transform 1s ease}
  .rise.lit{opacity:1;transform:none}

  @media (min-width:900px){
    .sec .g{grid-template-columns:5fr 7fr;gap:72px;align-items:start}
    .sec .g > .left{position:sticky;top:64px}
    .hero{padding-bottom:48px}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    .rise{transition:none;opacity:1;transform:none}
  }
</style>
</head>
<body>
<main id="main"></main>

<script>
/* ═══ Контент = данные. Тексты Влада — те же, что в игре, один к одному. Строка входа в игру — заготовка Клода, ждёт слова. ═══ */
const PAGE = {
  hero: { name: 'Палка.', sub: 'Мультиплеер Игра в Духовность для Мужчин', note: '*это не то что вы подумали', stick: 'palka.png', down: 'читать ↓' },
  fields: [
    {
      n: '01', kicker: 'The Framework',
      quote: 'Мудрый, услышав о Дао, усердно следует ему. Обычный человек, услышав о Дао, то следует ему, то нет. Глупый, услышав о Дао, смеётся над ним. Если бы он не смеялся, это не было бы истинным Дао.',
      attr: ['— Лао-цзы · Даосизм', '«Дао дэ цзин», глава 41'],
      blocks: [
        { t: 'Я создал путь из девяти экранов, которые помогут мне найти близких по духу людей. С ними я планирую разделить личный опыт, инструменты и идеи о том, как использовать многомерность Сознания в своём творчестве.' },
        { t: 'Возможно, кто-то найдёт здесь вдохновение, понимание или даже смысл. Но по большому счёту я хочу, чтобы через моё самовыражение эти люди смогли обрести себя.' },
        { t: 'Это не курс, а скорее со-настройка и выход на новый уровень восприятия.', big: true },
        { t: 'Вместо того чтобы учиться строить новые модели, нам предстоит отучиваться использовать устаревшие программы. Это деконструкция разума, в ходе которой мы будем работать над гибкостью и проводимостью его архитектуры.' },
        { t: 'Я буду делиться личным опытом и ключами, которые помогут вам высвободить заблокированные эмоции и принять тень. Вспомнить свой стиль нелинейной игры можно, лишь приняв себя.' },
        { t: 'Никаких сладких обещаний о суперсиле или чудесах не будет. Успех, удача и состояние — следствие индивидуальной работы с внутренними процессами, за которые каждый отвечает сам.', note: 'Важно' }
      ]
    },
    {
      n: '02', kicker: 'Game Over',
      quote: 'Молодое вино не наливают в старые бурдюки.',
      attr: ['— Иисус · Христианство', 'Евангелие от Матфея 9:17 · Марка 2:22 · Луки 5:37'],
      blocks: [
        { t: 'Мы живём в сингулярности: перед нами точка входа в новое восприятие реальности. Пост-трудовая экономика, психоделический ренессанс, эволюционный сдвиг Сознания на планетарном уровне.' },
        { t: 'Но…', but: true },
        { t: '95 % людей не приспособлены к тому настоящему, которое уже наступило.', big: true },
        { t: 'Система по инерции продолжает обучать детей по прусской классно-партовой модели, которой 200 лет, в то время как подходы к обучению ИИ меняются постоянно. В 95 % случаев дети перестают быть гениями в семь лет — как только идут в школу.' },
        { t: 'Нас учат, как делать работу, но не учат тому, что такое внимание, интерес или абстрактное мышление. У людей просто нет ключей к восприятию тонких процессов внутри психики, и эти сигналы фильтруются базовым мировоззрением как спам.' },
        { t: 'Старый майндсет — главная проблема. Его не исправит никакая AI/blockchain-инфраструктура.' }
      ]
    },
    {
      n: '03', kicker: 'Gameplay',
      quote: 'Не иди по следам людей древности — ищи то, чего искали они.',
      attr: ['— Кукай · Дзен', 'в передаче Басё, «Прощальное слово Кёрику», 1693'],
      blocks: [
        { t: 'Ускоренная эволюция Сознания в формате мультиплеер-игры.', big: true },
        { t: 'Духовность в нынешнем виде устарела. Предположим, что существует новый формат, соответствующий современным параметрам нервной системы и возможностям разума человека.' },
        { t: 'Фреймворк, который передаётся в общем поле через синхронизацию ритмов и мировоззрений. Этот апгрейд системы мировоззрения позволяет осознанно использовать и линейный, и волновой аспекты Сознания — и рассматривает духовность как технологию. Резонансный майндсет — система, нацеленная на сотрудничество и аутентичность.' },
        { t: 'Представьте, что коллективное намерение и синергия работают как духовная практика в фоне, пробуждая ваш естественный интерес и поддерживая высокое психоэмоциональное состояние, в котором рождается творчество.' }
      ]
    },
    {
      n: '04', kicker: 'Goal', goal: true,
      lead: 'Раскрыть творческий потенциал, выйти из кризиса(пиздеца), обрести уверенность, понять женщину, вспомнить себя или выйти на новый уровень — где-то так я вижу описание ауткама от прохождения этой игры.',
      deeper: 'Но давайте еще глубже.',
      question: '«Где твоя точка наивысшего интереса?»',
      defs: [
        { k: 'Суть', v: 'Образ/идея/человек или просто точка в ментальном пространстве, которая как магнит притягивает твоё внимание и оно пребывает там без усилий Воли.' },
        { k: 'Ощущается', v: 'Как вдохновение, которое дает направление, уверенность, энергию и мотивирует превозмогать себя ради того чтобы воплотить это в своей реальности.' }
      ],
      compass: [
        'Для меня это самый важный вопрос. Я использую его как компас.',
        'Это то, чего я хочу, а не то, к чему меня вынуждают обстоятельства, каждого конкретного момента.'
      ]
    }
  ],
  enter: {
    line: 'Девять экранов. Каждый — ключ к со-настройке.',
    why: 'Дальше — игра: девять экранов собирают то, что нужно, чтобы найти резонанс между людьми, близкими по духу.',   /* заготовка Клода из слов Влада — ждёт его слова */
    cta: 'Начать — девять экранов →',
    href: 'app/',
    nine: '9 экранов · договор о выдумке · одно слово на каждом'
  },
  foot: { left: '137lab · 2026', right: 'палка — не то что вы подумали' }
};

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const main = document.getElementById('main');

/* обложка */
const hero = el('section', 'hero wrap');
hero.appendChild(el('h1', 'name', PAGE.hero.name));
hero.appendChild(el('p', 'sub', PAGE.hero.sub));
hero.appendChild(el('p', 'note', PAGE.hero.note));
const st = el('div', 'stick'); const im = el('img'); im.src = PAGE.hero.stick; im.alt = 'Палка'; im.decoding = 'async'; st.appendChild(im); hero.appendChild(st);
const dn = el('p', 'down'); const da = el('a', null, PAGE.hero.down); da.href = '#f01'; dn.appendChild(da); hero.appendChild(dn);
main.appendChild(hero);

/* поля */
PAGE.fields.forEach(f => {
  const sec = el('section', 'sec'); sec.id = 'f' + f.n;
  const w = el('div', 'wrap'), g = el('div', 'g'), left = el('div', 'left rise'), right = el('div', 'body rise');
  const k = el('div', 'kick'); k.appendChild(el('b', null, f.n)); k.appendChild(document.createTextNode(f.kicker)); left.appendChild(k);
  if (f.goal) {
    right.appendChild(el('p', null, f.lead));
    right.appendChild(el('p', null, f.deeper));
    left.appendChild(el('p', 'quote', f.question));
    const dl = el('dl');
    f.defs.forEach(d => { dl.appendChild(el('dt', null, d.k)); dl.appendChild(el('dd', null, d.v)); });
    right.appendChild(dl);
    f.compass.forEach(t => right.appendChild(el('p', null, t)));
  } else {
    left.appendChild(el('blockquote', 'quote', f.quote));
    const a = el('p', 'attr'); f.attr.forEach(t => a.appendChild(el('span', null, t))); left.appendChild(a);
    f.blocks.forEach(b => {
      if (b.note) { const n = el('div', 'note'); n.appendChild(el('b', null, b.note)); n.appendChild(el('p', null, b.t)); right.appendChild(n); return; }
      right.appendChild(el('p', b.big ? 'big' : (b.but ? 'but' : null), b.t));
    });
  }
  g.appendChild(left); g.appendChild(right); w.appendChild(g); sec.appendChild(w); main.appendChild(sec);
});

/* вход в игру */
const en = el('section', 'enter'); const ew = el('div', 'wrap rise');
ew.appendChild(el('p', 'line', PAGE.enter.line));
ew.appendChild(el('p', 'why', PAGE.enter.why));
const cta = el('a', 'cta', PAGE.enter.cta); cta.href = PAGE.enter.href; ew.appendChild(cta);
ew.appendChild(el('p', 'nine', PAGE.enter.nine));
en.appendChild(ew); main.appendChild(en);

/* подвал */
const ft = el('footer', 'wrap'); ft.appendChild(el('span', null, PAGE.foot.left)); ft.appendChild(el('span', null, PAGE.foot.right)); main.appendChild(ft);

/* проявление при прокрутке */
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('lit'); io.unobserve(e.target); } }), { threshold: .12 }) : null;
document.querySelectorAll('.rise').forEach(n => io ? io.observe(n) : n.classList.add('lit'));
setInterval(() => document.querySelectorAll('.rise:not(.lit)').forEach(n => { if (n.getBoundingClientRect().top < innerHeight * .95) n.classList.add('lit'); }), 1000);
</script>
</body>
</html>
