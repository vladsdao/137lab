<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" sizes="32x32" href="/icons/favicon-32x32.png">
<title>Палка — 137lab</title>
<style>
  /* ── 137lab · /palka · v0.9 «белый лист» (слово Влада 09.09: Палка — обложка-афиша, один тап; Воронка — стеклянная воронка, текст «одно важное»;
     Login — круглая кнопка со спиралью из фразы: удержание 4 с разматывает спираль вверх поверх абзацев, белым по чёрному; звук снят «пока»;
     стрелки вперёд-назад на всех экранах; стремиться к белому)
     Шаблон — «9 граней» (vlad-space/palka/9-graney.csv); текст — vlad-space/palka/PAGE.md, один к одному.
     Контент = данные (SCREENS). Шрифты локальные ../beta/site/_fonts/. noindex до слова Влада. ── */
  @font-face{font-family:'Unbounded';src:url('../beta/site/_fonts/unbounded-v12-cyrillic_latin-200.woff2') format('woff2');font-weight:200;font-display:swap}
  @font-face{font-family:'Unbounded';src:url('../beta/site/_fonts/unbounded-v12-cyrillic_latin-300.woff2') format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:'Manrope';src:url('../beta/site/_fonts/manrope-v20-cyrillic_latin-300.woff2') format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:'Manrope';src:url('../beta/site/_fonts/manrope-v20-cyrillic_latin-regular.woff2') format('woff2');font-weight:400;font-display:swap}
  :root{
    --paper:#ffffff;
    --ink:#0a0a0a;
    --pad:#333333;
    --muted:#6e6e6e;
    --rule:#c9c9c9;
    --d:'Unbounded',sans-serif;
    --t:'Manrope','Helvetica Neue',sans-serif;
    --vvh:100svh;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper)}
  body{color:var(--ink);font-family:var(--t);font-weight:300;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  ::selection{background:var(--ink);color:var(--paper)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  a{color:inherit}
  img{-webkit-user-drag:none;user-select:none}

  #stage{position:fixed;inset:0;height:var(--vvh);overflow:hidden;background:var(--paper);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .scr{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s linear .7s;overflow:hidden;background:var(--paper)}
  .scr.on{opacity:1;visibility:visible;transition:opacity .7s ease}
  .scr.flow{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .col{max-width:640px;margin:0 auto;padding:calc(64px + env(safe-area-inset-top)) 44px calc(96px + env(safe-area-inset-bottom)) 24px;min-height:100%}
  .k{font-size:12px;letter-spacing:.14em;color:var(--muted);margin-bottom:34px}
  .p{font-size:18px;line-height:1.65;margin-bottom:22px;color:var(--ink);opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
  .p.lit{opacity:1;transform:none}
  .rise{opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
  .rise.lit{opacity:1;transform:none}
  .cue{font-size:12px;letter-spacing:.14em;color:var(--muted);line-height:1.5}

  /* ── стрелки вперёд-назад — на всех экранах ── */
  #nav button{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));z-index:7;width:48px;height:48px;border-radius:50%;font-size:22px;line-height:1;color:var(--ink);background:var(--paper);border:1px solid var(--rule);display:grid;place-items:center;transition:opacity .5s,border-color .2s}
  #nav button:active{border-color:var(--ink)}
  #nav .prev{left:calc(16px + env(safe-area-inset-left))}
  #nav .next{right:calc(16px + env(safe-area-inset-right))}
  #nav button[hidden]{display:none}

  /* ── палка-индикатор: черта с девятью насечками ── */
  #palka{position:fixed;right:calc(14px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;z-index:6;opacity:0;transition:opacity 1.4s ease;pointer-events:none}
  #palka.on{opacity:1}
  #palka::before{content:'';position:absolute;left:50%;top:-10px;bottom:-10px;width:1px;background:var(--rule);transform:translateX(-50%)}
  #palka i{display:block;width:10px;height:1.5px;background:var(--rule);transition:background .8s ease}
  #palka i.lit{background:var(--ink)}

  #mute{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));z-index:7;font-size:12px;letter-spacing:.08em;color:var(--muted);padding:8px 10px;opacity:0;transition:opacity .8s;pointer-events:none}
  #mute.on{opacity:1;pointer-events:auto}
  #dev{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));z-index:7;display:flex;gap:6px}
  #dev button{width:30px;height:30px;border:1px solid var(--rule);border-radius:50%;font-size:12px;color:var(--muted);background:var(--paper)}
  #dev button.cur{color:var(--paper);background:var(--ink);border-color:var(--ink)}
  #closed{position:fixed;inset:0;z-index:9;background:var(--paper);display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
  #closed.on{opacity:1;pointer-events:auto}
  #closed p{font-size:17px;color:var(--ink)}
  #closed a{display:block;margin-top:14px;font-size:13px;color:var(--muted);text-decoration:none;letter-spacing:.06em}

  /* ── 01 Палка: афиша — имя сверху по центру, палка по центру, один тап ── */
  .cover{position:absolute;inset:0;touch-action:manipulation;cursor:pointer}
  .stick{position:absolute;display:block;pointer-events:none;transition:opacity 1.8s ease}
  .head{position:absolute;left:24px;right:24px;top:calc(44px + env(safe-area-inset-top));text-align:center;transition:opacity 1.1s ease}
  .head .title{font:200 clamp(44px,12vw,72px)/1 var(--d);color:var(--ink);letter-spacing:-.01em}
  .head .sub{margin-top:14px;font-size:15px;line-height:1.4;color:var(--pad)}
  .head .note{margin-top:8px;font-size:12px;color:var(--muted)}
  .cover .cue{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--paper);border-radius:8px;white-space:nowrap;max-width:calc(100% - 140px);transition:opacity .5s}
  .cover .cue::before{content:'';display:block;width:2px;height:16px;background:var(--ink);animation:blink 1.1s steps(1,end) infinite;flex:none}
  @keyframes blink{50%{opacity:0}}
  #s1.passed .cover .cue{opacity:0}
  @media (orientation:portrait){
    .stick{width:94vh;height:auto;left:calc(50% + 2.67vh);top:50%;transform:translate(-50%,-50%) rotate(-90deg) translateX(-13vh)}
  }
  @media (orientation:landscape){
    .stick{width:100vw;height:auto;left:50%;top:56%;transform:translate(-50%,-50%)}
  }

  /* ── 02 Воронка: стеклянная воронка на белом, текст под ней — «одно важное»: правило крупно, остальное тихо ── */
  .fcol{max-width:640px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top)) 44px calc(96px + env(safe-area-inset-bottom)) 24px;min-height:100%;display:flex;flex-direction:column}
  .fig{position:relative;width:min(62vw,300px);margin:0 auto 18px;transform-origin:50% 24%;transition:transform 1.4s cubic-bezier(.7,0,.9,.5),opacity 1.2s ease}
  .funnel{display:block;width:100%;height:auto}
  .throat{position:absolute;left:50%;top:24%;width:110px;height:110px;transform:translate(-50%,-50%);border-radius:50%;opacity:0;visibility:hidden;transition:opacity 1.2s ease,visibility 0s linear 1.2s;touch-action:none}
  .throat::before{content:'';position:absolute;inset:22px;border-radius:50%;border:1px solid var(--ink);animation:ring 2.4s ease-out infinite}
  .throat::after{content:'';position:absolute;inset:51px;border-radius:50%;background:var(--ink)}
  @keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
  .ftext{flex:1}
  .ftext .fintro{font-size:14px;line-height:1.55;color:var(--muted);margin-bottom:22px}
  .ftext .frule{font:300 clamp(22px,6vw,32px)/1.22 var(--d);letter-spacing:-.01em;color:var(--ink);margin-bottom:10px}
  .ftext .ftail{font-size:16px;line-height:1.5;color:var(--ink);margin-bottom:22px}
  .ftext .ffoot{font-size:13px;line-height:1.55;color:var(--muted);margin-bottom:14px}
  .ftext .fnote{font-size:13px;letter-spacing:.02em;color:var(--muted);padding-top:12px;border-top:1px solid var(--rule);margin-bottom:0}
  .stamp{margin-top:auto;padding-top:22px;text-align:center;opacity:0;transition:opacity .8s ease}
  .stamp.on{opacity:1}
  #s2.gated .throat{opacity:1;visibility:visible;transition:opacity 1.2s ease}
  #s2.fall{overflow:hidden}
  #s2.fall .fig{transform:scale(9);opacity:0}
  #s2.fall .ftext,#s2.fall .stamp{opacity:0;transition:opacity .5s}
  @media (orientation:landscape){
    .fcol{flex-direction:row;align-items:center;gap:40px;max-width:980px;padding-right:24px}
    .fig{width:min(30vw,380px);margin:0}
    .ftext{flex:1}
    .stamp{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));margin:0;padding:0}
  }

  /* ── 03 Login: три абзаца → круглая кнопка со спиралью из фразы; удержание 4 с — спираль разматывается вверх, белым по чёрному ── */
  #s3{transition:background-color .3s linear}
  #s3 .col{position:relative;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
  #s3 .k{color:var(--kc,var(--muted))}
  #s3 .p{color:var(--ptx,var(--ink))}
  .spin{position:relative;width:216px;height:216px;margin:34px auto 0;opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
  .spin.lit{opacity:1;transform:none}
  .knob{position:absolute;inset:0;border-radius:50%;border:1px solid var(--kb,var(--ink));background:transparent;touch-action:none;cursor:pointer;z-index:1}
  .knob:active{border-width:2px}
  .unwind{position:absolute;inset:0;width:216px;height:216px;overflow:visible;pointer-events:none;z-index:2}
  .unwind text{font:400 16px var(--t);letter-spacing:.02em}
  .exit{display:block;margin:26px auto 0;padding:10px;font-size:12px;letter-spacing:.14em;color:var(--rule)}

  /* ── 04 Goal ── */
  #s4{--ink:#000;--paper:#fff;--muted:#8a8a8a;background:#fff}
  .q{font:300 clamp(26px,7vw,40px)/1.2 var(--d);margin:30px 0 30px;letter-spacing:-.01em;color:var(--ink)}
  #s4 dl{margin-bottom:22px}
  #s4 dt{font-size:12px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
  #s4 dd{font-size:18px;line-height:1.65;margin-bottom:22px;color:var(--ink)}
  .ask{margin-top:48px;padding-top:36px;border-top:1px solid var(--ink)}
  .ask label{display:block;font-size:12px;letter-spacing:.14em;color:var(--muted);margin-bottom:16px}
  .field{display:flex;gap:10px;align-items:stretch}
  .field input{flex:1;min-width:0;height:54px;padding:0 16px;font:300 18px/1 var(--t);color:var(--ink);background:var(--paper);border:1px solid var(--ink);border-radius:12px;outline:none;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;caret-color:var(--ink)}
  .field input::placeholder{color:#9a9a9a}
  .field input:focus{box-shadow:0 0 0 2px rgba(0,0,0,.18)}
  .field button{width:54px;height:54px;border:1px solid var(--ink);border-radius:12px;font-size:22px;line-height:1;color:var(--ink);background:var(--paper);flex:none}
  .field button:active{background:var(--ink);color:var(--paper)}
  .skip{display:block;margin-top:18px;padding:8px 0;font-size:13px;color:var(--muted)}
  .fly{position:fixed;z-index:8;font-size:18px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:transform 1.3s cubic-bezier(.4,0,.2,1),opacity 1.3s ease;transform-origin:100% 50%}

  /* ── конец собранного: палка 4 из 9 ── */
  .pin{position:absolute;right:calc(44px + env(safe-area-inset-right));top:calc(50% - 15.5px);transform:translateY(-50%);max-width:60vw;text-align:right;font-size:13px;line-height:1.4;color:var(--muted);opacity:0;transition:opacity 1.6s ease .6s}
  .pin.on{opacity:1}

  @media (min-width:900px){
    .col{padding-right:24px}
  }
  @media (prefers-reduced-motion: reduce){
    .cover .cue::before,.throat::before{animation:none}
    .p,.rise,.scr,.stick,.head,#palka,.fly,.fig,.throat,.spin{transition:none}
  }
</style>
</head>
<body>
<div id="stage">
  <section class="scr" id="s1" aria-label="Палка"></section>
  <section class="scr flow" id="s2" aria-label="Воронка"></section>
  <section class="scr flow" id="s3" aria-label="Login"></section>
  <section class="scr flow" id="s4" aria-label="Goal"></section>
  <section class="scr" id="s5" aria-label="Палка · четыре из девяти"></section>
</div>
<nav id="nav" aria-label="экраны">
  <button class="prev" type="button" aria-label="назад" hidden>←</button>
  <button class="next" type="button" aria-label="вперёд">→</button>
</nav>
<aside id="palka" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></aside>
<button id="mute" type="button" aria-label="звук" hidden>звук</button>
<nav id="dev" hidden aria-label="экраны по номерам"></nav>
<div id="closed" inert></div>

<script>
/* ═══ Контент = данные. Текст Влада (09.09, ночь) один к одному; правки пунктуации ждут его слова. ═══ */
const SCREENS = [
  {
    id: 'palka',
    cover: {
      title: 'Палка.',
      sub: 'Мультиплеер Игра в Духовность для Мужчин',
      note: '*это не то что вы подумали',
      cue: 'коснись палки',
      stick: 'palka.png',
      stickAlt: 'Палка'
    },
    gate: { type: 'tap' }
  },
  {
    id: 'voronka',
    figure: 'lejka.jpg', figureAlt: 'Воронка',   /* стеклянная воронка — картинка по ссылке Влада 09.09 (фон белый) */
    intro: 'Говоря прямо — это воронка, в авторском формате. Её цель — объяснить суть того чем я могу быть полезным тем людям которым это необходимо. И отсеять тех, кому это не нужно.',
    rule: 'Закрывай окно как только почувствуешь что это не твоё.',
    tail: 'Так будет честно.',
    foot: '*Формат авангардный, но я чувствую что именно таким он должен быть. Одна лишь просьба — не воспринимай все слишком серьезно.',
    note: 'Всего лишь девять экранов.',   /* по слову Влада «упомяни, что всего лишь 9 экранов будет» — формулировка ждёт его правки */
    gate: { type: 'throat', cue: 'коснись воронки' }
  },
  {
    id: 'login', kicker: '03 · Login',
    paras: [
      'Некоторые аспекты идеи о которой пойдет речь — могут казаться безумными, а если нет — я плохо объясняю.',
      'Давайте заранее договоримся о том что все что дальше — это выдумка. Расслабтесь и воспринимайте это как художественное произведение.',
      'Это необходимый ход, который позволяет снять важность и расслабить защиту рационального разума.'
    ],
    gate: { type: 'spiral', label: 'Я не рационализирую, это фантазия, я следую за интересом.', seconds: 4, exit: 'закрыть окно', exitLine: 'Окно закрыто.', exitHref: 'https://137lab.xyz', exitHrefLabel: '137lab.xyz' }
  },
  {
    id: 'goal', kicker: '04 · Goal',
    lead: 'Раскрыть творческий потенциал, выйти из кризиса(пиздеца), обрести уверенность, понять женщину, вспомнить себя или выйти на новый уровень — где-то так я вижу описание ауткама от прохождения этой игры.',
    deeper: 'Но давайте еще глубже.',
    question: '«Где твоя точка наивысшего интереса?»',
    blocks: [
      { k: 'Суть:', v: 'Образ/идея/человек или просто точка в ментальном пространстве, которая как магнит притягивает твоё внимание и оно пребывает там без усилий Воли.' },
      { k: 'Ощущается:', v: 'Как вдохновение, которое дает направление, уверенность, энергию и мотивирует превозмогать себя ради того чтобы воплотить это в своей реальности.' }
    ],
    compass: [
      'Для меня это самый важный вопрос. Я использую его как компас.',
      'Это то, чего я хочу, а не то, к чему меня вынуждают обстоятельства, каждого конкретного момента.'
    ],
    pov: 'POV: В настоящий момент точка моего наивысшего интереса находится в этих строках. Я буквально только этим и живу сейчас.',
    gate: { type: 'point', ask: 'Где твоя точка наивысшего интереса?', placeholder: 'одной строкой', skip: 'пока не знаю', maxLen: 140 }
  },
  { id: 'end', gate: { type: 'none' } }
];

/* ═══ Память браузера ═══ */
const KEY = 'palka:v1:';
const store = {
  get(k){ try { return localStorage.getItem(KEY + k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(KEY + k, v); } catch (e) {} }
};
const DEV = new URLSearchParams(location.search).has('dev');
const REDUCED = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const svgEl = (tag) => document.createElementNS('http://www.w3.org/2000/svg', tag);

/* ═══ Звук: снят словом Влада 09.09 («звук частоты убери пока с сайта») — SOUND=false; модуль оставлен для возврата ═══ */
const SOUND = false;
const AUDIO = (() => {
  let ctx = null, master = null, drone = null, droneG = null, lastTick = 0;
  const muted = () => store.get('mute') === '1';
  function ensure(){
    if (!SOUND) return false;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = muted() ? 0 : 1;
      master.connect(ctx.destination);
    }
    if (ctx.state !== 'running') ctx.resume();
    return true;
  }
  function click(){
    if (!ctx) return;
    const t = ctx.currentTime;
    const len = Math.floor(ctx.sampleRate * .012);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); g.gain.setValueAtTime(.45, t);
    src.connect(g).connect(master); src.start(t);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(330, t); o.frequency.exponentialRampToValueAtTime(96, t + 1.7);
    const og = ctx.createGain();
    og.gain.setValueAtTime(.0001, t); og.gain.exponentialRampToValueAtTime(.16, t + .012); og.gain.exponentialRampToValueAtTime(.0001, t + 1.9);
    o.connect(og).connect(master); o.start(t); o.stop(t + 2);
  }
  function fall(){
    if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(40, t + 1.3);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.2, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + 1.4);
    o.connect(g).connect(master); o.start(t); o.stop(t + 1.5);
  }
  function droneOn(){
    if (!ctx || drone) return;
    const t = ctx.currentTime;
    droneG = ctx.createGain(); droneG.gain.setValueAtTime(.0001, t); droneG.gain.exponentialRampToValueAtTime(.11, t + 3.5);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
    droneG.connect(lp).connect(master);
    drone = [55, 110.6, 164.6].map((f, i) => {
      const o = ctx.createOscillator(); o.type = i ? 'sine' : 'triangle'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = i ? .45 : .32;
      o.connect(g).connect(droneG); o.start(t); return o;
    });
  }
  function droneOff(){
    if (!ctx || !drone) return;
    const t = ctx.currentTime, oscs = drone; drone = null;
    droneG.gain.cancelScheduledValues(t);
    droneG.gain.setValueAtTime(Math.max(droneG.gain.value, .0001), t);
    droneG.gain.exponentialRampToValueAtTime(.0001, t + 1.6);
    oscs.forEach(o => o.stop(t + 1.7));
  }
  function tick(){
    if (!ctx) return;
    const now = performance.now(); if (now - lastTick < 28) return; lastTick = now;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = 1700 + Math.random() * 700;
    const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.07, t + .003); g.gain.exponentialRampToValueAtTime(.0001, t + .05);
    o.connect(g).connect(master); o.start(t); o.stop(t + .06);
  }
  function setMute(m){
    store.set('mute', m ? '1' : '0');
    if (ctx) { const t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.linearRampToValueAtTime(m ? 0 : 1, t + .06); }
  }
  return { ensure, click, fall, droneOn, droneOff, tick, setMute, muted, get ready(){ return !!ctx; } };
})();

/* ═══ Движок: экраны, ворота, стрелки, палка ═══ */
const secs = [$('#s1'), $('#s2'), $('#s3'), $('#s4'), $('#s5')];
const palka = $('#palka'), notches = [...palka.querySelectorAll('i')];
const navPrev = $('#nav .prev'), navNext = $('#nav .next');
let cur = -1;
let reached = Math.max(0, Math.min(parseInt(store.get('screen') || '0', 10) || 0, SCREENS.length - 1));

function paint(){
  notches.forEach((n, k) => n.classList.toggle('lit', k < reached));
  palka.classList.toggle('on', reached >= 1 || (DEV && cur >= 1));
  navPrev.hidden = cur <= 0;
  navNext.hidden = cur >= SCREENS.length - 1;
  if (DEV) [...$('#dev').children].forEach((b, k) => b.classList.toggle('cur', k === cur));
}
function go(i){
  i = Math.max(0, Math.min(i, SCREENS.length - 1));
  if (!DEV && i > reached) i = reached;
  if (i === cur) return;
  const prev = cur; cur = i;
  if (prev >= 0) { GATES[prev].leave && GATES[prev].leave(secs[prev]); secs[prev].classList.remove('on'); }
  history.replaceState(null, '', '#' + (i + 1));
  secs[i].scrollTop = 0;
  secs[i].classList.add('on');
  GATES[i].enter && GATES[i].enter(secs[i]);
  paint();
}
function unlock(i, delay){
  if (i !== cur) return;
  reached = Math.max(reached, i + 1);
  store.set('screen', String(reached));
  paint();
  setTimeout(() => go(i + 1), delay == null ? 800 : delay);
}
/* стрелки: вперёд — открывает следующий экран и считается пройденным шагом; назад — просто назад */
navNext.addEventListener('click', () => { AUDIO.ensure(); AUDIO.click(); reached = Math.max(reached, cur + 1); store.set('screen', String(reached)); go(cur + 1); });
navPrev.addEventListener('click', () => { AUDIO.ensure(); AUDIO.click(); go(cur - 1); });
function showMute(){
  if (!SOUND) return;
  const m = $('#mute'); m.hidden = false; m.classList.add('on');
  m.textContent = AUDIO.muted() ? 'без звука' : 'звук';
}
$('#mute').addEventListener('click', () => {
  AUDIO.ensure();
  const m = !AUDIO.muted(); AUDIO.setMute(m); showMute();
});

/* ═══ Сборка разметки из данных ═══ */
function build(){

  const head = el('div', 'head');

  head.appendChild(el('p', 'sub', d1.cover.sub));

  cover.appendChild(el('p', 'cue', d1.cover.cue));

  /* 02 Воронка */

  fcol.appendChild(el('p', 'stamp cue', d2.gate.cue));
  s2.appendChild(fcol);

  /* 03 Login: абзацы + круглая кнопка со спиралью */
  const d3 = SCREENS[2], s3 = secs[2], c3 = el('div', 'col');
  c3.appendChild(el('div', 'k', d3.kicker));
  d3.paras.forEach(t => c3.appendChild(el('p', 'p', t)));
  const spin = el('div', 'spin');
  const knob = el('button', 'knob'); knob.type = 'button'; knob.setAttribute('aria-label', d3.gate.label);
  const svg = svgEl('svg'); svg.setAttribute('class', 'unwind'); svg.setAttribute('viewBox', '0 0 216 216'); svg.setAttribute('aria-hidden', 'true');
  const path = svgEl('path'); path.id = 'spath'; path.setAttribute('fill', 'none');
  const text = svgEl('text'); const tp = svgEl('textPath');
  tp.setAttribute('href', '#spath'); tp.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#spath');
  tp.setAttribute('startOffset', '0'); tp.textContent = d3.gate.label;
  text.appendChild(tp); text.setAttribute('fill', '#0a0a0a');
  svg.appendChild(path); svg.appendChild(text);
  spin.appendChild(knob); spin.appendChild(svg);
  c3.appendChild(spin);
  const exit = el('button', 'exit rise', d3.gate.exit); exit.type = 'button';
  c3.appendChild(exit);
  s3.appendChild(c3);

  /* 04 Goal */
  const d4 = SCREENS[3], s4 = secs[3], c4 = el('div', 'col');
  c4.appendChild(el('div', 'k', d4.kicker));
  c4.appendChild(el('p', 'p', d4.lead));
  c4.appendChild(el('p', 'p', d4.deeper));
  c4.appendChild(el('h2', 'q rise', d4.question));
  const dl = el('dl', 'rise');
  d4.blocks.forEach(b => { dl.appendChild(el('dt', null, b.k)); dl.appendChild(el('dd', null, b.v)); });
  c4.appendChild(dl);
  d4.compass.forEach(t => c4.appendChild(el('p', 'p', t)));
  c4.appendChild(el('p', 'p', d4.pov));
  const ask = el('div', 'ask rise');
  const lab = el('label', null, d4.gate.ask); lab.htmlFor = 'point';
  ask.appendChild(lab);
  const field = el('div', 'field');
  const inp = el('input'); inp.id = 'point'; inp.type = 'text'; inp.maxLength = d4.gate.maxLen; inp.placeholder = d4.gate.placeholder;
  inp.autocomplete = 'off'; inp.setAttribute('enterkeyhint', 'done'); inp.setAttribute('autocapitalize', 'sentences');
  const send = el('button', null, '→'); send.type = 'button'; send.setAttribute('aria-label', 'дальше');
  field.appendChild(inp); field.appendChild(send); ask.appendChild(field);
  const skip = el('button', 'skip', d4.gate.skip); skip.type = 'button';
  ask.appendChild(skip);
  c4.appendChild(ask);
  s4.appendChild(c4);

  /* конец собранного */
  secs[4].appendChild(el('p', 'pin'));

  const closed = $('#closed');
  const box = el('div');
  box.appendChild(el('p', null, d3.gate.exitLine));
  const a = el('a', null, d3.gate.exitHrefLabel); a.href = d3.gate.exitHref;
  box.appendChild(a); closed.appendChild(box);

  if (DEV) {
    const dev = $('#dev'); dev.hidden = false;
    SCREENS.forEach((s, k) => { const b = el('button', null, String(k + 1)); b.type = 'button'; b.addEventListener('click', () => go(k)); dev.appendChild(b); });
  }
}

/* ═══ Спираль из фразы: точки спирали и точки прямой вверх, равные по длине дуги ═══ */
const SPIRAL = (() => {
  const CX = 108, CY = 108, TURNS = 2.15, N = 160, B = 6.0;
  let spiral = null, line = null, len = 0;
  function build(){
    const fine = [];
    const thMax = TURNS * 2 * Math.PI;
    for (let i = 0; i <= 2400; i++) {
      const t = i / 2400, th = thMax * (1 - t), r = B * th;
      fine.push([CX + r * Math.cos(th - Math.PI / 2), CY + r * Math.sin(th - Math.PI / 2)]);
    }
    const cum = [0];
    for (let i = 1; i < fine.length; i++) cum.push(cum[i - 1] + Math.hypot(fine[i][0] - fine[i - 1][0], fine[i][1] - fine[i - 1][1]));
    len = cum[cum.length - 1];
    spiral = []; line = [];
    let j = 0;
    for (let k = 0; k < N; k++) {
      const target = len * k / (N - 1);
      while (j < cum.length - 2 && cum[j + 1] < target) j++;
      const seg = cum[j + 1] - cum[j] || 1, f = (target - cum[j]) / seg;
      spiral.push([fine[j][0] + (fine[j + 1][0] - fine[j][0]) * f, fine[j][1] + (fine[j + 1][1] - fine[j][1]) * f]);
      line.push([spiral[0][0], spiral[0][1] - target]);
    }
  }
  function d(p){
    if (!spiral) build();
    const e = p;
    let out = '';
    for (let k = 0; k < N; k++) {
      const x = spiral[k][0] + (line[k][0] - spiral[k][0]) * e, y = spiral[k][1] + (line[k][1] - spiral[k][1]) * e;
      out += (k ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return out;
  }
  return { d, get length(){ if (!spiral) build(); return len; } };
})();

/* ═══ Ворота ═══ */
const GATES = [
  /* 01 Палка: один тап — дальше; палка-индикатор рождается */
  (() => {
    let done = false, s;
    function tap(){
      if (done) return;
      done = true;
      AUDIO.ensure(); AUDIO.click(); showMute();
      s.classList.add('passed');
      unlock(0, 500);
    }
    return {
      enter(sec){
        if (s) return;
        s = sec;
        $('.cover', s).addEventListener('click', tap);
        s.addEventListener('contextmenu', e => e.preventDefault());
      }
    };
  })(),
  /* 02 Воронка: текст под воронкой появляется по частям → касание конуса — падение внутрь */
  (() => {
    let lit = false, shown = false, done = false, s, throat, stamp;
    function showGate(){ if (shown) return; shown = true; s.classList.add('gated'); stamp.classList.add('on'); }
    function fallIn(e){
      if (done || !shown) return;
      if (e) e.preventDefault();
      done = true;
      AUDIO.ensure(); AUDIO.fall();
      s.classList.add('fall');
      unlock(1, 1200);
    }
    return {
      enter(sec){
        if (lit) return;
        lit = true; s = sec; throat = $('.throat', s); stamp = $('.stamp', s);
        const ps = [...s.querySelectorAll('.p')];
        const step = REDUCED() ? 0 : 700;
        ps.forEach((p, k) => setTimeout(() => p.classList.add('lit'), 400 + k * step));
        setTimeout(showGate, 400 + ps.length * step + 400);
        throat.addEventListener('pointerdown', fallIn);
        throat.addEventListener('contextmenu', e => e.preventDefault());
      }
    };
  })(),
  /* 03 Login: абзацы по одному → круглая кнопка; удержание 4 с — спираль разматывается вверх, экран чернеет, текст белеет */
  (() => {
    let lit = false, done = false, s, col, knob, path, text, p = 0, t0 = null, raf = 0, back = 0;
    const HOLD = SCREENS[2].gate.seconds * 1000;
    function paintP(){
      path.setAttribute('d', SPIRAL.d(p));
      /* экран чернеет быстро (за первую треть удержания), размотка идёт все четыре секунды — движение видно */
      const q = Math.min(1, p * 3.2);
      const bg = Math.round(255 - 245 * q), tx = Math.round(10 + 80 * q), sp = Math.round(10 + 245 * q);
      s.style.backgroundColor = 'rgb(' + bg + ',' + bg + ',' + bg + ')';
      col.style.setProperty('--ptx', 'rgb(' + tx + ',' + tx + ',' + tx + ')');
      col.style.setProperty('--kc', 'rgb(' + tx + ',' + tx + ',' + tx + ')');
      col.style.setProperty('--kb', 'rgba(' + sp + ',' + sp + ',' + sp + ',' + (.55 + .45 * q).toFixed(2) + ')');
      text.setAttribute('fill', 'rgb(' + sp + ',' + sp + ',' + sp + ')');
    }
    function tick(){
      if (t0 === null) return;
      p = Math.min(1, (performance.now() - t0) / HOLD);
      paintP();
      if (p >= 1) { complete(); return; }
      raf = requestAnimationFrame(tick);
    }
    function start(e){
      if (done) return;
      e.preventDefault();
      cancelAnimationFrame(back);
      try { knob.setPointerCapture(e.pointerId); } catch (err) {}
      t0 = performance.now() - p * HOLD;
      raf = requestAnimationFrame(tick);
    }
    function release(){
      if (done || t0 === null) return;
      cancelAnimationFrame(raf); t0 = null;
      const from = p, t1 = performance.now();
      const rewind = () => {
        const k = Math.min(1, (performance.now() - t1) / 450);
        p = from * (1 - k); paintP();
        if (k < 1) back = requestAnimationFrame(rewind);
      };
      back = requestAnimationFrame(rewind);
    }
    function complete(){
      done = true; t0 = null;
      AUDIO.ensure(); AUDIO.click();
      unlock(2, 900);
    }
    return {
      enter(sec){
        if (lit) return;
        lit = true; s = sec; col = $('.col', s); knob = $('.knob', s); path = $('#spath', s); text = $('.unwind text', s);
        const tp = $('textPath', s);
        path.setAttribute('d', SPIRAL.d(0));
        tp.setAttribute('textLength', (SPIRAL.length * .97).toFixed(1)); tp.setAttribute('lengthAdjust', 'spacing');
        const ps = [...s.querySelectorAll('.p')], spin = $('.spin', s), exit = $('.exit', s);
        const step = REDUCED() ? 0 : 1000;
        ps.forEach((q, k) => setTimeout(() => q.classList.add('lit'), 300 + k * step));
        setTimeout(() => spin.classList.add('lit'), 300 + ps.length * step + 400);
        setTimeout(() => exit.classList.add('lit'), 300 + ps.length * step + 1400);
        knob.addEventListener('pointerdown', start);
        ['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture'].forEach(ev => knob.addEventListener(ev, release));
        knob.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('visibilitychange', () => { if (document.hidden) release(); });
        exit.addEventListener('click', () => { const c = $('#closed'); c.removeAttribute('inert'); c.classList.add('on'); });
      }
    };
  })(),
  /* 04 Goal: текст → одно поле; строка садится на палку */
  (() => {
    let lit = false;
    return {
      enter(s){
        if (lit) return;
        lit = true;
        const rises = [...s.querySelectorAll('.p,.rise')];
        const step = REDUCED() ? 0 : 260;
        rises.forEach((n, k) => setTimeout(() => n.classList.add('lit'), 250 + k * step));
        const inp = $('#point', s), send = $('.field button', s), skip = $('.skip', s);
        inp.addEventListener('input', () => { AUDIO.ensure(); AUDIO.tick(); });
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
        send.addEventListener('click', submit);
        skip.addEventListener('click', () => { store.set('point', ''); finish(''); });
        function submit(){
          const v = inp.value.trim();
          if (!v) { inp.focus(); return; }
          store.set('point', v);
          finish(v);
        }
        let finished = false;
        function finish(v){
          if (finished) return; finished = true;
          inp.blur(); inp.disabled = true; send.disabled = true; skip.disabled = true;
          AUDIO.ensure(); AUDIO.click();
          if (v && !REDUCED()) {
            const r = inp.getBoundingClientRect(), target = notches[3].getBoundingClientRect();
            const fly = el('span', 'fly', v);
            fly.style.left = (r.left + 16) + 'px'; fly.style.top = (r.top + r.height / 2 - 11) + 'px';
            fly.style.maxWidth = (r.width - 32) + 'px'; fly.style.overflow = 'hidden'; fly.style.textOverflow = 'ellipsis';
            document.body.appendChild(fly);
            inp.value = '';
            requestAnimationFrame(() => {
              const fr = fly.getBoundingClientRect();
              const dx = target.right - fr.right, dy = (target.top + target.height / 2) - (fr.top + fr.height / 2);
              fly.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.18)';
              fly.style.opacity = '0';
            });
            setTimeout(() => fly.remove(), 1500);
            unlock(3, 1300);
          } else {
            unlock(3, 700);
          }
        }
      }
    };
  })(),
  /* конец собранного: палка стоит, строка при четвёртой насечке */
  {
    enter(s){
      const pin = $('.pin', s), v = store.get('point');
      pin.textContent = v || '';
      pin.classList.toggle('on', !!v);
    }
  }
];

/* ═══ Старт ═══ */
build();
(function vv(){
  /* высота сцены сжимается только под клавиатуру (активное поле), не под масштаб или рамку */
  if (!window.visualViewport) return;
  const set = () => {
    const a = document.activeElement, typing = a && a.tagName === 'INPUT';
    document.documentElement.style.setProperty('--vvh', typing ? Math.round(visualViewport.height) + 'px' : '100svh');
  };
  visualViewport.addEventListener('resize', set);
  document.addEventListener('focusin', set); document.addEventListener('focusout', () => setTimeout(set, 60));
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden && AUDIO.ready) AUDIO.ensure(); });
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' && !navNext.hidden) navNext.click();
  if (e.key === 'ArrowLeft' && !navPrev.hidden) navPrev.click();
});
(function start(){
  const h = parseInt((location.hash || '').replace('#', ''), 10);
  const want = isNaN(h) ? reached : h - 1;
  go(DEV ? want : Math.min(want, reached));
  if (cur < 0) go(0);
})();
</script>
