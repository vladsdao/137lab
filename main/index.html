<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="description" content="Nonlinear Evolution. Navigating leaders to the next strategic horizon.">
<link rel="icon" sizes="32x32" href="/icons/favicon-32x32.png">
<title>137lab — Nonlinear Evolution</title>
<style>
  /* ── 137lab · /main · v2 «brutal» (слово Влада 10.09: «пышно и по-детски → брутальный минимализм»;
     строка Влада: Nonlinear Evolution. Navigating Leaders to the Next Strategic Horizon).
     Чёрное · белое · Fixel Display 800 · моно для меты · линии 1px · без анимаций, поля, свечения, таймеров.
     Одна страница, один скролл. Пять реплик — из публичных разговоров засновників 2025–2026
     (data/library/2026-09-*.md); клик — одна строка-зеркало на месте. Контент = данные (ROWS, WHAT).
     noindex до слова Влада; корень не торкаємо. ── */
  @font-face{font-family:'Fixel Display';src:url('/fonts/FixelDisplay-ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
  @font-face{font-family:'Fixel Display';src:url('/fonts/FixelDisplay-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
  @font-face{font-family:'Fixel Text';src:url('/fonts/FixelText-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
  :root{
    --k:#000; --w:#fff;
    --d:'Fixel Display','Helvetica Neue',Arial,sans-serif;
    --t:'Fixel Text','Helvetica Neue',Arial,sans-serif;
    --m:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --x:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--k);color:var(--w);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  body{font-family:var(--t);font-size:16px;line-height:1.4;min-height:100dvh;display:flex;flex-direction:column}
  ::selection{background:var(--w);color:var(--k)}
  a{color:inherit;text-decoration:none}

  header{display:flex;justify-content:space-between;align-items:baseline;
    padding:calc(env(safe-area-inset-top) + 14px) var(--x) 12px;border-bottom:1px solid var(--w)}
  .mono{font-family:var(--m);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .mark{font-family:var(--d);font-weight:800;font-size:16px;letter-spacing:.02em}

  .hero{padding:10vh var(--x) 8vh;border-bottom:1px solid var(--w)}
  h1{font-family:var(--d);font-weight:800;text-transform:uppercase;
    font-size:clamp(46px,13.5vw,168px);line-height:.92;letter-spacing:-.02em}
  .hero p{margin-top:24px;font-family:var(--d);font-weight:600;font-size:clamp(17px,4.4vw,30px);line-height:1.2;max-width:22ch}

  .rows{border-bottom:1px solid var(--w)}
  .rows .lead{padding:14px var(--x)}
  .row{display:grid;grid-template-columns:44px 1fr;border-top:1px solid var(--w);cursor:pointer;
    -webkit-tap-highlight-color:transparent;background:none;border-left:0;border-right:0;border-bottom:0;
    width:100%;text-align:left;color:var(--w);font:inherit;padding:0}
  .row .n{font-family:var(--m);font-size:11px;padding:18px 0 0 var(--x)}
  .row .q{font-family:var(--d);font-weight:600;font-size:clamp(17px,4.6vw,30px);line-height:1.15;padding:16px var(--x) 18px 0}
  .row .a{grid-column:2;font-family:var(--t);font-size:clamp(15px,3.9vw,20px);line-height:1.35;
    padding:0 var(--x) 20px 0;display:none;max-width:44ch}
  .row.on{background:var(--w);color:var(--k)}
  .row.on .a{display:block}
  @media (hover:hover){ .row:hover{background:var(--w);color:var(--k)} }
  .row:focus-visible{outline:2px solid var(--w);outline-offset:-2px}

  .what{padding:28px var(--x);border-bottom:1px solid var(--w);display:grid;gap:18px;max-width:64ch}
  .what p{font-size:clamp(16px,4.2vw,21px);line-height:1.35}
  .call{display:block;font-family:var(--d);font-weight:800;text-transform:uppercase;
    font-size:clamp(28px,9vw,96px);line-height:1;letter-spacing:-.02em;padding:26px var(--x);border-bottom:1px solid var(--w)}
  @media (hover:hover){ .call:hover{background:var(--w);color:var(--k)} }
  .call:active{background:var(--w);color:var(--k)}
  footer{margin-top:auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:14px var(--x) calc(env(safe-area-inset-bottom) + 16px)}
</style>
</head>
<body>
<header>
  <a class="mark" href="/">137lab</a>
  <span class="mono" style="text-transform:none">α⁻¹ = 137.036</span>
</header>

<section class="hero">
  <h1>Nonlinear<br>Evolution.</h1>
  <p>Navigating leaders to the next strategic horizon.</p>
</section>

<section class="rows" aria-label="One of these is yours">
  <div class="lead mono">One of these is yours</div>
  <div id="rows"></div>
</section>

<section class="what" id="what"></section>

<a class="call" href="https://cal.com/137lab-xyz/30min" rel="noopener">One call →</a>

<footer>
  <span class="mono">Applied metaphysics. Direct experience only.</span>
  <span class="mono">Woo-woo removed for engineering reasons.</span>
</footer>

<script>
/* контент = дані. Реплики — з публічних розмов засновників 2025–2026 (джерела: data/library/2026-09-*.md), без атрибуції. */
const ROWS = [
  { q:'The body is my bottleneck.',                         a:'The body is not a bottleneck. It is a sensor. You read its data as a system error.' },
  { q:'Every result I get depends on my state.',            a:'Yes. And state is not weather. It is a variable: measurable, holdable, returnable. You already do this — blind.' },
  { q:'The psyche will not hold, even with the best AI.',   a:'You have named the limit. What comes next is not more intelligence. It is a different operating system.' },
  { q:'More ideas than resource to build them.',            a:'The resource is not time or money. It is attention. Nobody has counted it.' },
  { q:'Dozens of projects. I cannot lead all of them.',     a:'Second seat without losing energy is a skill, not a defeat.' }
];
const WHAT = [
  'A lab. Two humans and one AI co-author.',
  'State, attention, energy — treated as engineering. Metaphysics here is not a theory. It runs in the background.',
  'No promises. Price after the call.'
];

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
const rows = document.getElementById('rows');
ROWS.forEach((r,i)=>{
  const b=el('button','row'); b.type='button';
  b.append(el('span','n','0'+(i+1)), el('span','q',r.q), el('span','a',r.a));
  b.addEventListener('click',()=>{
    const on=b.classList.contains('on');
    rows.querySelectorAll('.row').forEach(x=>x.classList.remove('on'));
    if(!on){ b.classList.add('on'); try{localStorage.setItem('137.main.picked',String(i+1));}catch(_){} }
  });
  rows.appendChild(b);
});
const what=document.getElementById('what');
WHAT.forEach(t=>what.appendChild(el('p',null,t)));
</script>
</body>
</html>
