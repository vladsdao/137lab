<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04060a">
<meta name="description" content="137lab — лабораторія. Стан як інженерна задача.">
<link rel="icon" sizes="32x32" href="/icons/favicon-32x32.png">
<title>137lab</title>
<style>
  /* ── 137lab · /main · v1 «зріз на порозі» (слово Влада 10.09: головна для засновників —
     загадкова, недоступна, лаконічна, резонуюча; не опис, а влучання і гра).
     Чотири екрани без скролу: поріг (тримай 1,37 с) → п'ять речень, одне — твоє →
     дзеркало → одна двері. Речення — з публічних розмов засновників 2025–2026
     (data/library/2026-09-*.md); дзеркала — голос лабораторії.
     Дизайн-мова «поле» (рішення 25.08). Контент = дані (SCREENS, MIRRORS). Один файл, нуль збірки.
     noindex до слова Влада; корінь не торкаємо. ── */
  @font-face{font-family:'Unbounded';src:url('../beta/site/_fonts/unbounded-v12-cyrillic_latin-200.woff2') format('woff2');font-weight:200;font-display:swap}
  @font-face{font-family:'Unbounded';src:url('../beta/site/_fonts/unbounded-v12-cyrillic_latin-300.woff2') format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:'Manrope';src:url('../beta/site/_fonts/manrope-v20-cyrillic_latin-300.woff2') format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:'Manrope';src:url('../beta/site/_fonts/manrope-v20-cyrillic_latin-regular.woff2') format('woff2');font-weight:400;font-display:swap}
  :root{
    --void:#04060a; --star:#eaf0f4; --haze:#96a2ad; --edge:rgba(234,240,244,.26);
    --d:'Unbounded',sans-serif; --t:'Manrope','Helvetica Neue',sans-serif;
    --hold:1370ms; /* α⁻¹ ≈ 137 → 1,37 с. Одна дивність на сторінку. */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--void);color:var(--star);overflow:hidden;
    font-family:var(--t);font-weight:300;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  ::selection{background:var(--star);color:var(--void)}
  #field{position:fixed;inset:0;z-index:0;opacity:.5}
  .mark{position:fixed;top:calc(env(safe-area-inset-top) + 18px);left:20px;z-index:3;
    font-family:var(--d);font-weight:200;font-size:13px;letter-spacing:.32em;color:var(--haze);text-decoration:none}
  .mark b{font-weight:300;color:var(--star)}
  .coord{position:fixed;top:calc(env(safe-area-inset-top) + 18px);right:20px;z-index:3;
    font-family:var(--t);font-size:11px;letter-spacing:.18em;color:var(--haze);opacity:.7}

  .screen{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:calc(env(safe-area-inset-top) + 72px) 24px calc(env(safe-area-inset-bottom) + 40px);
    text-align:center;opacity:0;visibility:hidden;transform:translateY(14px);
    transition:opacity .9s ease,transform .9s ease,visibility 0s .9s}
  .screen.on{opacity:1;visibility:visible;transform:none;transition:opacity 1.1s ease .15s,transform 1.1s ease .15s}
  .kicker{font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:var(--haze);margin-bottom:26px}
  .line{font-family:var(--d);font-weight:200;line-height:1.18;letter-spacing:.01em;max-width:720px}
  .line.big{font-size:clamp(28px,7.2vw,58px);text-shadow:0 0 36px rgba(234,240,244,.18)}
  .line.mid{font-size:clamp(20px,4.6vw,34px)}
  .after{margin-top:22px;font-size:clamp(15px,3.8vw,18px);line-height:1.6;color:var(--haze);max-width:520px}
  .quiet{margin-top:34px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--haze);opacity:.75}

  /* поріг: коло, яке наливається, поки тримаєш; подія — на відпусканні */
  .gate{margin-top:56px;position:relative;width:76px;height:76px;border-radius:50%;cursor:pointer;
    -webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;outline:none;background:none;border:none}
  .gate svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .gate .rim{fill:none;stroke:var(--edge);stroke-width:1}
  .gate .arc{fill:none;stroke:var(--star);stroke-width:1.5;stroke-dasharray:226;stroke-dashoffset:226;
    transition:stroke-dashoffset .12s linear}
  .gate.holding .arc{transition:stroke-dashoffset var(--hold) linear;stroke-dashoffset:0}
  .gate .core{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--star);
    box-shadow:0 0 18px rgba(234,240,244,.6)}
  .gate .n{position:absolute;left:0;right:0;top:100%;margin-top:14px;font-family:var(--d);font-weight:200;font-size:13px;
    letter-spacing:.2em;color:var(--haze);opacity:0;transition:opacity .3s}
  .gate.holding .n,.gate.done .n{opacity:1}
  .gate:focus-visible .rim{stroke:var(--star)}

  /* п'ять речень: тримаєш своє — чорнило підкреслює */
  .rows{display:flex;flex-direction:column;gap:6px;width:100%;max-width:640px}
  .row{position:relative;padding:15px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;
    font-family:var(--d);font-weight:200;font-size:clamp(16px,4.3vw,24px);line-height:1.3;color:var(--star);
    background:none;border:none;border-bottom:1px solid rgba(234,240,244,.1);outline:none;text-align:center;
    transition:color .25s,opacity .4s}
  .row::after{content:'';position:absolute;left:50%;bottom:-1px;height:1px;width:0;background:var(--star);
    transform:translateX(-50%);transition:width .1s linear}
  .row.holding::after{transition:width var(--hold) linear;width:100%}
  .row:focus-visible{color:var(--haze)}
  .rows.chosen .row:not(.picked){opacity:.18}

  .doors{margin-top:40px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .door{font-family:var(--d);font-weight:300;font-size:14px;letter-spacing:.1em;color:var(--star);text-decoration:none;
    border:1px solid var(--edge);border-radius:99px;padding:16px 30px;transition:border-color .25s,box-shadow .25s}
  .door:hover,.door:focus-visible{border-color:var(--star);box-shadow:0 0 28px rgba(234,240,244,.14);outline:none}
  .door.second{border:none;color:var(--haze);font-weight:200;font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:8px}
  .back{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:3;background:none;border:none;
    color:var(--haze);font-family:var(--t);font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity .4s}
  .back.on{opacity:.7}
  @media (prefers-reduced-motion: reduce){
    .screen,.screen.on{transition:none;transform:none}
    .gate.holding .arc,.row.holding::after{transition:none}
  }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<a class="mark" href="/">137<b>lab</b></a>
<div class="coord" aria-hidden="true">α⁻¹ ≈ 137,036</div>

<!-- 0 · поріг -->
<section class="screen on" id="s0" aria-label="Поріг">
  <div class="kicker">координата</div>
  <h1 class="line big">Реальність — гра.</h1>
  <p class="after">У неї можна грати, а можна спостерігати.</p>
  <button class="gate" id="gate" aria-label="Тримай, щоб увійти">
    <svg viewBox="0 0 76 76"><circle class="rim" cx="38" cy="38" r="36"/><circle class="arc" cx="38" cy="38" r="36"/></svg>
    <span class="core"></span><span class="n" id="gateN">0,00</span>
  </button>
  <div class="quiet">тримай</div>
</section>

<!-- 1 · п'ять речень -->
<section class="screen" id="s1" aria-label="Одне з цього — твоє">
  <div class="kicker">одне з цього — твоє</div>
  <div class="rows" id="rows" role="list"></div>
  <div class="quiet">тримай своє</div>
</section>

<!-- 2 · дзеркало -->
<section class="screen" id="s2" aria-label="Дзеркало">
  <div class="kicker">дзеркало</div>
  <p class="line mid" id="mirror"></p>
  <p class="after" id="mirrorAfter"></p>
  <button class="gate" id="gate2" aria-label="Тримай, щоб іти далі">
    <svg viewBox="0 0 76 76"><circle class="rim" cx="38" cy="38" r="36"/><circle class="arc" cx="38" cy="38" r="36"/></svg>
    <span class="core"></span><span class="n" id="gateN2">0,00</span>
  </button>
  <div class="quiet">тримай</div>
</section>

<!-- 3 · двері -->
<section class="screen" id="s3" aria-label="Двері">
  <div class="kicker">137lab</div>
  <p class="line mid" id="what"></p>
  <p class="after" id="whatAfter"></p>
  <div class="doors">
    <a class="door" id="doorCall" href="https://cal.com/137lab-xyz/30min" rel="noopener">Один дзвінок</a>
    <a class="door second" href="/beta/site/">читати далі</a>
  </div>
  <div class="quiet" id="whatQuiet"></div>
</section>

<button class="back" id="back" aria-label="Назад">← назад</button>

<script>
/* ── контент = дані. Речення — з публічних розмов 2025–2026 (джерела в data/library);
   дзеркала — від лабораторії. Жодне речення не приписане: на порозі важливо, чиє воно для гостя. ── */
const SCREENS = {
  rows: [
    { id:'body',   t:'Тіло — мій ботлнек.' },
    { id:'state',  t:'На всі мої результати впливає мій стан.' },
    { id:'psyche', t:'Психіка не витримає, навіть якщо ШІ — найкращий.' },
    { id:'ideas',  t:'Моїх ідей більше, ніж ресурсу їх реалізувати.' },
    { id:'lead',   t:'Десятки проєктів. Не можу бути лідером всюди.' }
  ],
  what: 'Лабораторія. Двоє людей і ШІ-співавтор.',
  whatAfter: 'Стан, увага, енергія — як інженерна задача. Метафізика тут не теорія: вона працює у бекграунді. Ми нічого не обіцяємо. Ціна — після дзвінка.',
  whatQuiet: 'це не для всіх · просто'
};
const MIRRORS = {
  body:   { t:'Тіло — не боттлнек. Тіло — датчик.', a:'Ти читаєш його показання як помилку системи. Ми читаємо їх як дані.' },
  state:  { t:'Так. І стан — не погода.', a:'Це змінна: її можна виміряти, тримати і повертати. Насправді ти вже це робиш — наосліп.' },
  psyche: { t:'Ти вже назвав межу.', a:'Далі не більше інтелекту, а інша операційна система. Симбіоз — це не про ШІ. Це про те, хто за кермом.' },
  ideas:  { t:'Ресурс — не час і не гроші.', a:'Ресурс — увага. Її ніхто не рахував. Звідси і різниця між ідеями та зробленим.' },
  lead:   { t:'Бути другим номером без втрати енергії — навичка.', a:'Не поразка. Їй можна навчитись швидше, ніж здається, — тому що поле.' }
};

/* ── стан ── */
let cur = 0, picked = null;
const S = [...document.querySelectorAll('.screen')];
const back = document.getElementById('back');
function go(n){
  cur = n;
  S.forEach((s,i)=>s.classList.toggle('on', i===n));
  back.classList.toggle('on', n>0);
  history.replaceState(null,'', n ? '#'+['','vybir','dzerkalo','dveri'][n] : location.pathname);
}
back.addEventListener('click', ()=>go(Math.max(0,cur-1)));

/* ── утримання: подія на відпусканні, після повних 1,37 с ── */
function holdable(el, onDone, counter){
  let t0=0, timer=0, iv=0, armed=false, down=false;
  const HOLD = 1370; /* зведення — таймером, не кадрами: rAF у фоні спить, час — ні */
  function show(){
    const d = Math.min(HOLD, performance.now() - t0);
    if (counter) counter.textContent = (d/1000).toFixed(2).replace('.',',');
  }
  function start(e){
    if (e.type==='pointerdown' && e.button!==0) return;
    if (down) return;
    e.preventDefault();
    down=true; armed=false; el.classList.add('holding'); t0=performance.now();
    timer=setTimeout(()=>{ armed=true; show(); }, HOLD);
    iv=setInterval(show, 40);
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
  }
  function end(){
    if (!down) return;
    down=false; clearTimeout(timer); clearInterval(iv);
    if (armed){ el.classList.remove('holding'); el.classList.add('done'); onDone(); }
    else { el.classList.remove('holding'); if (counter) counter.textContent='0,00'; }
  }
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', end);
  el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onDone(); } });
  el.addEventListener('contextmenu', e=>e.preventDefault());
}

/* ── екрани ── */
holdable(document.getElementById('gate'), ()=>{ setTimeout(()=>go(1), 240); }, document.getElementById('gateN'));

const rows = document.getElementById('rows');
SCREENS.rows.forEach(r=>{
  const b = document.createElement('button');
  b.className='row'; b.type='button'; b.textContent=r.t; b.setAttribute('role','listitem');
  holdable(b, ()=>{
    picked = r.id; rows.classList.add('chosen'); b.classList.add('picked');
    const m = MIRRORS[r.id];
    document.getElementById('mirror').textContent = m.t;
    document.getElementById('mirrorAfter').textContent = m.a;
    setTimeout(()=>go(2), 520);
  });
  rows.appendChild(b);
});

holdable(document.getElementById('gate2'), ()=>{ setTimeout(()=>go(3), 240); }, document.getElementById('gateN2'));
document.getElementById('what').textContent = SCREENS.what;
document.getElementById('whatAfter').textContent = SCREENS.whatAfter;
document.getElementById('whatQuiet').textContent = SCREENS.whatQuiet;
document.getElementById('doorCall').addEventListener('click', ()=>{
  try{ localStorage.setItem('137.main.picked', picked||''); }catch(_){}
});

/* ── поле: частинки з диханням Курамото (мова «поле», проба C 25.08) ── */
(function(){
  const c = document.getElementById('field'), ctx = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,dpr;
  function size(){ dpr=Math.min(devicePixelRatio||1,2); W=c.width=innerWidth*dpr; H=c.height=innerHeight*dpr; }
  size(); addEventListener('resize', size);
  const N = innerWidth < 600 ? 90 : 160, K = 1.1, pts=[];
  for (let i=0;i<N;i++) pts.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.012,vy:(Math.random()-.5)*.012,
    ph:Math.random()*2*Math.PI, w:0.7+Math.random()*0.7, r:0.8+Math.random()*1.6});
  const glow=document.createElement('canvas'); glow.width=glow.height=64;
  const g=glow.getContext('2d'), grad=g.createRadialGradient(32,32,0,32,32,32);
  grad.addColorStop(0,'rgba(234,240,244,1)'); grad.addColorStop(.35,'rgba(234,240,244,.34)'); grad.addColorStop(1,'rgba(234,240,244,0)');
  g.fillStyle=grad; g.fillRect(0,0,64,64);
  let last=0;
  function step(ts){
    const dt=Math.min((ts-last)/1000,.05)||.016; last=ts;
    let sx=0,sy=0; for(const p of pts){sx+=Math.cos(p.ph);sy+=Math.sin(p.ph);}
    const psi=Math.atan2(sy,sx), r=Math.hypot(sx,sy)/N;
    ctx.clearRect(0,0,W,H);
    for(const p of pts){
      p.ph+=(p.w+K*r*Math.sin(psi-p.ph))*dt;
      p.x=(p.x+p.vx*dt+1)%1; p.y=(p.y+p.vy*dt+1)%1;
      const bright=0.12+0.88*(Math.sin(p.ph)+1)/2, size=p.r*10*dpr*(0.7+0.5*bright);
      ctx.globalAlpha=bright*0.85;
      ctx.drawImage(glow, p.x*W-size/2, p.y*H-size/2, size, size);
    }
    ctx.globalAlpha=1;
    if(!reduce) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
