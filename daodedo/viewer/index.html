<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060606">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>DAODEDO · Зритель — эскиз</title>
<!--
  ЭСКИЗ «Зритель» v2 — ЖИВАЯ КОМНАТА (2026-08-12).
  Никаких выдуманных участников: атомы = реально присутствующие люди
  (Supabase Realtime presence), SYNC срабатывает мгновенно у всех
  (broadcast). Кто в комнате — тот уже часть фигуры; кто синкается —
  светится и рождает волну резонанса по всем связям.
  Врата встречи: инь-ян, таймер до начала, по кругу собираются фигурки
  ожидающих (без чисел — плотность круга говорит сама). Поток: полюс
  хедлайнера дышит в верхней трети; у зрителя одна кнопка — SYNC:
  зажал — его солнышко летит к полюсу, полюс растёт, от него
  разрастается кристаллическая решётка; пока держишь — твоя нить
  внимания светится. Другие зрители (в эскизе — призраки) вливаются
  своими солнышками. Транспорт комнаты — следующая ступень: события
  уже ходят по шине-драфту.
  Параметры: ?wait=сек до старта (0 — сразу в поток), ?room=имя комнаты.
-->
<style>
*, *::before, *::after {
  margin:0; padding:0; box-sizing:border-box;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
:root {
  --bg:#060606;
  --text:#f0ede6;
  --dim:#6f6b64;
  --hot:#ff5a4d;
  --font:'Space Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
html, body {
  height:100%; background:var(--bg); color:var(--text); font-family:var(--font);
  overflow:hidden; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent; touch-action:none;
}
#stage { position:fixed; inset:0; width:100vw; height:100dvh; }
canvas#field { position:absolute; inset:0; width:100%; height:100%; display:block; }

.brand {
  position:fixed; left:16px; top:calc(12px + env(safe-area-inset-top));
  font-size:9px; letter-spacing:.26em; text-transform:uppercase; color:var(--dim); z-index:30;
}

#hint {
  position:fixed; left:0; right:0; bottom:calc(150px + env(safe-area-inset-bottom));
  text-align:center; z-index:40;
  font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--text);
  opacity:0; transition:opacity .8s ease; pointer-events:none;
}
#hint.on { opacity:.85; }

/* ── врата встречи ───────────────────────────── */
#gate {
  position:fixed; inset:0; z-index:60; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;
  transition:opacity 1.4s ease;
}
#gate.off { opacity:0; pointer-events:none; }
#gateRing { position:relative; width:280px; height:280px; }
#gateRing canvas { position:absolute; inset:0; }
#gateRing .yin {
  position:absolute; left:50%; top:50%; width:96px; height:96px; margin:-48px 0 0 -48px;
  border-radius:50%;
  background:conic-gradient(from 0deg, #f0ede6 0 50%, #0a0a0a 50% 100%);
  box-shadow:0 0 34px -8px rgba(240,237,230,.5);
  animation:yinspin 9s linear infinite;
}
@keyframes yinspin { to { transform:rotate(360deg); } }
#gate .cap { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim); }
#timer { font-size:22px; letter-spacing:.24em; color:var(--text); font-weight:700; }

/* ── кнопка SYNC ─────────────────────────────── */
#syncBtn {
  position:fixed; left:50%; bottom:calc(34px + env(safe-area-inset-bottom));
  width:120px; height:132px; margin-left:-60px;
  border:none; background:none; cursor:pointer; font-family:var(--font);
  display:grid; place-items:center; touch-action:none; z-index:26;
  opacity:0; transition:opacity 1.2s ease;
}
#syncBtn.on { opacity:1; }
#syncBtn svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
#syncBtn svg path {
  stroke-width:13; stroke-linejoin:round;
  fill:#e9e3d6; stroke:#e9e3d6;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.55));
  transition:stroke .25s ease;
}
#syncBtn .lbl { position:relative; z-index:2; font-size:12px; letter-spacing:.1em; color:#332e25; }
#syncBtn .glow {
  position:absolute; inset:-12px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(255,90,77,.5) 0%, rgba(255,90,77,0) 68%);
  opacity:0;
}
#syncBtn.hold svg path { stroke:var(--hot); }
#syncBtn.hold .glow { animation:glowbreath 1.2s ease-in-out infinite; }
/* зов синка от хедлайнера: кнопка сама просится в руку */
#syncBtn.call svg path { stroke:var(--hot); }
#syncBtn.call .glow { animation:callbreath 1.6s ease-in-out infinite; }
#syncBtn.call { animation:callscale 1.6s ease-in-out infinite; }
@keyframes glowbreath { 0%,100% { opacity:.25; } 50% { opacity:.75; } }
@keyframes callbreath { 0%,100% { opacity:.18; } 50% { opacity:.6; } }
@keyframes callscale  { 0%,100% { transform:scale(1); } 50% { transform:scale(1.045); } }

#bgout { display:none; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="field"></canvas>
  <span class="brand">DAODEDO · зритель</span>
  <div id="hint"></div>

  <button id="syncBtn" aria-label="Sync">
    <span class="glow"></span>
    <svg viewBox="0 0 120 132"><path d="M60 10 L108 38 V94 L60 122 L12 94 V38 Z"/></svg>
    <span class="lbl" id="syncLbl">резонанс</span>
  </button>

  <div id="gate">
    <div id="gateRing">
      <canvas id="ringCnv" width="280" height="280"></canvas>
      <div class="yin"></div>
    </div>
    <span id="timer">—:—</span>
    <span class="cap">DAO DE DO</span>
  </div>

  <audio id="bgout" playsinline></audio>
</div>

<script>
(function(){
'use strict';

/* ── шина (драфт: события зрителя готовы к транспорту комнаты) ── */
var Bus = (function(){
  var et = new EventTarget(), seq = 0;
  return {
    emit: function(type, data){
      var ev = { v:'sketch', ts:Date.now(), seq:++seq, type:type, data:data || {} };
      et.dispatchEvent(new CustomEvent('bus', { detail:ev }));
      return ev;
    },
    on: function(type, fn){
      et.addEventListener('bus', function(e){
        if (type === '*' || e.detail.type === type) fn(e.detail);
      });
    }
  };
})();

var qs = new URLSearchParams(location.search);
var _w = parseInt(qs.get('wait'), 10);
var WAIT_S = isNaN(_w) ? 75 : Math.max(0, _w);
var ROOM = (qs.get('room') || 'daodedo-field').slice(0, 40);
var ME = (crypto.randomUUID ? crypto.randomUUID() : 'me-' + Math.random().toString(36).slice(2));
var state = 'gate';          /* gate → stream */
function lightColor(a){ return 'rgba(240,237,230,' + (a == null ? 1 : a) + ')'; }

/* ═══════════════════════════════════════════════
   АУДИО ЗРИТЕЛЯ: тихий мир потока + тон синка
   ═══════════════════════════════════════════════ */
var Audio = (function(){
  var ctx = null, master = null, worldGain = null;
  function ensure(){
    if (!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.85;
      var out = document.getElementById('bgout');
      var routed = false;
      try {
        var elemDest = ctx.createMediaStreamDestination();
        master.connect(elemDest);
        out.srcObject = elemDest.stream;
        var pp = out.play();
        routed = true;
        if (pp && pp.catch) pp.catch(function(){
          if (routed){ routed = false; master.connect(ctx.destination); }
        });
        if ('mediaSession' in navigator && window.MediaMetadata)
          navigator.mediaSession.metadata = new MediaMetadata({ title:'DAO DE DO', artist:'137lab' });
      } catch(_){}
      if (!routed) master.connect(ctx.destination);
      var keep = ctx.createOscillator(); keep.frequency.value = 90;
      var kg = ctx.createGain(); kg.gain.value = 0.002;
      keep.connect(kg).connect(master); keep.start();
    }
    if (ctx.state !== 'running') ctx.resume().catch(function(){});
    return ctx;
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && ctx){
      if (ctx.state !== 'running') ctx.resume().catch(function(){});
      var o = document.getElementById('bgout');
      if (o && o.srcObject && o.paused) o.play().catch(function(){});
    }
  });

  function tone(o){
    var c = ensure(), t = (o.at || c.currentTime);
    var osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.value = o.f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, o.g), t + (o.a || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + (o.dur || 0.3));
    osc.connect(g).connect(o.dest || master);
    osc.start(t); osc.stop(t + (o.dur || 0.3) + 0.05);
  }

  /* мир потока: мягкая смесь дронов — зритель слышит эфир хедлайнера */
  function startWorld(){
    var c = ensure();
    worldGain = c.createGain(); worldGain.gain.value = 0.7;
    worldGain.connect(master);
    [[110, 0.03, 11, 0], [164.8, 0.02, 9, 2], [220, 0.014, 13, 5]].forEach(function(d){
      var o = c.createOscillator(); o.frequency.value = d[0];
      var gg = c.createGain(); gg.gain.value = d[1];
      var lfo = c.createOscillator(); lfo.frequency.value = 1 / d[2];
      var lg = c.createGain(); lg.gain.value = d[1] * 0.5;
      lfo.connect(lg).connect(gg.gain);
      o.connect(gg).connect(worldGain);
      o.start(); lfo.start(c.currentTime + d[3]);
    });
    setInterval(function(){
      if (Math.random() < 0.5) tone({ f:880, g:0.01, a:0.4, dur:4, dest:worldGain });
    }, 8000);
  }

  /* нить синка: тихий тон с медленными биениями — общий язык с хедлайнером */
  var s1 = null, s2 = null, sg = null;
  function syncDown(){
    var c = ensure(), t = c.currentTime;
    syncUp();
    s1 = c.createOscillator(); s1.frequency.value = 220;
    s2 = c.createOscillator(); s2.frequency.value = 221.4;
    sg = c.createGain();
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.exponentialRampToValueAtTime(0.045, t + 1.2);
    s1.connect(sg); s2.connect(sg); sg.connect(master);
    s1.start(); s2.start();
  }
  function syncUp(){
    if (!sg) return;
    var c = ensure(), t = c.currentTime;
    sg.gain.cancelScheduledValues(t);
    sg.gain.setValueAtTime(Math.max(0.001, sg.gain.value), t);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    s1.stop(t + 1.6); s2.stop(t + 1.6);
    s1 = null; s2 = null; sg = null;
  }
  function joinChime(mine){
    tone({ f: mine ? 660 : 520, g: mine ? 0.045 : 0.02, a:0.02, dur:0.9 });
    tone({ f: mine ? 990 : 780, g: mine ? 0.02 : 0.01, a:0.03, dur:1.1 });
  }
  return { ensure:ensure, startWorld:startWorld, syncDown:syncDown, syncUp:syncUp, joinChime:joinChime };
})();

/* ═══════════════════════════════════════════════
   ВРАТА: таймер + фигурки ожидающих по кругу
   ═══════════════════════════════════════════════ */
var Gate = (function(){
  var cnv = document.getElementById('ringCnv'), g2 = cnv.getContext('2d');
  var timerEl = document.getElementById('timer');
  var startAt = performance.now() + WAIT_S * 1000;
  var waiters = [];            /* фигурки = реально пришедшие люди */

  function setPeople(n){
    while (waiters.length < n)
      waiters.push({ a: Math.random() * 2 * Math.PI, born: performance.now() });
    while (waiters.length > n) waiters.pop();
  }

  function figure(x, y, al, s){
    g2.strokeStyle = lightColor(al); g2.lineWidth = 1.3; g2.lineCap = 'round';
    g2.beginPath(); g2.arc(x, y - 5 * s, 2.6 * s, 0, 6.29); g2.stroke();
    g2.beginPath(); g2.moveTo(x, y - 2 * s); g2.lineTo(x, y + 4 * s); g2.stroke();
    g2.beginPath(); g2.moveTo(x - 3 * s, y + 8 * s); g2.lineTo(x, y + 4 * s); g2.lineTo(x + 3 * s, y + 8 * s); g2.stroke();
  }

  function draw(now){
    if (state !== 'gate') return;
    g2.clearRect(0, 0, 280, 280);
    /* тёмное кольцо-орбита */
    g2.strokeStyle = 'rgba(240,237,230,.10)'; g2.lineWidth = 1;
    g2.beginPath(); g2.arc(140, 140, 118, 0, 6.29); g2.stroke();
    waiters.forEach(function(w, i){
      var age = Math.min(1, (now - w.born) / 1200);
      var a = w.a + now * 0.000045 * (i % 2 ? 1 : -1);   /* медленный ход по кругу */
      var x = 140 + 118 * Math.cos(a), y = 140 + 118 * Math.sin(a);
      figure(x, y, 0.25 + 0.45 * age, 0.9 + 0.2 * Math.sin(now * 0.002 + i));
    });
    var left = Math.max(0, startAt - now);
    var mm = Math.floor(left / 60000), ss = Math.floor(left % 60000 / 1000);
    timerEl.textContent = mm + ':' + (ss < 10 ? '0' : '') + ss;
    if (left <= 0) enterStream();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  document.getElementById('gate').addEventListener('pointerdown', function(){
    enterStream();               /* в эскизе можно войти раньше касанием */
  });

  return { stop: function(){}, setPeople: setPeople };
})();

/* ═══════════════════════════════════════════════
   ПОТОК: полюс хедлайнера, солнышки, решётка
   ═══════════════════════════════════════════════ */
var Field = (function(){
  var cnv = document.getElementById('field'), ctx2 = cnv.getContext('2d');
  var dpr = Math.min(devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var atoms = [];          /* равные люди: {id, mine, syncing, cur, tgt, born, flash, alive, fade} */
  var rot = 0, spin = 0.00025, glow = 0, breathT0 = 0;
  var myHold = { on:false, fade:0 };
  var AR = 9;              /* радиус атома — у всех один */

  function size(){
    W = innerWidth; H = innerHeight;
    cnv.width = W * dpr; cnv.height = H * dpr;
  }
  size(); addEventListener('resize', size);

  function center(now){
    return {
      x: W * 0.5 + Math.sin(now * 0.00013) * W * 0.07,
      y: H * 0.30 + Math.sin(now * 0.00009) * H * 0.04
    };
  }
  function btnXY(){ return { x: W / 2, y: H - 100 }; }

  /* сакральная геометрия: точка → весика → многоугольники → семя жизни → кольца */
  function spacing(n){ return Math.max(34, 60 - n * 1.6); }
  function layout(n, now){
    var S = spacing(n), pts = [], i, a;
    if (n <= 0) return pts;
    if (n === 1){ pts.push([0, 0]); return pts; }
    if (n === 2){ pts.push([-S / 2, 0], [S / 2, 0]); return pts; }
    if (n <= 6){
      for (i = 0; i < n; i++){
        a = i / n * 2 * Math.PI - Math.PI / 2;
        pts.push([S * Math.cos(a), S * Math.sin(a)]);
      }
      return pts;
    }
    /* 7+: семя жизни — центр + гексагон, дальше второе кольцо */
    pts.push([0, 0]);
    for (i = 0; i < 6; i++){
      a = i / 6 * 2 * Math.PI - Math.PI / 2;
      pts.push([S * Math.cos(a), S * Math.sin(a)]);
    }
    var rest = n - 7;
    for (i = 0; i < rest; i++){
      var ring = 1 + Math.floor(i / 12);
      var idx = i % 12, cnt = Math.min(12, rest - Math.floor(i / 12) * 12);
      a = idx / cnt * 2 * Math.PI - Math.PI / 2 + ring * 0.26;
      var R2 = S * (1 + ring);
      pts.push([R2 * Math.cos(a), R2 * Math.sin(a)]);
    }
    return pts;
  }

  function retarget(now){
    var live = atoms.filter(function(at){ return at.fade > 0.05; });
    var pts = layout(live.length, now);
    live.forEach(function(at, i){
      at.tgt.x = pts[i][0]; at.tgt.y = pts[i][1];
    });
  }

  /* резонанс: волна вспышки пробегает по всем от нового атома */
  function resonate(fromAtom, now){
    glow = 1;
    atoms.forEach(function(at){
      var d = Math.hypot(at.tgt.x - fromAtom.tgt.x, at.tgt.y - fromAtom.tgt.y);
      setTimeout(function(){ at.flash = 1; }, d * 2.2);
    });
    spin = Math.min(0.0012, spin + 0.00012);   /* фигура крутится быстрее от людей */
  }

  function draw(now){
    ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx2.clearRect(0, 0, W, H);
    if (state !== 'stream'){ requestAnimationFrame(draw); return; }

    var c = center(now);
    var breath = 0.5 - 0.5 * Math.cos((now - breathT0) * 0.00105);
    glow = Math.max(0, glow - 0.012);
    rot += spin * 16;
    spin += (0.00025 + atoms.length * 0.00004 - spin) * 0.004;  /* после всплеска — успокаивается к живому ходу */

    /* фон: общая светимость растёт с фигурой */
    var live = atoms.filter(function(at){ return at.fade > 0.05; });
    var lum = Math.min(0.14, 0.04 + live.length * 0.012) + glow * 0.05;
    var g1 = ctx2.createRadialGradient(c.x, c.y, 0, c.x, c.y, W * 0.85);
    g1.addColorStop(0, 'rgba(240,237,230,' + (lum * (0.7 + 0.3 * breath)).toFixed(3) + ')');
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx2.fillStyle = g1; ctx2.fillRect(0, 0, W, H);

    /* атомы: пружиной к позициям фигуры; уходящие тают */
    var S = spacing(Math.max(1, live.length));
    var brS = 1 + 0.05 * breath;
    atoms.forEach(function(at){
      if (!at.alive) at.fade = Math.max(0, at.fade - 0.008); /* память присутствия тает медленно */
      at.cur.x += (at.tgt.x - at.cur.x) * 0.11;
      at.cur.y += (at.tgt.y - at.cur.y) * 0.11;
      at.flash = Math.max(0, at.flash - 0.03);
    });
    for (var i = atoms.length - 1; i >= 0; i--)
      if (atoms[i].fade <= 0.01){ atoms.splice(i, 1); retarget(now); }

    function world(at){
      /* атом жив: плавает вокруг своей сакральной позиции */
      var jx = Math.sin(now * 0.0016 + at.born * 0.013) * 2.6;
      var jy = Math.cos(now * 0.0013 + at.born * 0.017) * 2.6;
      var x = (at.cur.x + jx) * brS, y = (at.cur.y + jy) * brS;
      return {
        x: c.x + x * Math.cos(rot) - y * Math.sin(rot),
        y: c.y + x * Math.sin(rot) + y * Math.cos(rot)
      };
    }

    /* связи: атомы в молекулу — рёбра между близкими */
    for (var a1 = 0; a1 < atoms.length; a1++){
      for (var b1 = a1 + 1; b1 < atoms.length; b1++){
        var A = atoms[a1], B = atoms[b1];
        var d = Math.hypot(A.cur.x - B.cur.x, A.cur.y - B.cur.y);
        if (d > S * 1.45) continue;
        var pa = world(A), pb = world(B);
        var both = (A.syncing ? 1 : 0.35) * (B.syncing ? 1 : 0.35);
        var al = (0.07 + 0.2 * both + 0.22 * Math.max(A.flash, B.flash) + glow * 0.14) * Math.min(A.fade, B.fade);
        ctx2.strokeStyle = lightColor(al);
        ctx2.lineWidth = 1.1;
        ctx2.beginPath(); ctx2.moveTo(pa.x, pa.y); ctx2.lineTo(pb.x, pb.y); ctx2.stroke();
      }
    }

    /* сакральные окружности: пересечения сами рождают цветок жизни */
    atoms.forEach(function(at){
      var p = world(at);
      ctx2.strokeStyle = lightColor(((at.syncing ? 0.06 : 0.025) + 0.05 * breath + at.flash * 0.10) * at.fade);
      ctx2.lineWidth = 1;
      ctx2.beginPath(); ctx2.arc(p.x, p.y, S * brS, 0, 6.29); ctx2.stroke();
    });

    /* моя нить внимания — к моему атому, равному среди равных */
    if (myHold.on) myHold.fade = Math.min(1, myHold.fade + 0.05);
    else myHold.fade = Math.max(0, myHold.fade - 0.03);
    var mineAtom = null;
    atoms.forEach(function(at){ if (at.id === ME && at.alive) mineAtom = at; });
    if (myHold.fade > 0.02 && mineAtom){
      var mp = world(mineAtom), b2 = btnXY();
      var wob = Math.sin(now * 0.003) * 12;
      ctx2.strokeStyle = lightColor((0.2 + 0.25 * breath) * myHold.fade);
      ctx2.lineWidth = 1.5;
      ctx2.beginPath();
      ctx2.moveTo(b2.x, b2.y - 60);
      ctx2.quadraticCurveTo(b2.x + wob, (b2.y + mp.y) / 2, mp.x, mp.y);
      ctx2.stroke();
    }

    /* атомы — все одного размера; вспышка резонанса пробегает по каждому */
    atoms.forEach(function(at){
      var p = world(at);
      var lit = at.syncing ? 1 : 0.42;          /* здесь — часть фигуры; в синке — горит */
      ctx2.shadowColor = lightColor(1);
      ctx2.shadowBlur = ((at.syncing ? 16 : 6) + at.flash * 26 + glow * 8) * at.fade;
      ctx2.fillStyle = lightColor((0.32 + lit * 0.55 + at.flash * 0.2) * at.fade);
      ctx2.beginPath(); ctx2.arc(p.x, p.y, AR * (1 + at.flash * 0.25), 0, 6.29); ctx2.fill();
      ctx2.shadowBlur = 0;
      if (at.mine){   /* себя видно тонким кольцом — не больше, просто свой */
        ctx2.strokeStyle = lightColor(0.5 * at.fade);
        ctx2.lineWidth = 1;
        ctx2.beginPath(); ctx2.arc(p.x, p.y, AR + 5, 0, 6.29); ctx2.stroke();
      }
    });

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  return {
    /* присутствие: человек в комнате — уже часть фигуры */
    setPeople: function(ids){
      var now = performance.now();
      var seen = {};
      ids.forEach(function(id){ seen[id] = 1; });
      atoms.forEach(function(at){
        if (!seen[at.id]) at.alive = false;
        else if (!at.alive){ at.alive = true; at.fade = 1; }
      });
      var have = {};
      atoms.forEach(function(at){ if (at.alive) have[at.id] = 1; });
      ids.forEach(function(id){
        if (have[id]) return;
        atoms.push({
          id: id, mine: id === ME, syncing: false, born: now,
          flash: 0.6, alive: true, fade: 1,
          cur: { x: (Math.random() * 2 - 1) * 90, y: -140 - Math.random() * 60 },
          tgt: { x: 0, y: 0 }
        });
      });
      if (!breathT0) breathT0 = now;
      retarget(now);
    },
    /* sync — мгновенно: атом вспыхивает и волна бежит по связям */
    setSync: function(id, on){
      var found = null;
      atoms.forEach(function(at){ if (at.id === id) found = at; });
      if (!found) return;
      found.syncing = on;
      if (on){
        found.flash = 1;
        resonate(found, performance.now());
        Audio.joinChime(id === ME);
      }
    },
    syncingCount: function(){
      var n = 0; atoms.forEach(function(at){ if (at.alive && at.syncing) n++; });
      return n;
    },
    holdStart: function(){ myHold.on = true; if (!breathT0) breathT0 = performance.now(); },
    holdEnd: function(){ myHold.on = false; },
    beginBreath: function(){ breathT0 = performance.now(); }
  };
})();

/* ═══════════════════════════════════════════════
   ПОТОК: вход, кнопка SYNC, призраки
   ═══════════════════════════════════════════════ */
var hintEl = document.getElementById('hint'), hintTimer = null;
function hint(text, ttl){
  clearTimeout(hintTimer);
  if (!text){ hintEl.classList.remove('on'); return; }
  hintEl.textContent = text; hintEl.classList.add('on');
  hintTimer = setTimeout(function(){ hintEl.classList.remove('on'); }, ttl || 2600);
}

function enterStream(){
  if (state !== 'gate') return;
  state = 'stream';
  Gate.stop();
  Audio.ensure();
  Audio.startWorld();
  Field.beginBreath();
  document.getElementById('gate').classList.add('off');
  document.getElementById('syncBtn').classList.add('on');
  Bus.emit('viewer.join', {});
  setTimeout(function(){
    hint(SyncBtn.isCall() ? 'хедлайнер зовёт — держи sync' : 'держи резонанс — отзовись ленте', 3400);
  }, 1800);
  if (navigator.wakeLock && navigator.wakeLock.request)
    navigator.wakeLock.request('screen').catch(function(){});
}


/* кнопка: пока хедлайнер молчит — «резонанс» (отклик на ленту);
   когда он зовёт синк — становится «sync», горит и зовёт в общую фигуру */
var SyncBtn = (function(){
  var btn = document.getElementById('syncBtn');
  var lbl = document.getElementById('syncLbl');
  var held = false, call = false;

  function setCall(on){
    call = on;
    btn.classList.toggle('call', on && !held);
    lbl.textContent = on ? 'sync' : 'резонанс';
    if (on) hint('хедлайнер зовёт — держи sync', 3200);
  }

  btn.addEventListener('pointerdown', function(){
    if (state !== 'stream' || held) return;
    held = true;
    btn.classList.add('hold'); btn.classList.remove('call');
    Audio.syncDown();
    Field.holdStart();
    Field.setSync(ME, true);
    Room.publish('sync', { id: ME, on: true, res: !call });
    Bus.emit('sync.hold', { on:true, call:call });
  });
  ['pointerup', 'pointercancel'].forEach(function(n){
    btn.addEventListener(n, function(){
      if (!held) return;
      held = false;
      btn.classList.remove('hold');
      if (call) btn.classList.add('call');
      Audio.syncUp();
      Field.holdEnd();
      Field.setSync(ME, false);
      Room.publish('sync', { id: ME, on: false });
      Bus.emit('sync.hold', { on:false });
    });
  });
  return { setCall: setCall, isCall: function(){ return call; } };
})();

/* ═══════════════════════════════════════════════
   КОМНАТА: реальные люди — присутствие и мгновенный синк
   ═══════════════════════════════════════════════ */
var Room = (function(){
  var publishFn = null, people = [ME];
  function apply(){ Field.setPeople(people); Gate.setPeople(people.length); }
  apply();
  return {
    me: ME, room: ROOM,
    /* модуль-транспорт зовёт эти три двери */
    onPresence: function(list){
      /* list: [{id, syncing, role}] — presence и есть истина поля */
      var ids = list.map(function(p){ return p.id; }).filter(function(id){ return id !== 'headliner'; });
      people = ids.indexOf(ME) >= 0 ? ids : ids.concat([ME]);
      apply();
      list.forEach(function(p){
        if (p.role === 'headliner'){ SyncBtn.setCall(!!p.sync); return; }
        if (p.id !== ME) Field.setSync(p.id, !!p.syncing);
      });
    },
    onSync: function(p){
      if (!p || !p.id || p.id === ME) return;
      Field.setSync(p.id, !!p.on);
    },
    onHeadliner: function(p){ SyncBtn.setCall(!!(p && p.sync)); },
    ready: function(fn){ publishFn = fn; },
    publish: function(ev, payload){ if (publishFn) publishFn(ev, payload); }
  };
})();

document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.__room = Room;   /* дверь для транспорта */
})();
</script>

<script type="module">
/* ═══════════════════════════════════════════════
   ТРАНСПОРТ КОМНАТЫ — Supabase Realtime.
   presence = кто реально здесь; broadcast = мгновенный синк.
   Ни одной таблицы, ни одной записи в базу: только живой канал.
   ═══════════════════════════════════════════════ */
const R = window.__room;
const URL_ = 'https://bnfkicmzxljkhahqxfla.supabase.co';
const KEY_ = 'sb_publishable_w2yNutEh7zGyvNBwIPAZGw_kTfSY6mw';

try {
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  const sb = createClient(URL_, KEY_, {
    realtime: { params: { eventsPerSecond: 20 } },
    auth: { persistSession: false }
  });
  const ch = sb.channel('field:' + R.room, { config: { presence: { key: R.me, enabled: true }, broadcast: { self: false } } });

  const snapshot = () => Object.entries(ch.presenceState()).map(([id, metas]) => {
    const m = (metas && metas[0]) || {};
    return { id, syncing: !!m.syncing, sync: !!m.sync, role: m.role };
  });

  ch.on('presence', { event: 'sync' }, () => R.onPresence(snapshot()));
  ch.on('broadcast', { event: 'sync' }, ({ payload }) => R.onSync(payload));
  ch.on('broadcast', { event: 'headliner' }, ({ payload }) => R.onHeadliner(payload));

  ch.subscribe(async (status) => {
    if (status !== 'SUBSCRIBED') return;
    await ch.track({ role: 'viewer', syncing: false });
    R.ready((ev, payload) => {
      ch.send({ type: 'broadcast', event: ev, payload: payload });   /* мгновенно */
      if (ev === 'sync') ch.track({ role: 'viewer', syncing: !!payload.on });  /* и как состояние */
    });
    R.onPresence(snapshot());
  });

  addEventListener('pagehide', () => { try { ch.unsubscribe(); } catch (_) {} });
} catch (err) {
  /* без сети комната не собирается — экран остаётся живым соло */
}
</script>
