<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060606">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>DAODEDO · Профиль — эскиз</title>
<!--
  ЭСКИЗ «Профиль» v4 (правки Влада 2026-08-12, круг 3):
  река голоса — тоньше, у левого края, вечная (след не тает), тапом по ней
  ставятся метки-лайки; активные кнопки горят красноватым; сэмпл — тап
  пишет 4с и сразу крутит, зажатие открывает мини-соты сохранённых;
  картинка и символ — те же мини-соты-библиотеки (символы + свой текст);
  кисть с отменой; аватар — сота зарезервирована; центр белой — SYNC:
  зажимаешь — пульсирующая точка собирает внимание и дышит, растёт от
  удержания, дрейфует и не уезжает с лентой. Чёрная дека: + негатив
  (мир наизнанку на 2с) и бездна (держишь — время ленты замирает).
  Всё локально, ничего не покидает устройство.
-->
<style>
*, *::before, *::after {
  margin:0; padding:0; box-sizing:border-box;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}

:root {
  --bg:#060606;
  --text:#f0ede6;
  --dim:#6f6b64;
  --hot:#ff5a4d;                 /* красноватый — «в эфире» */
  --font:'Space Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}

html, body {
  height:100%; background:var(--bg); color:var(--text); font-family:var(--font);
  overflow:hidden; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
  user-select:none; touch-action:none;
}

#stage { position:fixed; inset:0; width:100vw; height:100dvh; }
canvas#field { position:absolute; inset:0; width:100%; height:100%; display:block; }

.brand {
  position:fixed; left:16px; top:calc(12px + env(safe-area-inset-top));
  font-size:9px; letter-spacing:.26em; text-transform:uppercase; color:var(--dim); z-index:30;
}

#hint {
  position:fixed; left:0; right:0; text-align:center; z-index:40;
  font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--text);
  opacity:0; transition:opacity .8s ease; pointer-events:none;
}
#hint.on { opacity:.85; }

/* ── гексагоны ───────────────────────────────── */
.hexbtn {
  position:absolute; width:96px; height:106px; margin:-53px 0 0 -48px;
  border:none; background:none; cursor:pointer; font-family:var(--font);
  display:grid; place-items:center; touch-action:none; z-index:26;
  transition:transform .2s ease-in;
}
.hexbtn.mid { transform:rotateY(90deg); }
.hexbtn svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.hexbtn svg path {
  stroke-width:12; stroke-linejoin:round;
  fill:#e9e3d6; stroke:#e9e3d6;
  filter:drop-shadow(0 2px 7px rgba(0,0,0,.5));
  transition:fill .25s ease, stroke .25s ease, filter .25s ease;
}
.hexbtn .lbl {
  position:relative; z-index:2; font-size:10px; letter-spacing:.06em;
  color:#332e25; transition:color .25s ease; line-height:1.3; text-align:center;
}
.hexbtn.dark svg path { fill:#121212; stroke:#242424; filter:drop-shadow(0 0 9px rgba(0,0,0,.85)); }
.hexbtn.dark .lbl { color:#b7b1a6; }
.hexbtn.stub svg path { opacity:.28; }
.hexbtn.stub .lbl { opacity:.4; letter-spacing:.2em; }
.hexbtn.pressed svg path { filter:brightness(1.3) drop-shadow(0 0 16px rgba(240,237,230,.7)); }
.hexbtn.armed svg path { filter:drop-shadow(0 0 12px rgba(240,237,230,.55)); }
/* «в эфире» — красноватый обвод + дышащее свечение.
   Только stroke и opacity: анимация CSS-фильтра на SVG молчит в iOS Safari. */
.hexbtn .glow {
  position:absolute; inset:-10px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(255,90,77,.55) 0%, rgba(255,90,77,0) 68%);
  opacity:0; transition:opacity .3s ease;
}
.hexbtn.live svg path, .hexbtn.dark.live svg path { stroke:var(--hot); }
.hexbtn.live .lbl, .hexbtn.dark.live .lbl { color:var(--hot); }
.hexbtn.live .glow { animation:glowbreath 1.4s ease-in-out infinite; }
.hexbtn.rec svg path, .hexbtn.dark.rec svg path { stroke:var(--hot); fill:#2a1512; }
.hexbtn.rec .lbl { color:var(--hot); }
.hexbtn.rec .glow { animation:glowbreath .7s ease-in-out infinite; }
.hexbtn.rec { animation:recpulse .8s ease-in-out infinite; }
@keyframes recpulse   { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
@keyframes glowbreath { 0%,100% { opacity:.25; } 50% { opacity:.75; } }

/* мини-соты: орбита-библиотека вокруг кнопки */
.minihex {
  position:absolute; width:52px; height:58px; margin:-29px 0 0 -26px;
  border:none; background:none; cursor:pointer; font-family:var(--font);
  display:grid; place-items:center; touch-action:none; z-index:46;
  opacity:0; transform:scale(.4); transition:opacity .25s ease, transform .25s ease;
}
.minihex.on { opacity:1; transform:scale(1); }
.minihex svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.minihex svg path {
  stroke-width:8; stroke-linejoin:round;
  fill:#1a1a1a; stroke:#2e2e2e;
  filter:drop-shadow(0 0 8px rgba(0,0,0,.8));
}
.minihex .lbl { position:relative; z-index:2; font-size:9px; color:#cfc9bd; letter-spacing:.04em; }
.minihex.selq svg path { stroke:#f0ede6; }
.minihex img, .minihex canvas { position:relative; z-index:2; width:30px; height:30px; object-fit:cover; }
#orbitShade { position:fixed; inset:0; z-index:44; background:rgba(3,3,3,.5); display:none; }
#orbitShade.on { display:block; }

/* отмена кисти — вплотную к соте кисти */
#undoBtn {
  position:fixed; width:38px; height:38px; margin:-19px 0 0 -19px; border-radius:50%;
  border:1px solid #2e2e2e; background:rgba(6,6,6,.8); color:var(--text);
  font-family:var(--font); font-size:14px; z-index:34; cursor:pointer;
  display:none; place-items:center;
}
#undoBtn.on { display:grid; }

/* ── кроссфейдер ─────────────────────────────── */
#fader {
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));
  width:260px; height:44px; z-index:28; touch-action:none; cursor:pointer;
}
#fader .track {
  position:absolute; left:24px; right:24px; top:50%; height:2px; margin-top:-1px;
  background:linear-gradient(90deg, rgba(240,237,230,.5), rgba(240,237,230,.14));
  border-radius:1px;
}
#fader .end { position:absolute; top:50%; transform:translateY(-50%); font-size:10px; color:var(--dim); pointer-events:none; }
#fader .end.l { left:2px; }
#fader .end.r { right:2px; }
#knob {
  position:absolute; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px;
  border-radius:50%; background:var(--text);
  box-shadow:0 0 12px -2px rgba(240,237,230,.8); pointer-events:none;
}

/* ── скорость ленты ──────────────────────────── */
#flow {
  position:fixed; right:6px; width:26px; z-index:28; touch-action:none;
  opacity:.3; transition:opacity .4s ease;
}
#flow.touch { opacity:.85; }
#flow .track { position:absolute; left:50%; top:0; bottom:0; width:2px; margin-left:-1px;
  background:linear-gradient(180deg, rgba(240,237,230,.35), rgba(240,237,230,.08)); }
#flowKnob {
  position:absolute; left:50%; width:12px; height:12px; margin:-6px 0 0 -6px;
  border-radius:50%; background:var(--text);
  box-shadow:0 0 8px -2px rgba(240,237,230,.8); pointer-events:none;
}

/* запись ленты */
#recBtn {
  position:fixed; right:14px; top:calc(10px + env(safe-area-inset-top));
  width:40px; height:40px; border:none; background:none; color:var(--dim);
  font-family:var(--font); font-size:15px; z-index:36; cursor:pointer;
}
#recBtn.on { color:var(--hot); animation:recblink 1s ease-in-out infinite; }
@keyframes recblink { 0%,100% { opacity:1; } 50% { opacity:.35; } }

/* негатив: мир наизнанку */
#invert {
  position:fixed; inset:0; z-index:70; background:#fff;
  mix-blend-mode:difference; pointer-events:none; opacity:0;
  transition:opacity .35s ease;
}
#invert.on { opacity:1; }

/* ── врата ───────────────────────────────────── */
#gate {
  position:fixed; inset:0; z-index:80; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
  transition:opacity 1.2s ease;
}
#gate.off { opacity:0; pointer-events:none; }
#gate .yin {
  width:96px; height:96px; border-radius:50%;
  background:conic-gradient(from 0deg, #f0ede6 0 50%, #0a0a0a 50% 100%);
  box-shadow:0 0 34px -8px rgba(240,237,230,.5);
  animation:yinspin 9s linear infinite;
}
@keyframes yinspin { to { transform:rotate(360deg); } }
#gate .cap { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim); }

#filePic, #fileAud { display:none; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="field"></canvas>
  <span class="brand">DAODEDO · профиль</span>
  <button id="recBtn" aria-label="Запись ленты">⦿</button>
  <div id="hint"></div>

  <div id="flow"><div class="track"></div><div id="flowKnob"></div></div>
  <button id="undoBtn" aria-label="Отменить штрих">↩</button>

  <div id="fader">
    <span class="end l">●</span>
    <div class="track"></div>
    <div id="knob"></div>
    <span class="end r">∿</span>
  </div>

  <div id="orbitShade"></div>
  <div id="invert"></div>

  <div id="gate">
    <div class="yin"></div>
    <span class="cap">DAO DE DO</span>
  </div>

  <audio id="bgout" playsinline></audio>
  <input type="file" id="filePic" accept="image/*" multiple>
  <input type="file" id="fileAud" accept="audio/*">
</div>

<script>
(function(){
'use strict';

/* ── шина (драфт эскиза) ── */
var Bus = (function(){
  var et = new EventTarget(), seq = 0;
  return {
    emit: function(type, data){
      var ev = { v:'sketch', ts:Date.now(), seq:++seq, type:type, data:data || {} };
      et.dispatchEvent(new CustomEvent('bus', { detail:ev }));
      return ev;
    },
    on: function(type, fn){
      et.addEventListener('bus', function(e){
        if (type === '*' || e.detail.type === type) fn(e.detail);
      });
    }
  };
})();

var deckSide = 'white';
var mix = 0;
var flowSpeed = 16, flowTarget = 16, rainHeld = false, twinOn = false;
var brushOn = false;
function lightColor(a){ return 'rgba(240,237,230,' + (a == null ? 1 : a) + ')'; }
function hotColor(a){ return 'rgba(255,90,77,' + (a == null ? 1 : a) + ')'; }
function hexTop(){ return innerHeight - 360; }

/* ═══════════════════════════════════════════════
   АУДИО
   ═══════════════════════════════════════════════ */
var Audio = (function(){
  var ctx = null, master = null, bgGain = null;
  var techGain = null, healGain = null, chipGain = null;
  var noiseBuf = null, recDest = null;

  function ensure(){
    if (!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9;
      /* звук уходит через медиа-элемент: iOS считает нас плеером
         и не глушит при заблокированном экране; фолбэк — прямой выход */
      var out = document.getElementById('bgout');
      var routed = false;
      try {
        var elemDest = ctx.createMediaStreamDestination();
        master.connect(elemDest);
        out.srcObject = elemDest.stream;
        var pp = out.play();
        routed = true;
        if (pp && pp.catch) pp.catch(function(){
          if (routed){ routed = false; master.connect(ctx.destination); }
        });
        if ('mediaSession' in navigator && window.MediaMetadata){
          navigator.mediaSession.metadata = new MediaMetadata({ title:'DAO DE DO', artist:'137lab' });
          navigator.mediaSession.setActionHandler('play', function(){ out.play(); ctx.resume(); });
          navigator.mediaSession.setActionHandler('pause', function(){ out.pause(); });
        }
      } catch(_){}
      if (!routed) master.connect(ctx.destination);
      /* постоянный неслышимый ток (90Гц, -54дБ): MediaStream-канал не остывает,
         и короткие техно-удары не проваливаются в щели буфера */
      var keep = ctx.createOscillator(); keep.frequency.value = 90;
      var kg = ctx.createGain(); kg.gain.value = 0.002;
      keep.connect(kg).connect(master); keep.start();
      bgGain = ctx.createGain(); bgGain.gain.value = 1;
      bgGain.connect(master);
      techGain = ctx.createGain(); techGain.gain.value = 1;
      healGain = ctx.createGain(); healGain.gain.value = 0;
      chipGain = ctx.createGain(); chipGain.gain.value = 1;
      techGain.connect(bgGain); healGain.connect(bgGain); chipGain.connect(bgGain);
      recDest = null;
      var len = ctx.sampleRate * 0.5;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state !== 'running') ctx.resume().catch(function(){});
    return ctx;
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && ctx){
      if (ctx.state !== 'running') ctx.resume().catch(function(){});
      var out2 = document.getElementById('bgout');
      if (out2 && out2.srcObject && out2.paused) out2.play().catch(function(){});
    }
  });

  function tone(o){
    var c = ensure(), t = (o.at || c.currentTime);
    var osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + (o.dur || 0.3));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, o.g), t + (o.a || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + (o.dur || 0.3));
    osc.connect(g).connect(o.dest || chipGain);
    osc.start(t); osc.stop(t + (o.dur || 0.3) + 0.05);
  }
  function noise(o){
    var c = ensure(), t = (o.at || c.currentTime);
    var s = c.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    var f = c.createBiquadFilter(); f.type = o.lp ? 'lowpass' : 'highpass';
    f.frequency.value = o.freq || 4000;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, o.g), t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (o.dur || 0.2));
    s.connect(f).connect(g).connect(o.dest || chipGain);
    s.start(t); s.stop(t + (o.dur || 0.2) + 0.05);
  }

  var Tech = (function(){
    var timer = null, step = 0, nextT = 0;
    var BPM = 112, STEP = 60 / BPM / 4;
    var BASS = [55, 0, 55, 0, 65.4, 0, 55, 0, 82.4, 0, 55, 0, 98, 0, 82.4, 0];
    function schedule(){
      var c = ensure();
      if (nextT < c.currentTime) nextT = c.currentTime + 0.02;  /* после паузы не догоняем прошлое */
      while (nextT < c.currentTime + 0.35){
        var s16 = step % 16;
        if (s16 % 4 === 0){
          tone({ f:120, f2:42, g:0.11, a:0.004, dur:0.14, type:'square', dest:techGain, at:nextT });
          Bus.emit('pulse', {});
        }
        if (s16 % 4 === 2) noise({ g:0.02, freq:8000, dur:0.025, dest:techGain, at:nextT });
        var b = BASS[s16];
        if (b) tone({ f:b, g:0.042, a:0.006, dur:STEP * 0.85, type:'square', dest:techGain, at:nextT });
        if (s16 === 14 && Math.random() < 0.35)
          tone({ f:[440,523,659,880][Math.floor(Math.random()*4)], g:0.016, a:0.004, dur:0.09, type:'square', dest:techGain, at:nextT });
        step++; nextT += STEP;
      }
    }
    return {
      start: function(){ var c = ensure(); step = 0; nextT = c.currentTime + 0.05; clearInterval(timer); timer = setInterval(schedule, 80); },
      nextEighth: function(){ var c = ensure(); if (!timer) return c.currentTime; var e = STEP * 2; return nextT - STEP + (e - ((nextT - STEP) % e || e)); }
    };
  })();

  var Heal = (function(){
    var started = false;
    function drone(f, g, lfoT, ph){
      var c = ensure();
      var o = c.createOscillator(); o.frequency.value = f;
      var gg = c.createGain(); gg.gain.value = g;
      var lfo = c.createOscillator(); lfo.frequency.value = 1 / lfoT;
      var lg = c.createGain(); lg.gain.value = g * 0.55;
      lfo.connect(lg).connect(gg.gain);
      o.connect(gg).connect(healGain);
      o.start(); lfo.start(c.currentTime + ph);
    }
    return {
      start: function(){
        if (started) return; started = true;
        drone(110, 0.036, 11, 0); drone(164.8, 0.023, 9, 2); drone(220, 0.017, 13, 5);
        setInterval(function(){
          if (Math.random() < 0.6) tone({ f:880, g:0.013, a:0.4, dur:4.5, dest:healGain });
        }, 7000);
        setInterval(function(){ Bus.emit('breath', {}); }, 4000);
      }
    };
  })();

  function start(){ ensure(); Tech.start(); Heal.start(); setMix(mix); }

  function setMix(x){
    var c = ensure(), t = c.currentTime;
    mix = Math.min(1, Math.max(0, x));
    /* подложка — фон, не солист: полюса приглушены */
    techGain.gain.setTargetAtTime(Math.cos(mix * Math.PI / 2) * 0.72, t, 0.08);
    healGain.gain.setTargetAtTime(Math.sin(mix * Math.PI / 2) * 0.72, t, 0.08);
  }

  function quantized(fn){
    var c = ensure();
    if (mix < 0.5){
      var at = Tech.nextEighth();
      setTimeout(fn, Math.max(0, (at - c.currentTime) * 1000));
    } else fn();
  }

  function silenceDown(){
    var c = ensure(), t = c.currentTime;
    bgGain.gain.cancelScheduledValues(t);
    bgGain.gain.setTargetAtTime(0.0001, t, 0.03);
  }
  function silenceUp(){
    var c = ensure(), t = c.currentTime;
    bgGain.gain.cancelScheduledValues(t);
    bgGain.gain.setTargetAtTime(1, t, 0.25);
  }

  var Mic = (function(){
    var stream = null;
    function ensureStream(){
      if (stream) return Promise.resolve(stream);
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
        return Promise.reject(new Error('no-mic'));
      /* без echoCancellation/AGC: iOS не включает «голосовой» аудио-режим
         и музыка не приседает; в динамик голос всё равно не идёт */
      return navigator.mediaDevices.getUserMedia({ audio:{
        echoCancellation:false, noiseSuppression:false, autoGainControl:false
      } }).then(function(s){ stream = s; return s; });
    }
    return { ensureStream: ensureStream };
  })();

  /* живой голос */
  var Voice = (function(){
    var srcNode = null, analyser = null, on = false, srcRef = null;
    function toggle(){
      var c = ensure();
      if (on){
        on = false;
        Bus.emit('voice.live', { on:false });
        return Promise.resolve(false);
      }
      return Mic.ensureStream().then(function(s){
        if (!srcNode){
          srcNode = c.createMediaStreamSource(s);
          analyser = c.createAnalyser(); analyser.fftSize = 256;
          srcNode.connect(analyser);   /* только река: в динамики голос не идёт */
          if (recDest) srcNode.connect(recDest);   /* но в запись ленты — идёт */
        }
        srcRef = srcNode;
        on = true;
        Bus.emit('voice.live', { on:true });
        return true;
      });
    }
    function level(){
      if (!analyser || !on) return 0;
      var arr = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(arr);
      var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i];
      return s / arr.length / 255;
    }
    return { toggle:toggle, level:level, isOn: function(){ return on; },
      src: function(){ return srcRef; } };
  })();

  /* сэмплы: тап пишет 4с и крутит; библиотека до 6 */
  var Sample = (function(){
    var rec = null, chunks = [], current = null, srcNode = null, analyser = null;
    var lib = [];                          /* [{buffer, dur}] */
    var recTimer = null, recording = false;
    function startRec(){
      if (recording) return Promise.resolve(false);
      return Mic.ensureStream().then(function(s){
        chunks = []; recording = true;
        rec = new MediaRecorder(s);
        rec.ondataavailable = function(e){ if (e.data.size) chunks.push(e.data); };
        rec.start();
        Bus.emit('sample.state', { state:'rec' });
        recTimer = setTimeout(stopRec, 4000);   /* авто-стоп: 4 секунды */
        return true;
      });
    }
    function stopRec(){
      clearTimeout(recTimer);
      return new Promise(function(res){
        if (!rec || rec.state === 'inactive'){ recording = false; res(false); return; }
        rec.onstop = function(){
          recording = false;
          var blob = new Blob(chunks);
          blob.arrayBuffer().then(function(ab){
            return ensure().decodeAudioData(ab);
          }).then(function(buf){
            current = buf;
            lib.push({ buffer: buf, dur: buf.duration });
            if (lib.length > 6) lib.shift();
            play(true);
            Bus.emit('sample.state', { state:'loop' });
            res(true);
          }).catch(function(){ Bus.emit('sample.state', { state:'empty' }); res(false); });
        };

    }
    function play(onFlag){
      var c = ensure();
      if (srcNode){ try { srcNode.stop(); } catch(_){} srcNode = null; }
      if (!onFlag || !current){ Bus.emit('sample.loop', { on:false }); return; }
      srcNode = c.createBufferSource();
      srcNode.buffer = current; srcNode.loop = true;
      var g = c.createGain(); g.gain.value = 0.6;
      analyser = c.createAnalyser(); analyser.fftSize = 256;

      return s / arr.length / 255;

    return {
      startRec:startRec, stopRec:stopRec,
      toggleLoop: function(){ play(!srcNode); },
      pick: function(i){ if (lib[i]){ current = lib[i].buffer; play(true); } },

  var Psalm = (function(){
    var buffer = null, reversed = null, playing = null, whisper = null;
    function makeReversed(buf){

      playing = c.createBufferSource();
      playing.buffer = buffer;

  /* SYNC: дыхание внимания — тихий тон с медленными биениями */
  var Sync = (function(){

      down: function(){
        var c = ensure(), t = c.currentTime;
        this.up();

        o2 = c.createOscillator(); o2.frequency.value = 221.4;   /* биения ~1.4 Гц */

        o1.start(); o2.start();
      },
      up: function(){
        if (!g) return;
        var c = ensure(), t = c.currentTime;
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(Math.max(0.001, g.gain.value), t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        o1.stop(t + 1.8); o2.stop(t + 1.8);

      }
    };
  })();

  var bellOsc = null, bellG = null;
  function bellDown(dark){
    quantized(function(){
      var c = ensure(), t = c.currentTime;
      var f = dark ? 220 : 880;
      bellOsc = c.createOscillator(); bellOsc.frequency.value = f;
      var o2 = c.createOscillator(); o2.frequency.value = f * 1.5;
      bellG = c.createGain();
      bellG.gain.setValueAtTime(0.0001, t);
      bellG.gain.exponentialRampToValueAtTime(dark ? 0.09 : 0.07, t + 0.04);
      var g2 = c.createGain(); g2.gain.value = 0.35;
      o2.connect(g2).connect(bellG);

  }

    bellG.gain.exponentialRampToValueAtTime(0.0001, t + rel);

  function symbolSound(){

  }
  function picSound(){ tone({ f:520, f2:390, g:0.05, a:0.005, dur:0.25, type:'triangle' }); }
  function shadowSound(){ tone({ f:164, g:0.03, a:0.02, dur:0.5 }); noise({ g:0.015, freq:500, lp:true, dur:0.4 }); }
  function likeSound(){ tone({ f:1174, g:0.04, a:0.005, dur:0.3 }); tone({ f:1568, g:0.025, a:0.005, dur:0.35 }); }
  function rouletteSound(){
    var c = ensure(), t = c.currentTime;
    for (var i = 0; i < 6; i++)
      tone({ f:900 + Math.random() * 500, g:0.03, a:0.003, dur:0.05, type:'square', at:t + i * 0.08 });
  }
  function invertSound(){
    gliss(300, 1400, 0.05, 0.35, 'triangle');
    setTimeout(function(){ gliss(1400, 300, 0.05, 0.5, 'triangle'); }, 1600);
  }

  /* дождь: вода из шума + редкие капли; поднимается, пока держишь */
  var Rain = (function(){
    var src = null, g = null, filt = null, dripTimer = null;
    return {
      down: function(){
        var c = ensure(), t = c.currentTime;

        g = c.createGain();

          if (Math.random() < 0.7)

      },
      up: function(instant){
        clearInterval(dripTimer); dripTimer = null;

        var c = ensure(), t = c.currentTime;

        g.gain.exponentialRampToValueAtTime(0.0001, t + (instant ? 0.05 : 1.4));

  })();

  function recStream(){
    var c = ensure();
    if (!recDest){
      recDest = c.createMediaStreamDestination();
      master.connect(recDest);

  }

  return {
    ensure:ensure, start:start, setMix:setMix, quantized:quantized, recStream:recStream,
    silenceDown:silenceDown, silenceUp:silenceUp,
    Voice:Voice, Sample:Sample, Psalm:Psalm, Sync:Sync, Rain:Rain,
    bellDown:bellDown, bellUp:bellUp,
    symbolSound:symbolSound, picSound:picSound, likeSound:likeSound, shadowSound:shadowSound,
    rouletteSound:rouletteSound, invertSound:invertSound

})();

/* ═══════════════════════════════════════════════
   ПОЛЕ-ЛЕНТА
   ═══════════════════════════════════════════════ */
var Field = (function(){
  var cnv = document.getElementById('field'), ctx2 = cnv.getContext('2d');
  var dpr = Math.min(devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var kickFlash = 0, breathT = 0;
  var voiceTrail = [];       /* вечная река: {y, amp} — не обрезается у сот */
  var likes = [];            /* метки на реке: {x, y} */
  var strokes = [];
  var undone = [];
  var symbols = [];
  var pics = [];
  var texts = [];
  var orbA = 0;
  var lastTrailT = 0;
  var sync = { held:false, t0:0, x:0, y:0, fade:0 };
  var rain = { on:false, t0:0, fade:0, drops:[], ripples:[] };
  var viewOff = 0, viewHeld = false;   /* скролл в прошлое ленты */

  function size(){
    W = innerWidth; H = innerHeight;
    cnv.width = W * dpr; cnv.height = H * dpr;
  }
  size(); addEventListener('resize', size);

  Bus.on('pulse', function(){ kickFlash = 1; });
  Bus.on('breath', function(){ breathT = performance.now(); });

  var PEN_Y = 120, RIVER_X = 40;   /* река голоса — у левого края, тонкая */

  function flowAll(dy){
    voiceTrail.forEach(function(p){ p.y += dy; });
    likes.forEach(function(p){ p.y += dy; });
    strokes.forEach(function(s){ s.pts.forEach(function(p){ p.y += dy; }); });
    symbols.forEach(function(s){ s.y += dy; });
    pics.forEach(function(p){ p.y += dy; });
    texts.forEach(function(t2){ t2.y += dy; });
    var deep = H + 2600;   /* история хранится глубоко — в неё можно вернуться скроллом */
    voiceTrail = voiceTrail.filter(function(p){ return p.y < deep; });
    likes = likes.filter(function(p){ return p.y < deep; });
    strokes = strokes.filter(function(s){ return s.pts.some(function(p){ return p.y < deep; }); });
    symbols = symbols.filter(function(s){ return s.y < deep; });
    pics = pics.filter(function(p){ return p.y < deep; });
    texts = texts.filter(function(t2){ return t2.y < hexTop() + 60; });
  }

  var SYMS = ['spiral','eye','infinity','star','wave','triskel'];
  function drawSymbolPath(kind, pr, R){
    var i, a, r;
    switch (kind){
      case 'spiral':
        for (i = 0; i <= 60 * pr; i++){ a = i / 60 * 5 * Math.PI; r = 2 + i / 60 * R;
          i ? ctx2.lineTo(r * Math.cos(a), r * Math.sin(a)) : ctx2.moveTo(2, 0); }
        break;
      case 'eye':
        ctx2.ellipse(0, 0, R, R * 0.55, 0, 0, 6.29 * pr);
        ctx2.moveTo(R * 0.4, 0);
        ctx2.arc(0, 0, R * 0.4, 0, 6.29 * pr);
        break;
      case 'infinity':
        for (i = 0; i <= 60 * pr; i++){ a = i / 60 * 2 * Math.PI;
          i ? ctx2.lineTo(R * Math.cos(a), R * 0.55 * Math.sin(2 * a) / 2) : ctx2.moveTo(R, 0); }
        break;
      case 'star':
        for (i = 0; i <= 7 * pr; i++){ a = i / 7 * 2 * Math.PI * 3 - Math.PI / 2;
          i ? ctx2.lineTo(R * Math.cos(a), R * Math.sin(a)) : ctx2.moveTo(0, -R); }
        break;
      case 'wave':
        for (i = 0; i <= 50 * pr; i++){ var xw = -R + i / 50 * 2 * R;
          i ? ctx2.lineTo(xw, Math.sin(i / 50 * 4 * Math.PI) * R * 0.3) : ctx2.moveTo(-R, 0); }
        break;
      default:
        for (var t3 = 0; t3 < 3; t3++){
          var base = t3 / 3 * 2 * Math.PI;
          ctx2.moveTo(0, 0);
          for (i = 0; i <= 30 * pr; i++){ a = base + i / 30 * 2.4; r = i / 30 * R;
            ctx2.lineTo(r * Math.cos(a), r * Math.sin(a)); }
        }
    }
  }
  function drawSymbol(s, now){
    var age = now - s.born;
    var pr = Math.min(1, age / 700);
    var al = Math.min(0.9, pr) * (s.y > hexTop() - 40 ? 0.4 : 1);
    ctx2.save();
    ctx2.translate(s.x, s.y);
    ctx2.rotate(Math.sin(s.seed) * 0.4);
    if (s.shadow){
      ctx2.strokeStyle = lightColor(al * 0.28); ctx2.shadowBlur = 0;
    } else {
      ctx2.strokeStyle = lightColor(al);
      ctx2.shadowColor = lightColor(0.9); ctx2.shadowBlur = 14 * pr;
    }
    ctx2.lineWidth = 1.6; ctx2.lineCap = 'round';
    ctx2.beginPath();
    if (s.kind === 'text'){
      ctx2.font = '700 26px "Space Mono", monospace';
      ctx2.textAlign = 'center';
      var str = s.text.slice(0, Math.ceil(s.text.length * pr));
      ctx2.strokeText(str, 0, 0);
    } else {
      drawSymbolPath(s.kind, pr, 34 * (0.6 + 0.4 * pr));
    }
    ctx2.stroke();
    ctx2.restore();
    ctx2.shadowBlur = 0;
  }

  function drawBg(now){
    var gAl = (0.028 + kickFlash * 0.05) * (1 - mix);
    if (gAl > 0.004){
      ctx2.strokeStyle = 'rgba(240,237,230,' + gAl.toFixed(3) + ')';
      ctx2.lineWidth = 1;
      var g = 44, off = (now * 0.012) % g;
      for (var x = -g + off; x < W; x += g){ ctx2.beginPath(); ctx2.moveTo(x, 0); ctx2.lineTo(x, H); ctx2.stroke(); }
      for (var y = -g + off; y < H; y += g){ ctx2.beginPath(); ctx2.moveTo(0, y); ctx2.lineTo(W, y); ctx2.stroke(); }

      var br = 0.5 - 0.5 * Math.cos(Math.min(1, ph) * 2 * Math.PI);

      var cy = H * 0.34 + 40 * Math.sin(now * 0.00009);
      var g1 = ctx2.createRadialGradient(cx, cy, 0, cx, cy, W * 0.7);
      g1.addColorStop(0, 'rgba(240,237,230,' + ((0.05 + br * 0.05) * mix).toFixed(3) + ')');
      g1.addColorStop(1, 'rgba(0,0,0,0)');
      ctx2.fillStyle = g1; ctx2.fillRect(0, 0, W, H);

  }

  function drawVoiceRiver(){
    if (voiceTrail.length > 1){
      ctx2.beginPath();
      for (var i = 0; i < voiceTrail.length; i++){
        var p = voiceTrail[i];
        var xx = RIVER_X - 2 - p.amp * 30;
        i ? ctx2.lineTo(xx, p.y) : ctx2.moveTo(xx, p.y);
      }
      for (var j = voiceTrail.length - 1; j >= 0; j--){

        ctx2.lineTo(RIVER_X + 2 + q.amp * 30, q.y);

      ctx2.fillStyle = lightColor(0.14);
      ctx2.fill();
      ctx2.strokeStyle = lightColor(0.45); ctx2.lineWidth = 1;
      ctx2.stroke();
    }

    likes.forEach(function(m){
      var age = performance.now() - m.born;
      var pop = Math.min(1, age / 300);
      ctx2.save();
      ctx2.translate(m.x, m.y);
      ctx2.rotate(Math.PI / 4);
      var s = 5 * (0.5 + 0.5 * pop);
      ctx2.strokeStyle = hotColor(0.85); ctx2.lineWidth = 1.5;
      ctx2.shadowColor = hotColor(1); ctx2.shadowBlur = 8;
      ctx2.strokeRect(-s / 2, -s / 2, s, s);
      ctx2.restore();
      ctx2.shadowBlur = 0;
    });
  }

  function drawRain(now, dt){
    if (rain.on) rain.fade = Math.min(1, rain.fade + dt * 0.5);
    else rain.fade = Math.max(0, rain.fade - dt * 0.7);
    if (rain.fade <= 0.01 && !rain.drops.length && !rain.ripples.length) return;
    /* поле чуть притемняется — идёт дождь */
    ctx2.fillStyle = 'rgba(3,3,3,' + (0.22 * rain.fade).toFixed(3) + ')';
    ctx2.fillRect(0, 0, W, H);
    /* новые слёзы: интенсивность поднимается с проживанием */
    if (rain.on){
      var heldS = (now - rain.t0) / 1000;
      var n = Math.min(4, 1 + heldS * 0.6) * rain.fade;
      for (var k = 0; k < n; k++){
        if (Math.random() < 0.8 && rain.drops.length < 90)
          rain.drops.push({
            x: Math.random() * W, y: -12,
            v: 320 + Math.random() * 220,
            len: 10 + Math.random() * 12,
            floor: hexTop() - 20 - Math.random() * 120
          });
      }
    }
    ctx2.lineWidth = 1; ctx2.lineCap = 'round';
    for (var i = rain.drops.length - 1; i >= 0; i--){
      var d = rain.drops[i];
      d.y += d.v * dt;
      if (d.y > d.floor){
        rain.ripples.push({ x: d.x, y: d.floor, t0: now });
        rain.drops.splice(i, 1);

      ctx2.strokeStyle = lightColor(0.3 * rain.fade + 0.1);

      ctx2.stroke();
    }
    for (var j = rain.ripples.length - 1; j >= 0; j--){
      var rp = rain.ripples[j];

      ctx2.strokeStyle = lightColor(0.3 * (1 - age));

      ctx2.ellipse(rp.x, rp.y, 3 + age * 20, (3 + age * 20) * 0.32, 0, 0, 6.29);

    }
  }

  function drawSync(now){

    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,' + (0.45 * sync.fade).toFixed(3) + ')');
    ctx2.fillStyle = vg; ctx2.fillRect(0, 0, W, H);

      ctx2.stroke();
    }

    ctx2.arc(sync.x, sync.y, r, 0, 6.29);

    ctx2.restore();
    ctx2.shadowBlur = 0;
  }

  var lastDrawT = null;
  function draw(now){
    if (lastDrawT === null) lastDrawT = now;
    var dtDraw = Math.min(0.05, (now - lastDrawT) / 1000);
    lastDrawT = now;
    ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx2.clearRect(0, 0, W, H);

    ctx2.save();
    ctx2.translate(0, -viewOff);

    texts.forEach(function(t2){
      ctx2.fillStyle = lightColor(0.4);
      ctx2.font = '10px "Space Mono", monospace';
      ctx2.textAlign = 'center';
      ctx2.fillText(t2.str, t2.x, t2.y);

      if (s.pts.length < 2) return;

      } else {
        ctx2.strokeStyle = lightColor(0.85);
        ctx2.shadowColor = lightColor(1); ctx2.shadowBlur = 12;
      }

      s.pts.forEach(function(p, i){ i ? ctx2.lineTo(p.x, p.y) : ctx2.moveTo(p.x, p.y); });
      ctx2.stroke();
      ctx2.shadowBlur = 0;
    });

    symbols.forEach(function(s){ drawSymbol(s, now); });

    pics.forEach(function(p){
      ctx2.save();
      ctx2.translate(p.x, p.y); ctx2.rotate(p.rot);
      if (p.shadow) ctx2.globalAlpha = 0.28;
      else { ctx2.shadowColor = 'rgba(0,0,0,.7)'; ctx2.shadowBlur = 14; }
      ctx2.drawImage(p.img, -p.w/2, -p.w/2, p.w, p.w);
      ctx2.restore();
    });

    ctx2.restore();   /* конец лентных слоёв — настоящее рисуется поверх */

    /* река пишется точкой настоящего — компактно, каждые 60мс */
    var vl = Audio.Voice.level();
    if (Audio.Voice.isOn() && now - lastTrailT > 60){
      lastTrailT = now;
      voiceTrail.push({ y: PEN_Y, amp: vl });
      if (voiceTrail.length > 18000) voiceTrail.shift();
    }
    if (Audio.Voice.isOn()){
      ctx2.fillStyle = hotColor(0.9);
      ctx2.shadowColor = hotColor(1); ctx2.shadowBlur = 12;
      ctx2.beginPath(); ctx2.arc(RIVER_X, PEN_Y, 3 + vl * 9, 0, 6.29); ctx2.fill();
      ctx2.shadowBlur = 0;
    }

    var sl = Audio.Sample.level();
    if (Audio.Sample.looping()){
      orbA += 0.004 + sl * 0.02;
      var ox = W / 2 + Math.sin(orbA) * W * 0.3;
      var oy = H * 0.26 + Math.sin(orbA * 1.7) * H * 0.12;
      ctx2.shadowColor = lightColor(1); ctx2.shadowBlur = 20;
      ctx2.fillStyle = lightColor(0.5 + sl * 0.5);
      ctx2.beginPath(); ctx2.arc(ox, oy, 10 + sl * 30, 0, 6.29); ctx2.fill();
      ctx2.shadowBlur = 0;
    }

    drawRain(now, dtDraw);
    drawSync(now);

    flowSpeed += (flowTarget - flowSpeed) * 0.06;
    flowAll(flowSpeed * dtDraw);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  return {
    addSymbol: function(kind, text, shadow){
      var obj = {
        kind: kind || SYMS[Math.floor(Math.random() * SYMS.length)],
        text: text || '',
        x: 60 + Math.random() * (W - 120),
        y: 110 + Math.random() * (H * 0.3),
        born: performance.now(), seed: Math.random() * 10,
        shadow: !!shadow
      };
      symbols.push(obj);
      if (twinOn && !shadow) setTimeout(function(){
        symbols.push({ kind:obj.kind, text:obj.text, x:obj.x + 14, y:obj.y + 14,
          born: performance.now(), seed: obj.seed, shadow:true });
        Audio.shadowSound();
      }, 2000);
    },
    randSym: function(){ return SYMS[Math.floor(Math.random() * SYMS.length)]; },
    addPic: function(img, shadow){
      var obj = {
        img: img,
        x: 60 + Math.random() * (W - 120),
        y: 120 + Math.random() * (H * 0.28),
        rot: (Math.random() * 2 - 1) * 0.26,
        w: 96 + Math.random() * 60,
        shadow: !!shadow
      };
      pics.push(obj);
      if (pics.length > 12) pics.shift();
      if (twinOn && !shadow) setTimeout(function(){
        pics.push({ img:obj.img, x:obj.x + 16, y:obj.y + 16, rot:obj.rot + 0.12,
          w:obj.w, shadow:true });
        if (pics.length > 12) pics.shift();
        Audio.shadowSound();
      }, 2000);
    },
    addText: function(str){ texts.push({ str: str, x: W / 2, y: 100 }); },
    addLike: function(x, y){ likes.push({ x: x, y: y, born: performance.now() }); },
    strokeStart: function(x, y){
      undone = [];
      strokes.push({ pts: [{ x:x, y:y }], born: performance.now() });
      if (strokes.length > 30) strokes.shift();
      return strokes[strokes.length - 1];
    },
    addShadowStroke: function(pts){
      strokes.push({ pts: pts, born: performance.now(), shadow: true });
      if (strokes.length > 30) strokes.shift();
      Audio.shadowSound();
    },
    setView: function(off){ viewOff = Math.max(0, Math.min(2400, off)); },
    view: function(){ return viewOff; },
    viewRelease: function(){ viewHeld = false; },
    viewHold: function(){ viewHeld = true; },
    undoStroke: function(){ var s = strokes.pop(); if (s) undone.push(s); return strokes.length; },
    hasStrokes: function(){ return strokes.length > 0; },
    riverHit: function(x, y){ return x < 90 && y > 60 && y < hexTop(); },
    syncDown: function(){ sync.held = true; sync.t0 = performance.now(); },
    syncUp: function(){ sync.held = false; },
    rainSet: function(on){ rain.on = on; if (on) rain.t0 = performance.now(); }
  };
})();

/* ═══════════════════════════════════════════════
   ГЕКСАГОНЫ · МИНИ-СОТЫ
   ═══════════════════════════════════════════════ */
var hintEl = document.getElementById('hint'), hintTimer = null;
function hint(text, ttl){
  clearTimeout(hintTimer);
  hintEl.style.top = (innerHeight - 396) + 'px';
  if (!text){ hintEl.classList.remove('on'); return; }
  hintEl.textContent = text; hintEl.classList.add('on');
  hintTimer = setTimeout(function(){ hintEl.classList.remove('on'); }, ttl || 2200);
}

var DECKS = {
  white: { center:'sync',   petals:['sample', 'brush', 'symbol', 'picture', 'avatar', 'voice'] },
  black: { center:'random', petals:['psalm', 'silence', 'bell', 'invert', 'rain', 'twin'] }
};
var CHIP_LBL = {
  sync:'sync', voice:'голос', sample:'сэмпл', brush:'кисть', symbol:'символ',
  picture:'картинка', avatar:'аватар',
  random:'рандом', psalm:'псалом', silence:'тишина', bell:'колокол',
  invert:'негатив', rain:'дождь', twin:'тень'
};
var STUB_CHIPS = { avatar:1 };          /* зарезервировано: камера-мимика в следующем круге */
var HEX_PATH = 'M48 8 L86 30 V76 L48 98 L10 76 V30 Z';
var MINI_PATH = 'M26 5 L46 16 V40 L26 51 L6 40 V16 Z';

var slotEls = [], slotPos = [];
(function buildHexes(){
  var stage = document.getElementById('stage');
  for (var i = 0; i < 7; i++){
    var b = document.createElement('button');
    b.className = 'hexbtn';
    var glow = document.createElement('span'); glow.className = 'glow';
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 96 106');
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', HEX_PATH);
    svg.appendChild(path);
    var lbl = document.createElement('span'); lbl.className = 'lbl';
    b.appendChild(glow); b.appendChild(svg); b.appendChild(lbl);
    stage.appendChild(b);
    slotEls.push(b);
  }
  placeHexes();
})();

function placeHexes(){
  var cx = innerWidth / 2, cy = innerHeight - 224, R = 92;
  slotEls.forEach(function(b, i){
    var x = cx, y = cy;
    if (i > 0){
      var a = ((i - 1) * 60) * Math.PI / 180;
      x = cx + R * Math.cos(a); y = cy + R * Math.sin(a);
    }
    b.style.left = x + 'px'; b.style.top = y + 'px';
    slotPos[i] = { x:x, y:y };
  });
}
addEventListener('resize', placeHexes);

function chipAt(side, i){ return i === 0 ? DECKS[side].center : DECKS[side].petals[i - 1]; }

function decorate(b, chip){
  b.classList.remove('rec', 'live', 'armed');
  if (chip === 'voice' && Audio.Voice.isOn()) b.classList.add('live');
  if (chip === 'sample'){
    if (Audio.Sample.recording()) b.classList.add('rec');
    else if (Audio.Sample.looping()) b.classList.add('live');
    else if (Audio.Sample.has()) b.classList.add('armed');
  }
  if (chip === 'brush' && brushOn) b.classList.add('live');
  if (chip === 'psalm'){
    if (Audio.Psalm.playing() || Audio.Psalm.whispering()) b.classList.add('live');
    else if (Audio.Psalm.has()) b.classList.add('armed');
  }
  if (chip === 'rain' && rainHeld) b.classList.add('live');
  if (chip === 'twin' && twinOn) b.classList.add('live');
}

function renderDeck(){
  slotEls.forEach(function(b, i){
    var chip = chipAt(deckSide, i);
    var lbl = b.querySelector('.lbl');
    b.dataset.chip = chip || '';
    b.classList.toggle('stub', !chip);
    b.classList.toggle('dark', deckSide === 'black');
    lbl.textContent = chip ? CHIP_LBL[chip] : '·';
    decorate(b, chip);
  });
  document.getElementById('undoBtn').classList.toggle('on',
    brushOn && deckSide === 'white' && Field.hasStrokes());
}
renderDeck();
['voice.live','sample.state','sample.loop','psalm.state','psalm.play'].forEach(function(t){
  Bus.on(t, renderDeck);
});

var flipping = false;
function flipDeck(originX, originY){
  if (flipping) return;
  flipping = true;
  cancelHolds(); Orbit.close();
  var nextSide = deckSide === 'white' ? 'black' : 'white';
  Bus.emit('deck.flip', { to:nextSide });
  var maxDelay = 0;
  slotEls.forEach(function(b, i){
    var d = Math.hypot(slotPos[i].x - originX, slotPos[i].y - originY) * 0.9;
    maxDelay = Math.max(maxDelay, d);
    setTimeout(function(){ b.classList.add('mid'); }, d);
    setTimeout(function(){
      var chip = chipAt(nextSide, i);
      b.dataset.chip = chip || '';
      b.classList.toggle('dark', nextSide === 'black');
      b.classList.toggle('stub', !chip);
      b.querySelector('.lbl').textContent = chip ? CHIP_LBL[chip] : '·';
      decorate(b, chip);
      b.classList.remove('mid');
    }, d + 200);
  });
  setTimeout(function(){ deckSide = nextSide; flipping = false; renderDeck(); }, maxDelay + 220);
}

/* ── мини-соты: библиотека вокруг кнопки ── */
var Orbit = (function(){
  var shade = document.getElementById('orbitShade');
  var els = [];
  function close(){
    els.forEach(function(e){ e.remove(); });
    els = [];
    shade.classList.remove('on');
  }
  function open(hostIdx, items){
    close();
    if (!items.length) return;
    shade.classList.add('on');
    var host = slotPos[hostIdx];
    items.slice(0, 6).forEach(function(it, i){
      var a = (-90 + i * 60) * Math.PI / 180;
      var b = document.createElement('button');
      b.className = 'minihex' + (it.sel ? ' selq' : '');
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 52 58');
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', MINI_PATH);
      svg.appendChild(path);
      b.appendChild(svg);
      if (it.img){ b.appendChild(it.img); }
      else {
        var l = document.createElement('span'); l.className = 'lbl';
        l.textContent = it.glyph; b.appendChild(l);
      }
      b.style.left = (host.x + 78 * Math.cos(a)) + 'px';
      b.style.top  = (host.y + 78 * Math.sin(a)) + 'px';
      b.addEventListener('pointerup', function(e){
        e.stopPropagation();
        close();
        it.pick();
      });
      document.getElementById('stage').appendChild(b);
      els.push(b);
      setTimeout(function(){ b.classList.add('on'); }, i * 35);
    });
  }
  shade.addEventListener('pointerdown', close);
  return { open:open, close:close };
})();

var symbolMode = { kind:null, text:null };   /* null = рандом */
function openSymbolOrbit(hostIdx){
  var items = [{ glyph:'?', sel:!symbolMode.kind && !symbolMode.text,
    pick: function(){ symbolMode = { kind:null, text:null }; hint('случайный знак'); } }];
  ['spiral','eye','star','wave'].forEach(function(k){
    var g = { spiral:'֎', eye:'◉', star:'✶', wave:'∿' }[k];
    items.push({ glyph:g, sel:symbolMode.kind === k,
      pick: function(){ symbolMode = { kind:k, text:null }; } });
  });
  items.push({ glyph:'абв', sel:!!symbolMode.text,
    pick: function(){
      var w = prompt('слово-знак:') || '';
      w = w.trim().slice(0, 12);
      if (w) symbolMode = { kind:'text', text:w };
    } });
  Orbit.open(hostIdx, items);
}
function openSampleOrbit(hostIdx){
  var lib = Audio.Sample.lib();
  var items = lib.slice(-5).map(function(s, i){
    var idx = lib.length - Math.min(5, lib.length) + i;
    return { glyph: String(Math.round(s.dur * 10) / 10) + 'с', sel:false,
      pick: function(){ Audio.Sample.pick(idx); renderDeck(); } };
  });
  items.push({ glyph:'+', sel:false,
    pick: function(){ Audio.Sample.startRec().then(renderDeck).catch(function(){ hint('нет микрофона'); }); } });
  Orbit.open(hostIdx, items);
}
var picDeck = [], picActive = 0;
function openPicOrbit(hostIdx){
  var items = picDeck.slice(0, 5).map(function(c, i){
    var im = c.cloneNode();
    im.getContext('2d').drawImage(c, 0, 0);
    return { img: im, sel: i === picActive,
      pick: function(){ picActive = i; Audio.picSound(); Field.addPic(picDeck[picActive]); } };
  });
  items.push({ glyph:'+', sel:false, pick: function(){ filePic.click(); } });
  Orbit.open(hostIdx, items);
}

/* ── жесты ── */
var gesture = { id:null, x0:0, y0:0, swiped:false };
var activeStroke = null, strokeId = null;
var stageEl = document.getElementById('stage');

var fieldDrag = { id:null, y0:0, base:0, moved:false, x0:0 };
stageEl.addEventListener('pointerdown', function(e){
  if (e.target.tagName === 'CANVAS'){
    if (brushOn && e.clientY < hexTop() - 20 && e.clientX < innerWidth - 34){
      activeStroke = Field.strokeStart(e.clientX, e.clientY);
      strokeId = e.pointerId;
      renderDeck();
      return;
    }
    /* свободное поле: вертикальный драг листает прошлое, короткий тап по реке — метка */
    if (e.clientY < hexTop() - 10 && fieldDrag.id === null){
      fieldDrag = { id: e.pointerId, y0: e.clientY, x0: e.clientX, base: Field.view(), moved: false };
      Field.viewHold();
      return;
    }
  }
  if (gesture.id !== null) return;
  if (e.clientY < hexTop() || e.clientY > innerHeight - 96) return;
  gesture.id = e.pointerId; gesture.x0 = e.clientX; gesture.y0 = e.clientY; gesture.swiped = false;
});
stageEl.addEventListener('pointermove', function(e){
  if (activeStroke && e.pointerId === strokeId){
    var pts = activeStroke.pts;
    var lp = pts[pts.length - 1];
    if (Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 3){
      pts.push({ x:e.clientX, y:e.clientY });
      if (pts.length > 400) pts.shift();
    }
    return;
  }
  if (e.pointerId === fieldDrag.id){
    var dy = fieldDrag.y0 - e.clientY;
    if (Math.abs(dy) > 14) fieldDrag.moved = true;
    if (fieldDrag.moved) Field.setView(fieldDrag.base + dy);
    return;
  }
  if (e.pointerId !== gesture.id || gesture.swiped) return;
  if (Math.abs(e.clientX - gesture.x0) > 46){
    gesture.swiped = true;
    flipDeck(gesture.x0, gesture.y0);
  }
});
['pointerup', 'pointercancel'].forEach(function(n){
  stageEl.addEventListener(n, function(e){
    if (e.pointerId === strokeId){
      /* тень-двойник повторяет штрих через два счёта */
      if (twinOn && activeStroke && activeStroke.pts.length > 1){
        var copy = activeStroke.pts.map(function(p){ return { x: p.x + 12, y: p.y + 12 }; });
        setTimeout(function(){ Field.addShadowStroke(copy); }, 2000);
      }
      activeStroke = null; strokeId = null;
    }
    if (e.pointerId === fieldDrag.id){
      if (!fieldDrag.moved && Field.riverHit(fieldDrag.x0, fieldDrag.y0) && Field.view() < 10){
        Field.addLike(Math.min(fieldDrag.x0, 80), fieldDrag.y0);
        Audio.likeSound();
        Bus.emit('river.like', { y: fieldDrag.y0 });
      }
      fieldDrag.id = null;
      Field.viewRelease();
    }
    if (e.pointerId === gesture.id) setTimeout(function(){ gesture.id = null; gesture.swiped = false; }, 0);
  });
});

document.getElementById('undoBtn').addEventListener('pointerup', function(e){
  e.stopPropagation();
  Field.undoStroke();
  renderDeck();
});
(function placeUndo(){
  var u = document.getElementById('undoBtn');
  function place(){
    /* кисть — лепесток 60°, слот 2: отмена сразу справа-снизу от неё */
    var p = slotPos[2] || { x: innerWidth / 2, y: innerHeight - 224 };
    u.style.left = (p.x + 76) + 'px';
    u.style.top  = (p.y + 46) + 'px';
  }
  place(); addEventListener('resize', place);
})();

/* ── фишки ── */
var holdTimers = {}, bellHeld = false, silenceHeld = false, syncHeld = false, psalmWhisper = false;
function cancelHolds(){
  Object.keys(holdTimers).forEach(function(k){ clearTimeout(holdTimers[k]); delete holdTimers[k]; });
  if (bellHeld){ Audio.bellUp(); bellHeld = false; }
  if (silenceHeld){ Audio.silenceUp(); silenceHeld = false; }
  if (syncHeld){ Audio.Sync.up(); Field.syncUp(); syncHeld = false; Bus.emit('sync.hold', { on:false }); }
  if (rainHeld){ rainHeld = false; Audio.Rain.up(); Field.rainSet(false); }
  if (psalmWhisper){ psalmWhisper = false; Audio.Psalm.whisperUp(); }
  slotEls.forEach(function(b){ b.classList.remove('pressed'); });
  renderDeck();
}

var filePic = document.getElementById('filePic');
var fileAud = document.getElementById('fileAud');
filePic.addEventListener('change', function(){
  var files = Array.prototype.slice.call(filePic.files || []);
  filePic.value = '';
  files.slice(0, 12).forEach(function(f){
    createImageBitmap(f).then(function(bmp){
      var c = document.createElement('canvas');
      var s = Math.min(1, 220 / Math.max(bmp.width, bmp.height));
      c.width = bmp.width * s; c.height = bmp.height * s;
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      picDeck.push(c);
      if (picDeck.length > 12) picDeck.shift();
    }).catch(function(){});
  });
  if (files.length) hint('колода заряжена');
});
fileAud.addEventListener('change', function(){
  var f = fileAud.files && fileAud.files[0];
  fileAud.value = '';
  if (!f) return;
  Audio.Psalm.load(f).then(function(){ hint('псалом заряжен'); }).catch(function(){ hint('не читается'); });
});

var invertEl = document.getElementById('invert');
function castChip(chip){
  Bus.emit('slot.fire', { side:deckSide, chip:chip, mix:mix });
  switch (chip){
    case 'symbol':
      Audio.symbolSound();
      if (symbolMode.text) Field.addSymbol('text', symbolMode.text);
      else Field.addSymbol(symbolMode.kind);
      break;
    case 'picture':
      if (!picDeck.length){ filePic.click(); return; }
      Audio.picSound();
      Field.addPic(picDeck[picActive % picDeck.length]);
      break;
    case 'psalm':
      if (!Audio.Psalm.has()){ fileAud.click(); return; }
      Audio.Psalm.play();
      break;
    case 'invert':
      Audio.invertSound();
      invertEl.classList.add('on');
      setTimeout(function(){ invertEl.classList.remove('on'); }, 2000);
      break;
    case 'random':
      Audio.rouletteSound();
      setTimeout(function(){
        var pool = ['symbol', 'bellshot', 'invert'];
        if (picDeck.length) pool.push('picture');
        if (Audio.Psalm.has()) pool.push('psalm');
        var pick = pool[Math.floor(Math.random() * pool.length)];
        if (pick === 'bellshot'){ Audio.bellDown(true); setTimeout(Audio.bellUp, 500); }
        else castChip(pick);
      }, 560);
      break;
  }
}

slotEls.forEach(function(b){
  b.addEventListener('pointerdown', function(e){
    var chip = b.dataset.chip;
    if (!chip || flipping || STUB_CHIPS[chip]) return;
    b.classList.add('pressed');
    if (chip === 'bell'){
      bellHeld = true; Audio.bellDown(deckSide === 'black');
    } else if (chip === 'silence'){
      silenceHeld = true; Audio.silenceDown();
      Bus.emit('silence.hold', { on:true });
    } else if (chip === 'sync'){
      syncHeld = true;
      Audio.Sync.down(); Field.syncDown();
      Bus.emit('sync.hold', { on:true });
    } else if (chip === 'rain'){
      rainHeld = true;
      Audio.Rain.down(); Field.rainSet(true);
      Bus.emit('rain.hold', { on:true });
      renderDeck();
    } else if (chip === 'sample'){
      holdTimers.sample = setTimeout(function(){
        delete holdTimers.sample;
        if (!gesture.swiped) openSampleOrbit(slotEls.indexOf(b));
      }, 550);
    } else if (chip === 'symbol'){
      holdTimers.symbol = setTimeout(function(){
        delete holdTimers.symbol;
        if (!gesture.swiped) openSymbolOrbit(slotEls.indexOf(b));
      }, 550);
    } else if (chip === 'picture'){
      holdTimers.picture = setTimeout(function(){
        delete holdTimers.picture;
        if (!gesture.swiped) openPicOrbit(slotEls.indexOf(b));
      }, 550);
    } else if (chip === 'psalm' && Audio.Psalm.has()){
      holdTimers.psalm = setTimeout(function(){
        delete holdTimers.psalm;
        if (!gesture.swiped){ psalmWhisper = true; Audio.Psalm.whisperDown(); renderDeck(); }
      }, 450);
    }
  });
  b.addEventListener('pointerup', function(e){
    b.classList.remove('pressed');
    var chip = b.dataset.chip;
    if (!chip || flipping) return;
    if (STUB_CHIPS[chip]) return;   /* аватар — имя есть, функция придёт */
    if (gesture.swiped){ cancelHolds(); return; }
    if (chip === 'bell'){ if (bellHeld){ Audio.bellUp(); bellHeld = false; } return; }
    if (chip === 'silence'){
      if (silenceHeld){ silenceHeld = false; Audio.silenceUp(); Bus.emit('silence.hold', { on:false }); }
      return;
    }
    if (chip === 'sync'){
      if (syncHeld){ syncHeld = false; Audio.Sync.up(); Field.syncUp(); Bus.emit('sync.hold', { on:false }); }
      return;
    }
    if (chip === 'rain'){
      if (rainHeld){ rainHeld = false; Audio.Rain.up(); Field.rainSet(false); Bus.emit('rain.hold', { on:false }); renderDeck(); }
      return;
    }
    if (chip === 'twin'){
      twinOn = !twinOn;
      Bus.emit('twin.set', { on: twinOn });
      renderDeck();
      if (twinOn) hint('тень ходит следом');
      return;
    }
    if (chip === 'voice'){
      Audio.Voice.toggle().then(renderDeck).catch(function(){ hint('нет микрофона'); });
      return;
    }
    if (chip === 'brush'){
      brushOn = !brushOn;
      Bus.emit('brush.set', { on:brushOn });
      renderDeck();
      if (brushOn) hint('рисуй полем');
      return;
    }
    if (chip === 'sample'){
      if (holdTimers.sample){
        clearTimeout(holdTimers.sample); delete holdTimers.sample;
        if (Audio.Sample.recording()){ Audio.Sample.stopRec().then(renderDeck); }
        else if (Audio.Sample.looping()){ Audio.Sample.toggleLoop(); renderDeck(); }
        else if (Audio.Sample.has()){ Audio.Sample.toggleLoop(); renderDeck(); }
        else {
          /* первый короткий тап: пишем 4с и сразу крутим */
          Audio.Sample.startRec().then(renderDeck).catch(function(){ hint('нет микрофона'); });
        }
      }
      return;
    }
    if (chip === 'symbol'){
      if (holdTimers.symbol){ clearTimeout(holdTimers.symbol); delete holdTimers.symbol; castChip('symbol'); }
      return;
    }
    if (chip === 'picture'){
      if (holdTimers.picture){ clearTimeout(holdTimers.picture); delete holdTimers.picture; castChip('picture'); }
      return;
    }
    if (chip === 'psalm'){
      if (holdTimers.psalm){ clearTimeout(holdTimers.psalm); delete holdTimers.psalm; castChip('psalm'); }
      else if (psalmWhisper){ psalmWhisper = false; Audio.Psalm.whisperUp(); renderDeck(); }
      return;
    }
    castChip(chip);
  });
  b.addEventListener('pointercancel', function(){ b.classList.remove('pressed'); });
});

(function Fader(){
  var el = document.getElementById('fader'), knob = document.getElementById('knob');
  var active = false;
  function setFromX(clientX){
    var r = el.getBoundingClientRect(), pad = 24;
    var t = Math.min(1, Math.max(0, (clientX - r.left - pad) / (r.width - pad * 2)));
    knob.style.left = (pad + t * (r.width - pad * 2)) + 'px';
    Audio.setMix(t);
    Bus.emit('fader.set', { mix:t });
  }
  el.addEventListener('pointerdown', function(e){
    e.stopPropagation(); active = true;
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    setFromX(e.clientX);
  });
  el.addEventListener('pointermove', function(e){ if (active) setFromX(e.clientX); });
  ['pointerup', 'pointercancel'].forEach(function(n){
    el.addEventListener(n, function(){ active = false; });
  });
  knob.style.left = '24px';
})();

(function FlowSlider(){
  var el = document.getElementById('flow'), knob = document.getElementById('flowKnob');
  var active = false;
  function place(){
    el.style.top = '96px';
    el.style.height = (hexTop() - 96 - 40) + 'px';
  }
  place(); addEventListener('resize', place);
  function setFromY(clientY){
    var r = el.getBoundingClientRect();
    var t = Math.min(1, Math.max(0, (clientY - r.top) / r.height));
    knob.style.top = (t * 100) + '%';
    flowTarget = 2 + t * 58;
    Bus.emit('flow.set', { speed: flowTarget });
  }
  el.addEventListener('pointerdown', function(e){
    e.stopPropagation(); active = true; el.classList.add('touch');
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    setFromY(e.clientY);
  });
  el.addEventListener('pointermove', function(e){ if (active) setFromY(e.clientY); });
  ['pointerup', 'pointercancel'].forEach(function(n){
    el.addEventListener(n, function(){ active = false; el.classList.remove('touch'); });
  });
  knob.style.top = ((16 - 2) / 58 * 100) + '%';
})();

(function Rec(){
  var btn = document.getElementById('recBtn');
  var rec = null, chunks = [];
  btn.addEventListener('click', function(){
    if (rec){ try { rec.stop(); } catch(_){} return; }
    try {
      var canvasStream = document.getElementById('field').captureStream(30);
      var mixed = new MediaStream(
        canvasStream.getVideoTracks().concat(Audio.recStream().getAudioTracks())
      );
      var mime = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'].filter(function(m){
        return window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m);
      })[0];
      rec = new MediaRecorder(mixed, mime ? { mimeType: mime } : undefined);
      chunks = [];
      rec.ondataavailable = function(e){ if (e.data.size) chunks.push(e.data); };
      rec.onstop = function(){
        var type = (rec && rec.mimeType) || 'video/webm';
        var blob = new Blob(chunks, { type: type });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'daodedo-lenta.' + (type.indexOf('mp4') >= 0 ? 'mp4' : 'webm');
        a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
        rec = null;
        btn.classList.remove('on');
        Bus.emit('rec.set', { on:false });
      };
      rec.start();
      btn.classList.add('on');
      Bus.emit('rec.set', { on:true });
      hint('лента пишется');
    } catch(err){
      rec = null;
      hint('запись недоступна');
    }
  });
})();
