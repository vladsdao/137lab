<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060606">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>DAODEDO · Профиль — эскиз</title>
<!--
  ЭСКИЗ «Профиль» v3 — «проезжающий магический стол» (правки Влада 2026-08-12):
  поле — лента, едущая вниз: всё проявленное оставляет квантовый след и
  уплывает под соты; скорость ленты — тонкий вертикальный ползунок справа.
  Голос (центр белой) — живой микрофон-тумблер; сэмпл (справа) — записал и
  крутится лупом; тишина держится, пока держишь (глушит фон, не голос);
  символ — случайный знак из набора; кисть — магическое рисование пальцем;
  картинка — колода локальных медиа ложится на стол; псалом (чёрная) —
  свой аудио-кусок в кнопке. Лента начинается с плывущих подсказок.
  Всё локально, ничего не покидает устройство.
-->
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:#060606;
  --text:#f0ede6;
  --dim:#6f6b64;
  --font:'Space Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}

html, body {
  height:100%; background:var(--bg); color:var(--text); font-family:var(--font);
  overflow:hidden; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
  user-select:none; touch-action:none;
}

#stage { position:fixed; inset:0; width:100vw; height:100dvh; }
canvas#field { position:absolute; inset:0; width:100%; height:100%; display:block; }

.brand {
  position:fixed; left:16px; top:calc(12px + env(safe-area-inset-top));
  font-size:9px; letter-spacing:.26em; text-transform:uppercase; color:var(--dim); z-index:30;
}

#hint {
  position:fixed; left:0; right:0; text-align:center; z-index:40;
  font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--text);
  opacity:0; transition:opacity .8s ease; pointer-events:none;
}
#hint.on { opacity:.85; }

/* ── гексагоны ───────────────────────────────── */
.hexbtn {
  position:absolute; width:96px; height:106px; margin:-53px 0 0 -48px;
  border:none; background:none; cursor:pointer; font-family:var(--font);
  display:grid; place-items:center; touch-action:none; z-index:26;
  transition:transform .2s ease-in;
}
.hexbtn.mid { transform:rotateY(90deg); }
.hexbtn svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.hexbtn svg path {
  stroke-width:12; stroke-linejoin:round;
  fill:#e9e3d6; stroke:#e9e3d6;
  filter:drop-shadow(0 2px 7px rgba(0,0,0,.5));
  transition:fill .25s ease, stroke .25s ease, filter .25s ease;
}
.hexbtn .lbl {
  position:relative; z-index:2; font-size:10px; letter-spacing:.06em;
  color:#332e25; transition:color .25s ease; line-height:1.3; text-align:center;
}
.hexbtn.dark svg path { fill:#121212; stroke:#242424; filter:drop-shadow(0 0 9px rgba(0,0,0,.85)); }
.hexbtn.dark .lbl { color:#b7b1a6; }
.hexbtn.stub svg path { opacity:.28; }
.hexbtn.stub .lbl { opacity:.4; letter-spacing:.2em; }
.hexbtn.pressed svg path { filter:brightness(1.3) drop-shadow(0 0 16px rgba(240,237,230,.7)); }
.hexbtn.armed svg path { filter:drop-shadow(0 0 12px rgba(240,237,230,.55)); }
.hexbtn.rec { animation:recpulse .8s ease-in-out infinite; }
.hexbtn.rec svg path { filter:drop-shadow(0 0 18px rgba(240,237,230,.8)) brightness(1.15); }
.hexbtn.live svg path { animation:livepulse 1.4s ease-in-out infinite; }
@keyframes recpulse  { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
@keyframes livepulse {
  0%,100% { filter:drop-shadow(0 0 6px rgba(240,237,230,.4)); }
  50%     { filter:drop-shadow(0 0 20px rgba(240,237,230,.85)); }
}

/* ── кроссфейдер ─────────────────────────────── */
#fader {
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));
  width:260px; height:44px; z-index:28; touch-action:none; cursor:pointer;
}
#fader .track {
  position:absolute; left:24px; right:24px; top:50%; height:2px; margin-top:-1px;
  background:linear-gradient(90deg, rgba(240,237,230,.5), rgba(240,237,230,.14));
  border-radius:1px;
}
#fader .end { position:absolute; top:50%; transform:translateY(-50%); font-size:10px; color:var(--dim); pointer-events:none; }
#fader .end.l { left:2px; }
#fader .end.r { right:2px; }
#knob {
  position:absolute; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px;
  border-radius:50%; background:var(--text);
  box-shadow:0 0 12px -2px rgba(240,237,230,.8); pointer-events:none;
}

/* ── скорость ленты: тонкий вертикальный ползунок ── */
#flow {
  position:fixed; right:6px; width:26px; z-index:28; touch-action:none;
  opacity:.3; transition:opacity .4s ease;
}
#flow.touch { opacity:.85; }
#flow .track { position:absolute; left:50%; top:0; bottom:0; width:2px; margin-left:-1px;
  background:linear-gradient(180deg, rgba(240,237,230,.35), rgba(240,237,230,.08)); }
#flowKnob {
  position:absolute; left:50%; width:12px; height:12px; margin:-6px 0 0 -6px;
  border-radius:50%; background:var(--text);
  box-shadow:0 0 8px -2px rgba(240,237,230,.8); pointer-events:none;
}

/* ── врата ───────────────────────────────────── */
#gate {
  position:fixed; inset:0; z-index:60; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
  transition:opacity 1.2s ease;
}
#gate.off { opacity:0; pointer-events:none; }
#gate .yin {
  width:96px; height:96px; border-radius:50%;
  background:conic-gradient(from 0deg, #f0ede6 0 50%, #0a0a0a 50% 100%);
  box-shadow:0 0 34px -8px rgba(240,237,230,.5);
  animation:yinspin 9s linear infinite;
}
@keyframes yinspin { to { transform:rotate(360deg); } }
#gate .cap { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim); }

#filePic, #fileAud { display:none; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="field"></canvas>
  <span class="brand">DAODEDO · профиль</span>
  <div id="hint"></div>

  <div id="flow"><div class="track"></div><div id="flowKnob"></div></div>

  <div id="fader">
    <span class="end l">●</span>
    <div class="track"></div>
    <div id="knob"></div>
    <span class="end r">∿</span>
  </div>

  <div id="gate">
    <div class="yin"></div>
    <span class="cap">коснись — поле оживёт</span>
  </div>

  <input type="file" id="filePic" accept="image/*" multiple>
  <input type="file" id="fileAud" accept="audio/*">
</div>

<script>
(function(){
'use strict';

/* ── шина (драфт эскиза) ── */
var Bus = (function(){
  var et = new EventTarget(), seq = 0;
  return {
    emit: function(type, data){
      var ev = { v:'sketch', ts:Date.now(), seq:++seq, type:type, data:data || {} };
      et.dispatchEvent(new CustomEvent('bus', { detail:ev }));
      return ev;
    },
    on: function(type, fn){
      et.addEventListener('bus', function(e){
        if (type === '*' || e.detail.type === type) fn(e.detail);
      });
    }
  };
})();

var deckSide = 'white';
var mix = 0;                 /* 0 = бит · 1 = frequency */
var flowSpeed = 16;          /* px/s — скорость ленты */
var brushOn = false;
function lightColor(a){ return 'rgba(240,237,230,' + (a == null ? 1 : a) + ')'; }
function hexTop(){ return innerHeight - 360; }

/* ═══════════════════════════════════════════════
   АУДИО
   цепь: master ← bgGain ← (техно, хилинг, фишки)
         master ← голос (живой микрофон — тишина его не глушит)
   ═══════════════════════════════════════════════ */
var Audio = (function(){
  var ctx = null, master = null, bgGain = null;
  var techGain = null, healGain = null, chipGain = null;
  var noiseBuf = null;

  function ensure(){
    if (!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9;
      master.connect(ctx.destination);
      bgGain = ctx.createGain(); bgGain.gain.value = 1;
      bgGain.connect(master);
      techGain = ctx.createGain(); techGain.gain.value = 1;
      healGain = ctx.createGain(); healGain.gain.value = 0;
      chipGain = ctx.createGain(); chipGain.gain.value = 1;
      techGain.connect(bgGain); healGain.connect(bgGain); chipGain.connect(bgGain);
      var len = ctx.sampleRate * 0.5;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state !== 'running') ctx.resume().catch(function(){});
    return ctx;
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && ctx && ctx.state !== 'running') ctx.resume().catch(function(){});
  });

  function tone(o){
    var c = ensure(), t = (o.at || c.currentTime);
    var osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + (o.dur || 0.3));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, o.g), t + (o.a || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + (o.dur || 0.3));
    osc.connect(g).connect(o.dest || chipGain);
    osc.start(t); osc.stop(t + (o.dur || 0.3) + 0.05);
  }
  function noise(o){
    var c = ensure(), t = (o.at || c.currentTime);
    var s = c.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    var f = c.createBiquadFilter(); f.type = o.lp ? 'lowpass' : 'highpass';
    f.frequency.value = o.freq || 4000;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, o.g), t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (o.dur || 0.2));
    s.connect(f).connect(g).connect(o.dest || chipGain);
    s.start(t); s.stop(t + (o.dur || 0.2) + 0.05);
  }

  /* ── полюс: БИТ ── */
  var Tech = (function(){
    var timer = null, step = 0, nextT = 0;
    var BPM = 112, STEP = 60 / BPM / 4;
    var BASS = [55, 0, 55, 0, 65.4, 0, 55, 0, 82.4, 0, 55, 0, 98, 0, 82.4, 0];
    function schedule(){
      var c = ensure();
      while (nextT < c.currentTime + 0.14){
        var s16 = step % 16;
        if (s16 % 4 === 0){
          tone({ f:120, f2:42, g:0.16, a:0.004, dur:0.16, type:'square', dest:techGain, at:nextT });
          Bus.emit('pulse', {});
        }
        if (s16 % 4 === 2) noise({ g:0.035, freq:8000, dur:0.03, dest:techGain, at:nextT });
        var b = BASS[s16];
        if (b) tone({ f:b, g:0.065, a:0.006, dur:STEP * 0.9, type:'square', dest:techGain, at:nextT });
        if (s16 === 14 && Math.random() < 0.5)
          tone({ f:[440,523,659,880][Math.floor(Math.random()*4)], g:0.03, a:0.004, dur:0.1, type:'square', dest:techGain, at:nextT });
        step++; nextT += STEP;
      }
    }
    return {
      start: function(){ var c = ensure(); step = 0; nextT = c.currentTime + 0.05; clearInterval(timer); timer = setInterval(schedule, 30); },
      nextEighth: function(){ var c = ensure(); if (!timer) return c.currentTime; var e = STEP * 2; return nextT - STEP + (e - ((nextT - STEP) % e || e)); }
    };
  })();

  /* ── полюс: FREQUENCY ── */
  var Heal = (function(){
    var started = false;
    function drone(f, g, lfoT, ph){
      var c = ensure();
      var o = c.createOscillator(); o.frequency.value = f;
      var gg = c.createGain(); gg.gain.value = g;
      var lfo = c.createOscillator(); lfo.frequency.value = 1 / lfoT;
      var lg = c.createGain(); lg.gain.value = g * 0.55;
      lfo.connect(lg).connect(gg.gain);
      o.connect(gg).connect(healGain);
      o.start(); lfo.start(c.currentTime + ph);
    }
    return {
      start: function(){
        if (started) return; started = true;
        drone(110, 0.055, 11, 0); drone(164.8, 0.035, 9, 2); drone(220, 0.028, 13, 5);
        setInterval(function(){
          if (Math.random() < 0.6) tone({ f:880, g:0.022, a:0.4, dur:4.5, dest:healGain });
        }, 7000);
        setInterval(function(){ Bus.emit('breath', {}); }, 4000);
      }
    };
  })();

  function start(){ ensure(); Tech.start(); Heal.start(); setMix(mix); }

  function setMix(x){
    var c = ensure(), t = c.currentTime;
    mix = Math.min(1, Math.max(0, x));
    techGain.gain.setTargetAtTime(Math.cos(mix * Math.PI / 2), t, 0.08);
    healGain.gain.setTargetAtTime(Math.sin(mix * Math.PI / 2), t, 0.08);
  }

  function quantized(fn){
    var c = ensure();
    if (mix < 0.5){
      var at = Tech.nextEighth();
      setTimeout(fn, Math.max(0, (at - c.currentTime) * 1000));
    } else fn();
  }

  /* тишина держится, пока держат: глушит фон, но не живой голос */
  function silenceDown(){
    var c = ensure(), t = c.currentTime;
    bgGain.gain.cancelScheduledValues(t);
    bgGain.gain.setTargetAtTime(0.0001, t, 0.03);
  }
  function silenceUp(){
    var c = ensure(), t = c.currentTime;
    bgGain.gain.cancelScheduledValues(t);
    bgGain.gain.setTargetAtTime(1, t, 0.25);
  }

  /* ── микрофон: живой голос + сэмпл-луп ── */
  var Mic = (function(){
    var stream = null;
    function ensureStream(){
      if (stream) return Promise.resolve(stream);
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
        return Promise.reject(new Error('no-mic'));
      return navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true } })
        .then(function(s){ stream = s; return s; });
    }
    return { ensureStream: ensureStream };
  })();

  var Voice = (function(){
    var srcNode = null, gain = null, analyser = null, on = false;
    function toggle(){
      var c = ensure();
      if (on){
        on = false;
        if (gain) gain.gain.setTargetAtTime(0.0001, c.currentTime, 0.05);
        Bus.emit('voice.live', { on:false });
        return Promise.resolve(false);
      }
      return Mic.ensureStream().then(function(s){
        if (!srcNode){
          srcNode = c.createMediaStreamSource(s);
          gain = c.createGain();
          analyser = c.createAnalyser(); analyser.fftSize = 256;
          var comp = c.createDynamicsCompressor();
          srcNode.connect(analyser);
          analyser.connect(gain); gain.connect(comp); comp.connect(master);
        }
        gain.gain.setTargetAtTime(0.85, c.currentTime, 0.05);
        on = true;
        Bus.emit('voice.live', { on:true });
        return true;
      });
    }
    function level(){
      if (!analyser || !on) return 0;
      var arr = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(arr);
      var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i];
      return s / arr.length / 255;
    }
    return { toggle:toggle, level:level, isOn: function(){ return on; } };
  })();

  var Sample = (function(){
    var rec = null, chunks = [], buffer = null, srcNode = null, analyser = null;
    function startRec(){
      return Mic.ensureStream().then(function(s){
        chunks = [];
        rec = new MediaRecorder(s);
        rec.ondataavailable = function(e){ if (e.data.size) chunks.push(e.data); };
        rec.start();
        Bus.emit('sample.state', { state:'rec' });
        return true;
      });
    }
    function stopRec(){
      return new Promise(function(res){
        if (!rec || rec.state === 'inactive'){ res(false); return; }
        rec.onstop = function(){
          var blob = new Blob(chunks);
          blob.arrayBuffer().then(function(ab){
            return ensure().decodeAudioData(ab);
          }).then(function(buf){
            buffer = buf;
            play(true);
            Bus.emit('sample.state', { state:'loop' });
            res(true);
          }).catch(function(){ Bus.emit('sample.state', { state:'empty' }); res(false); });
        };
        rec.stop();
      });
    }
    function play(onFlag){
      var c = ensure();
      if (srcNode){ try { srcNode.stop(); } catch(_){} srcNode = null; }
      if (!onFlag || !buffer){ Bus.emit('sample.loop', { on:false }); return; }
      srcNode = c.createBufferSource();
      srcNode.buffer = buffer; srcNode.loop = true;
      var g = c.createGain(); g.gain.value = 0.6;
      analyser = c.createAnalyser(); analyser.fftSize = 256;
      srcNode.connect(g); g.connect(analyser); analyser.connect(chipGain);
      srcNode.start();
      Bus.emit('sample.loop', { on:true });
    }
    function toggleLoop(){ play(!srcNode); }
    function level(){
      if (!analyser || !srcNode) return 0;
      var arr = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(arr);
      var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i];
      return s / arr.length / 255;
    }
    return {
      startRec:startRec, stopRec:stopRec, toggleLoop:toggleLoop, level:level,
      has: function(){ return !!buffer; },
      looping: function(){ return !!srcNode; }
    };
  })();

  /* ── псалом: свой аудио-кусок в кнопке ── */
  var Psalm = (function(){
    var buffer = null, playing = null;
    function load(file){
      return file.arrayBuffer().then(function(ab){
        return ensure().decodeAudioData(ab);
      }).then(function(buf){ buffer = buf; Bus.emit('psalm.state', { loaded:true }); return true; });
    }
    function play(){
      if (!buffer) return false;
      var c = ensure();
      if (playing){ try { playing.stop(); } catch(_){} playing = null; Bus.emit('psalm.play', { on:false }); return true; }
      playing = c.createBufferSource();
      playing.buffer = buffer;
      var g = c.createGain(); g.gain.value = 0.7;
      playing.connect(g).connect(chipGain);
      playing.onended = function(){ playing = null; Bus.emit('psalm.play', { on:false }); };
      playing.start();
      Bus.emit('psalm.play', { on:true });
      return true;
    }
    return { load:load, play:play, has: function(){ return !!buffer; }, playing: function(){ return !!playing; } };
  })();

  /* ── звуки фишек ── */
  var bellOsc = null, bellG = null;
  function bellDown(dark){
    quantized(function(){
      var c = ensure(), t = c.currentTime;
      var f = dark ? 220 : 880;
      bellOsc = c.createOscillator(); bellOsc.frequency.value = f;
      var o2 = c.createOscillator(); o2.frequency.value = f * 1.5;
      bellG = c.createGain();
      bellG.gain.setValueAtTime(0.0001, t);
      bellG.gain.exponentialRampToValueAtTime(dark ? 0.09 : 0.07, t + 0.04);
      var g2 = c.createGain(); g2.gain.value = 0.35;
      o2.connect(g2).connect(bellG);
      bellOsc.connect(bellG).connect(chipGain);
      bellOsc.start(); o2.start();
      bellOsc._o2 = o2;
    });
  }
  function bellUp(){
    if (!bellOsc) return;
    var c = ensure(), t = c.currentTime;
    var rel = 1.1 + mix * 2.3;
    bellG.gain.cancelScheduledValues(t);
    bellG.gain.setValueAtTime(Math.max(0.001, bellG.gain.value), t);
    bellG.gain.exponentialRampToValueAtTime(0.0001, t + rel);
    bellOsc.stop(t + rel + 0.1); bellOsc._o2.stop(t + rel + 0.1);
    bellOsc = null;
  }
  function symbolSound(){
    quantized(function(){
      var c = ensure(), t = c.currentTime;
      [660, 880, 1108].forEach(function(f, i){
        tone({ f:f, g:0.035, a:0.01, dur:0.8, at:t + i * 0.07 });
      });
    });
  }
  function picSound(){ tone({ f:520, f2:390, g:0.05, a:0.005, dur:0.25, type:'triangle' }); }
  function rouletteSound(){
    var c = ensure(), t = c.currentTime;
    for (var i = 0; i < 6; i++)
      tone({ f:900 + Math.random() * 500, g:0.03, a:0.003, dur:0.05, type:'square', at:t + i * 0.08 });
  }

  return {
    ensure:ensure, start:start, setMix:setMix, quantized:quantized,
    silenceDown:silenceDown, silenceUp:silenceUp,
    Voice:Voice, Sample:Sample, Psalm:Psalm,
    bellDown:bellDown, bellUp:bellUp,
    symbolSound:symbolSound, picSound:picSound, rouletteSound:rouletteSound
  };
})();

/* ═══════════════════════════════════════════════
   ПОЛЕ-ЛЕНТА: всё проявленное едет вниз и тает у сот
   ═══════════════════════════════════════════════ */
var Field = (function(){
  var cnv = document.getElementById('field'), ctx2 = cnv.getContext('2d');
  var dpr = Math.min(devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var kickFlash = 0, breathT = 0;
  var voiceTrail = [];       /* река голоса: {y, amp} */
  var strokes = [];          /* кисть: {pts:[{x,y}], born} */
  var symbols = [];          /* знаки: {kind, x, y, born, seed} */
  var pics = [];             /* картинки: {img, x, y, rot, w} */
  var texts = [];            /* плывущие подсказки: {str, x, y} */
  var orbA = 0;

  function size(){
    W = innerWidth; H = innerHeight;
    cnv.width = W * dpr; cnv.height = H * dpr;
  }
  size(); addEventListener('resize', size);

  Bus.on('pulse', function(){ kickFlash = 1; });
  Bus.on('breath', function(){ breathT = performance.now(); });

  var PEN_Y = 120;           /* точка настоящего — здесь пишется голос */

  function flowAll(dy){
    voiceTrail.forEach(function(p){ p.y += dy; });
    strokes.forEach(function(s){ s.pts.forEach(function(p){ p.y += dy; }); });
    symbols.forEach(function(s){ s.y += dy; });
    pics.forEach(function(p){ p.y += dy; });
    texts.forEach(function(t2){ t2.y += dy; });
    var cut = hexTop() + 60;
    voiceTrail = voiceTrail.filter(function(p){ return p.y < cut; });
    strokes = strokes.filter(function(s){ return s.pts.some(function(p){ return p.y < cut; }); });
    symbols = symbols.filter(function(s){ return s.y < cut; });
    pics = pics.filter(function(p){ return p.y < cut + 80; });
    texts = texts.filter(function(t2){ return t2.y < cut; });
  }

  /* ── символы: набор знаков, резонирующих полю ── */
  var SYMS = ['spiral','eye','infinity','star','wave','hexflower','triskel'];
  function drawSymbol(s, now){
    var age = now - s.born;
    var pr = Math.min(1, age / 700);
    var al = Math.min(0.9, pr) * (s.y > hexTop() - 40 ? 0.4 : 1);
    var R = 34 * (0.6 + 0.4 * pr);
    ctx2.save();
    ctx2.translate(s.x, s.y);
    ctx2.rotate(Math.sin(s.seed) * 0.4);
    ctx2.strokeStyle = lightColor(al); ctx2.lineWidth = 1.6; ctx2.lineCap = 'round';
    ctx2.shadowColor = lightColor(0.9); ctx2.shadowBlur = 14 * pr;
    ctx2.beginPath();
    var i, a, r;
    switch (s.kind){
      case 'spiral':
        for (i = 0; i <= 60 * pr; i++){ a = i / 60 * 5 * Math.PI; r = 2 + i / 60 * R;
          i ? ctx2.lineTo(r * Math.cos(a), r * Math.sin(a)) : ctx2.moveTo(2, 0); }
        break;
      case 'eye':
        ctx2.ellipse(0, 0, R, R * 0.55, 0, 0, 6.29 * pr);
        ctx2.moveTo(R * 0.4, 0);
        ctx2.arc(0, 0, R * 0.4, 0, 6.29 * pr);
        break;
      case 'infinity':
        for (i = 0; i <= 60 * pr; i++){ a = i / 60 * 2 * Math.PI;
          var x8 = R * Math.cos(a), y8 = R * 0.55 * Math.sin(2 * a) / 2;
          i ? ctx2.lineTo(x8, y8) : ctx2.moveTo(R, 0); }
        break;
      case 'star':
        for (i = 0; i <= 7 * pr; i++){ a = i / 7 * 2 * Math.PI * 3 - Math.PI / 2;
          var xr = R * Math.cos(a), yr = R * Math.sin(a);
          i ? ctx2.lineTo(xr, yr) : ctx2.moveTo(0, -R); }
        break;
      case 'wave':
        for (i = 0; i <= 50 * pr; i++){ var xw = -R + i / 50 * 2 * R;
          i ? ctx2.lineTo(xw, Math.sin(i / 50 * 4 * Math.PI) * R * 0.3) : ctx2.moveTo(-R, 0); }
        break;
      case 'hexflower':
        for (var k = 0; k < 6 * pr; k++){
          var ka = k / 6 * 2 * Math.PI;
          ctx2.moveTo(R * 0.5 * Math.cos(ka) + R * 0.5, R * 0.5 * Math.sin(ka));
          ctx2.arc(R * 0.5 * Math.cos(ka), R * 0.5 * Math.sin(ka), R * 0.5, 0, 6.29);
        }
        break;
      default: /* triskel */
        for (var t3 = 0; t3 < 3; t3++){
          var base = t3 / 3 * 2 * Math.PI;
          ctx2.moveTo(0, 0);
          for (i = 0; i <= 30 * pr; i++){ a = base + i / 30 * 2.4; r = i / 30 * R;
            ctx2.lineTo(r * Math.cos(a), r * Math.sin(a)); }
        }
    }
    ctx2.stroke();
    ctx2.restore();
    ctx2.shadowBlur = 0;
  }

  function drawBg(now){
    var gAl = (0.028 + kickFlash * 0.05) * (1 - mix);
    if (gAl > 0.004){
      ctx2.strokeStyle = 'rgba(240,237,230,' + gAl.toFixed(3) + ')';
      ctx2.lineWidth = 1;
      var g = 44, off = (now * 0.012) % g;
      for (var x = -g + off; x < W; x += g){ ctx2.beginPath(); ctx2.moveTo(x, 0); ctx2.lineTo(x, H); ctx2.stroke(); }
      for (var y = -g + off; y < H; y += g){ ctx2.beginPath(); ctx2.moveTo(0, y); ctx2.lineTo(W, y); ctx2.stroke(); }
    }
    if (mix > 0.02){
      var ph = (now - breathT) / 4000;
      var br = 0.5 - 0.5 * Math.cos(Math.min(1, ph) * 2 * Math.PI);
      var cx = W * (0.3 + 0.08 * Math.sin(now * 0.00013));
      var cy = H * 0.34 + 40 * Math.sin(now * 0.00009);
      var g1 = ctx2.createRadialGradient(cx, cy, 0, cx, cy, W * 0.7);
      g1.addColorStop(0, 'rgba(240,237,230,' + ((0.05 + br * 0.05) * mix).toFixed(3) + ')');
      g1.addColorStop(1, 'rgba(0,0,0,0)');
      ctx2.fillStyle = g1; ctx2.fillRect(0, 0, W, H);
    }
    kickFlash = Math.max(0, kickFlash - 0.08);
  }

  function drawVoiceRiver(){
    /* живой голос пишет реку: огибающая от точки настоящего вниз */
    if (voiceTrail.length < 2) return;
    ctx2.beginPath();
    for (var i = 0; i < voiceTrail.length; i++){
      var p = voiceTrail[i];
      var xx = W / 2 - 6 - p.amp * 120;
      i ? ctx2.lineTo(xx, p.y) : ctx2.moveTo(xx, p.y);
    }
    for (var j = voiceTrail.length - 1; j >= 0; j--){
      var q = voiceTrail[j];
      ctx2.lineTo(W / 2 + 6 + q.amp * 120, q.y);
    }
    ctx2.closePath();
    ctx2.fillStyle = lightColor(0.14);
    ctx2.fill();
    ctx2.strokeStyle = lightColor(0.5); ctx2.lineWidth = 1;
    ctx2.stroke();
  }

  function draw(now){
    ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx2.clearRect(0, 0, W, H);
    drawBg(now);

    /* подсказки-приглашения плывут вместе с лентой */
    texts.forEach(function(t2){
      ctx2.fillStyle = lightColor(0.4);
      ctx2.font = '10px "Space Mono", monospace';
      ctx2.textAlign = 'center';
      ctx2.fillText(t2.str, t2.x, t2.y);
    });

    drawVoiceRiver();

    /* кисть */
    strokes.forEach(function(s){
      if (s.pts.length < 2) return;
      ctx2.strokeStyle = lightColor(0.85); ctx2.lineWidth = 2.2; ctx2.lineCap = 'round'; ctx2.lineJoin = 'round';
      ctx2.shadowColor = lightColor(1); ctx2.shadowBlur = 12;
      ctx2.beginPath();
      s.pts.forEach(function(p, i){ i ? ctx2.lineTo(p.x, p.y) : ctx2.moveTo(p.x, p.y); });
      ctx2.stroke();
      ctx2.shadowBlur = 0;
      var last = s.pts[s.pts.length - 1];
      if (now - s.born < 4000 && Math.random() < 0.3){
        ctx2.fillStyle = lightColor(0.7);
        ctx2.fillRect(last.x + (Math.random()*2-1)*10, last.y + (Math.random()*2-1)*10, 1.6, 1.6);
      }
    });

    symbols.forEach(function(s){ drawSymbol(s, now); });

    /* картинки на столе */
    pics.forEach(function(p){
      ctx2.save();
      ctx2.translate(p.x, p.y); ctx2.rotate(p.rot);
      ctx2.shadowColor = 'rgba(0,0,0,.7)'; ctx2.shadowBlur = 14;
      ctx2.drawImage(p.img, -p.w/2, -p.w/2, p.w, p.w);
      ctx2.restore();
    });

    /* живой голос: пишем точку настоящего */
    var vl = Audio.Voice.level();
    if (Audio.Voice.isOn()){
      voiceTrail.push({ y: PEN_Y, amp: vl });
      if (voiceTrail.length > 900) voiceTrail.shift();
      ctx2.fillStyle = lightColor(0.9);
      ctx2.shadowColor = lightColor(1); ctx2.shadowBlur = 16;
      ctx2.beginPath(); ctx2.arc(W/2, PEN_Y, 3.5 + vl * 14, 0, 6.29); ctx2.fill();
      ctx2.shadowBlur = 0;
    }

    /* сэмпл-луп — орб-спутник */
    var sl = Audio.Sample.level();
    if (Audio.Sample.looping()){
      orbA += 0.004 + sl * 0.02;
      var ox = W / 2 + Math.sin(orbA) * W * 0.3;
      var oy = H * 0.26 + Math.sin(orbA * 1.7) * H * 0.12;
      ctx2.shadowColor = lightColor(1); ctx2.shadowBlur = 20;
      ctx2.fillStyle = lightColor(0.5 + sl * 0.5);
      ctx2.beginPath(); ctx2.arc(ox, oy, 10 + sl * 30, 0, 6.29); ctx2.fill();
      ctx2.shadowBlur = 0;
    }

    /* лента едет */
    flowAll(flowSpeed * (1 / 60));

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  return {
    addSymbol: function(){
      symbols.push({
        kind: SYMS[Math.floor(Math.random() * SYMS.length)],
        x: 50 + Math.random() * (W - 100),
        y: 110 + Math.random() * (H * 0.3),
        born: performance.now(), seed: Math.random() * 10
      });
    },
    addPic: function(img){
      pics.push({
        img: img,
        x: 60 + Math.random() * (W - 120),
        y: 120 + Math.random() * (H * 0.28),
        rot: (Math.random() * 2 - 1) * 0.26,
        w: 96 + Math.random() * 60
      });
      if (pics.length > 10) pics.shift();
    },
    addText: function(str){
      texts.push({ str: str, x: W / 2, y: 100 });
    },
    strokeStart: function(x, y){
      strokes.push({ pts: [{ x:x, y:y }], born: performance.now() });
      if (strokes.length > 30) strokes.shift();
      return strokes[strokes.length - 1];
    }
  };
})();

var hintEl = document.getElementById('hint'), hintTimer = null;
function hint(text, ttl){
  clearTimeout(hintTimer);
  hintEl.style.top = (innerHeight - 396) + 'px';
  if (!text){ hintEl.classList.remove('on'); return; }
  hintEl.textContent = text; hintEl.classList.add('on');
  hintTimer = setTimeout(function(){ hintEl.classList.remove('on'); }, ttl || 2200);
}

var DECKS = {
  white: { center:'voice',  petals:['sample', 'brush', 'symbol', 'picture', null, null] },
  black: { center:'random', petals:['psalm', 'silence', 'bell', null, null, null] }
};
var CHIP_LBL = {
  voice:'голос', sample:'сэмпл', brush:'кисть', symbol:'символ', picture:'картинка',
  random:'рандом', psalm:'псалом', silence:'тишина', bell:'колокол'
};
var HEX_PATH = 'M48 8 L86 30 V76 L48 98 L10 76 V30 Z';

var slotEls = [], slotPos = [];
(function buildHexes(){
  var stage = document.getElementById('stage');
  for (var i = 0; i < 7; i++){
    var b = document.createElement('button');
    b.className = 'hexbtn';
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 96 106');
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', HEX_PATH);
    svg.appendChild(path);
    var lbl = document.createElement('span'); lbl.className = 'lbl';
    b.appendChild(svg); b.appendChild(lbl);
    stage.appendChild(b);
    slotEls.push(b);
  }
  placeHexes();
})();

function placeHexes(){
  var cx = innerWidth / 2, cy = innerHeight - 224, R = 92;
  slotEls.forEach(function(b, i){
    var x = cx, y = cy;
    if (i > 0){
      var a = ((i - 1) * 60) * Math.PI / 180;
      x = cx + R * Math.cos(a); y = cy + R * Math.sin(a);
    }
    b.style.left = x + 'px'; b.style.top = y + 'px';
    slotPos[i] = { x:x, y:y };
  });
}
addEventListener('resize', placeHexes);

function chipAt(side, i){ return i === 0 ? DECKS[side].center : DECKS[side].petals[i - 1]; }

function decorate(b, chip){
  b.classList.remove('rec', 'live', 'armed');
  if (chip === 'voice' && Audio.Voice.isOn()) b.classList.add('live');
  if (chip === 'sample'){
    if (Audio.Sample.looping()) b.classList.add('live');
    else if (Audio.Sample.has()) b.classList.add('armed');
  }
  if (chip === 'brush' && brushOn) b.classList.add('live');
  if (chip === 'psalm'){
    if (Audio.Psalm.playing()) b.classList.add('live');
    else if (Audio.Psalm.has()) b.classList.add('armed');
  }
}

function renderDeck(){
  slotEls.forEach(function(b, i){
    var chip = chipAt(deckSide, i);
    var lbl = b.querySelector('.lbl');
    b.dataset.chip = chip || '';
    b.classList.toggle('stub', !chip);
    b.classList.toggle('dark', deckSide === 'black');
    lbl.textContent = chip ? CHIP_LBL[chip] : '·';
    decorate(b, chip);
  });
}
renderDeck();
Bus.on('voice.live', renderDeck);
Bus.on('sample.state', renderDeck);
Bus.on('sample.loop', renderDeck);
Bus.on('psalm.state', renderDeck);
Bus.on('psalm.play', renderDeck);

var flipping = false;
function flipDeck(originX, originY){
  if (flipping) return;
  flipping = true;
  cancelHolds();
  var nextSide = deckSide === 'white' ? 'black' : 'white';
  Bus.emit('deck.flip', { to:nextSide });
  var maxDelay = 0;
  slotEls.forEach(function(b, i){
    var d = Math.hypot(slotPos[i].x - originX, slotPos[i].y - originY) * 0.9;
    maxDelay = Math.max(maxDelay, d);
    setTimeout(function(){ b.classList.add('mid'); }, d);
    setTimeout(function(){
      var chip = chipAt(nextSide, i);
      b.dataset.chip = chip || '';
      b.classList.toggle('dark', nextSide === 'black');
      b.classList.toggle('stub', !chip);
      b.querySelector('.lbl').textContent = chip ? CHIP_LBL[chip] : '·';
      decorate(b, chip);
      b.classList.remove('mid');
    }, d + 200);
  });
  setTimeout(function(){ deckSide = nextSide; flipping = false; }, maxDelay + 220);
}

/* ── жесты: свайп по сотам, кисть по полю ── */
var gesture = { id:null, x0:0, y0:0, swiped:false };
var activeStroke = null, strokeId = null;
var stageEl = document.getElementById('stage');

stageEl.addEventListener('pointerdown', function(e){
  /* кисть: рисование по свободному полю */
  if (brushOn && e.clientY < hexTop() - 20 && e.clientX < innerWidth - 34 && e.target.tagName === 'CANVAS'){
    activeStroke = Field.strokeStart(e.clientX, e.clientY);
    strokeId = e.pointerId;
    return;
  }
  if (gesture.id !== null) return;
  if (e.clientY < hexTop() || e.clientY > innerHeight - 96) return;
  gesture.id = e.pointerId; gesture.x0 = e.clientX; gesture.y0 = e.clientY; gesture.swiped = false;
});
stageEl.addEventListener('pointermove', function(e){
  if (activeStroke && e.pointerId === strokeId){
    var pts = activeStroke.pts;
    var lp = pts[pts.length - 1];
    if (Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 3){
      pts.push({ x:e.clientX, y:e.clientY });
      if (pts.length > 400) pts.shift();
    }
    return;
  }
  if (e.pointerId !== gesture.id || gesture.swiped) return;
  if (Math.abs(e.clientX - gesture.x0) > 46){
    gesture.swiped = true;
    flipDeck(gesture.x0, gesture.y0);
  }
});
['pointerup', 'pointercancel'].forEach(function(n){
  stageEl.addEventListener(n, function(e){
    if (e.pointerId === strokeId){ activeStroke = null; strokeId = null; }
    if (e.pointerId === gesture.id) setTimeout(function(){ gesture.id = null; gesture.swiped = false; }, 0);
  });
});

/* ── фишки ── */
var holdTimers = {}, bellHeld = false, recHold = false, silenceHeld = false;
function cancelHolds(){
  Object.keys(holdTimers).forEach(function(k){ clearTimeout(holdTimers[k]); delete holdTimers[k]; });
  if (bellHeld){ Audio.bellUp(); bellHeld = false; }
  if (recHold){ Audio.Sample.stopRec(); recHold = false; }
  if (silenceHeld){ Audio.silenceUp(); silenceHeld = false; }
  slotEls.forEach(function(b){ b.classList.remove('pressed'); });
  renderDeck();
}

var filePic = document.getElementById('filePic');
var fileAud = document.getElementById('fileAud');
var picDeck = [], picIdx = 0;
filePic.addEventListener('change', function(){
  var files = Array.prototype.slice.call(filePic.files || []);
  filePic.value = '';
  files.slice(0, 12).forEach(function(f){
    createImageBitmap(f).then(function(bmp){
      var c = document.createElement('canvas');
      var s = Math.min(1, 220 / Math.max(bmp.width, bmp.height));
      c.width = bmp.width * s; c.height = bmp.height * s;
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      picDeck.push(c);
      if (picDeck.length > 12) picDeck.shift();
    }).catch(function(){});
  });
  if (files.length) hint('колода заряжена');
});
fileAud.addEventListener('change', function(){
  var f = fileAud.files && fileAud.files[0];
  fileAud.value = '';
  if (!f) return;
  Audio.Psalm.load(f).then(function(){ hint('псалом заряжен'); }).catch(function(){ hint('не читается'); });
});

function castChip(chip){
  Bus.emit('slot.fire', { side:deckSide, chip:chip, mix:mix });
  switch (chip){
    case 'symbol':  Audio.symbolSound(); Field.addSymbol(); break;
    case 'picture':
      if (!picDeck.length){ filePic.click(); return; }
      Audio.picSound();
      Field.addPic(picDeck[picIdx % picDeck.length]);
      picIdx++;
      break;
    case 'psalm':
      if (!Audio.Psalm.has()){ fileAud.click(); return; }
      Audio.Psalm.play();
      break;
    case 'random':
      Audio.rouletteSound();
      setTimeout(function(){
        var pool = ['symbol', 'bellshot'];
        if (picDeck.length) pool.push('picture');
        if (Audio.Psalm.has()) pool.push('psalm');
        var pick = pool[Math.floor(Math.random() * pool.length)];
        if (pick === 'bellshot'){ Audio.bellDown(true); setTimeout(Audio.bellUp, 500); }
        else castChip(pick);
      }, 560);
      break;
  }
}

slotEls.forEach(function(b){
  b.addEventListener('pointerdown', function(e){
    var chip = b.dataset.chip;
    if (!chip || flipping) return;
    b.classList.add('pressed');
    if (chip === 'bell'){
      bellHeld = true; Audio.bellDown(deckSide === 'black');
    } else if (chip === 'silence'){
      silenceHeld = true; Audio.silenceDown();
      Bus.emit('silence.hold', { on:true });
    } else if (chip === 'sample'){
      holdTimers.sample = setTimeout(function(){
        delete holdTimers.sample;
        if (gesture.swiped) return;
        recHold = true;
        b.classList.add('rec');
        Audio.Sample.startRec().then(function(){
          holdTimers.recMax = setTimeout(function(){
            delete holdTimers.recMax;
            if (recHold){ recHold = false; b.classList.remove('rec'); Audio.Sample.stopRec().then(renderDeck); }
          }, 4000);
        }).catch(function(){
          recHold = false; b.classList.remove('rec');
          hint('нет микрофона');
        });
      }, Audio.Sample.has() ? 650 : 250);
    } else if (chip === 'picture' && picDeck.length){
      holdTimers.picture = setTimeout(function(){
        delete holdTimers.picture;
        filePic.click();
      }, 650);
    } else if (chip === 'psalm' && Audio.Psalm.has()){
      holdTimers.psalm = setTimeout(function(){
        delete holdTimers.psalm;
        fileAud.click();
      }, 650);
    }
  });
  b.addEventListener('pointerup', function(e){
    b.classList.remove('pressed');
    var chip = b.dataset.chip;
    if (!chip || flipping) return;
    if (gesture.swiped){ cancelHolds(); return; }
    if (chip === 'bell'){ if (bellHeld){ Audio.bellUp(); bellHeld = false; } return; }
    if (chip === 'silence'){
      if (silenceHeld){ silenceHeld = false; Audio.silenceUp(); Bus.emit('silence.hold', { on:false }); }
      return;
    }
    if (chip === 'voice'){
      Audio.Voice.toggle().then(renderDeck).catch(function(){ hint('нет микрофона'); });
      return;
    }
    if (chip === 'brush'){
      brushOn = !brushOn;
      Bus.emit('brush.set', { on:brushOn });
      renderDeck();
      if (brushOn) hint('рисуй полем');
      return;
    }
    if (chip === 'sample'){
      if (holdTimers.sample){
        clearTimeout(holdTimers.sample); delete holdTimers.sample;
        if (Audio.Sample.has()){ Audio.Sample.toggleLoop(); renderDeck(); }
        else hint('зажми — запиши');
      } else if (recHold){
        recHold = false; b.classList.remove('rec');
        clearTimeout(holdTimers.recMax); delete holdTimers.recMax;
        Audio.Sample.stopRec().then(renderDeck);
      }
      return;
    }
    if (chip === 'picture'){
      if (holdTimers.picture){ clearTimeout(holdTimers.picture); delete holdTimers.picture; }
      castChip('picture');
      return;
    }
    if (chip === 'psalm'){
      if (holdTimers.psalm){ clearTimeout(holdTimers.psalm); delete holdTimers.psalm; }
      castChip('psalm');
      return;
    }
    castChip(chip);
  });
  b.addEventListener('pointercancel', function(){ b.classList.remove('pressed'); });
});

/* ═══════════════════════════════════════════════
   ФЕЙДЕР · СКОРОСТЬ ЛЕНТЫ · ОБУЧЕНИЕ · ВРАТА
   ═══════════════════════════════════════════════ */
(function Fader(){
  var el = document.getElementById('fader'), knob = document.getElementById('knob');
  var active = false;
  function setFromX(clientX){
    var r = el.getBoundingClientRect(), pad = 24;
    var t = Math.min(1, Math.max(0, (clientX - r.left - pad) / (r.width - pad * 2)));
    knob.style.left = (pad + t * (r.width - pad * 2)) + 'px';
    Audio.setMix(t);
    Bus.emit('fader.set', { mix:t });
  }
  el.addEventListener('pointerdown', function(e){
    e.stopPropagation(); active = true;
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    setFromX(e.clientX);
  });
  el.addEventListener('pointermove', function(e){ if (active) setFromX(e.clientX); });
  ['pointerup', 'pointercancel'].forEach(function(n){
    el.addEventListener(n, function(){ active = false; });
  });
  knob.style.left = '24px';
})();

(function FlowSlider(){
  var el = document.getElementById('flow'), knob = document.getElementById('flowKnob');
  var active = false;
  function place(){
    el.style.top = '96px';
    el.style.height = (hexTop() - 96 - 40) + 'px';
  }
  place(); addEventListener('resize', place);
  function setFromY(clientY){
    var r = el.getBoundingClientRect();
    var t = Math.min(1, Math.max(0, (clientY - r.top) / r.height));
    knob.style.top = (t * 100) + '%';
    flowSpeed = 2 + t * 58;                    /* 2..60 px/s */
    Bus.emit('flow.set', { speed: flowSpeed });
  }
  el.addEventListener('pointerdown', function(e){
    e.stopPropagation(); active = true; el.classList.add('touch');
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    setFromY(e.clientY);
  });
  el.addEventListener('pointermove', function(e){ if (active) setFromY(e.clientY); });
  ['pointerup', 'pointercancel'].forEach(function(n){
    el.addEventListener(n, function(){ active = false; el.classList.remove('touch'); });
  });
  knob.style.top = ((16 - 2) / 58 * 100) + '%';
})();

/* лента начинается с обучения: приглашения проплывают и тают */
function teach(){
  var lessons = ['голос — в центре', 'своди ● и ∿', 'свайп — переворот', 'кисть — рисуй полем', 'зажми тишину', 'дурачься смело'];
  lessons.forEach(function(str, i){
    setTimeout(function(){ Field.addText(str); }, 2500 + i * 6500);
  });
}

var gate = document.getElementById('gate');
gate.addEventListener('pointerdown', function(){
  Audio.start();
  gate.classList.add('off');
  teach();
  if (navigator.wakeLock && navigator.wakeLock.request)
    navigator.wakeLock.request('screen').catch(function(){});
});

document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();
</script>
